<script id="v116-white-noise-page-script">
function openWhiteNoisePage(){const p=document.getElementById('sgWhiteNoisePage');if(!p)return;p.classList.add('open');p.setAttribute('aria-hidden','false');document.body.dataset.sgBeforeNoiseOverflow=document.documentElement.style.overflow||'';document.documentElement.style.overflow='hidden';updateWhiteNoisePageUI()}
function closeWhiteNoisePage(){const p=document.getElementById('sgWhiteNoisePage');if(!p)return;p.classList.remove('open');p.setAttribute('aria-hidden','true');document.documentElement.style.overflow=document.body.dataset.sgBeforeNoiseOverflow||'';}
function toggleWhiteNoiseChannel(kind){if(!activeNoises||!Object.prototype.hasOwnProperty.call(activeNoises,kind))return;toggleStudyRoomNoise(kind);updateWhiteNoisePageUI()}
function toggleWhiteNoiseMaster(){const any=Object.values(activeNoises).some(Boolean);if(any){stopAmbientNoise()}else{['rain'].forEach(k=>{if(!activeNoises[k])startNoiseChannel(k)})}updateWhiteNoisePageUI()}
function setWhiteNoiseVolume(v){setAmbientVolume(v);const el=document.getElementById('sgWnVolumeValue');if(el)el.textContent=Math.round(Number(v)||0)+'%';const old=document.getElementById('studyAmbientVolume');if(old)old.value=v;updateWhiteNoisePageUI()}
function updateWhiteNoisePageUI(){const p=document.getElementById('sgWhiteNoisePage');if(!p)return;const active=Object.values(activeNoises||{}).some(Boolean);const status=p.querySelector('#sgWnStatus');if(status)status.textContent=active?'播放中 · '+Object.keys(activeNoises).filter(k=>activeNoises[k]).map(k=>({rain:'雨聲',waves:'海浪',library:'森林風聲',cafe:'咖啡廳',clock:'時鐘滴答'}[k]||k)).join('、'):'尚未播放';const master=p.querySelector('#sgWnMaster');if(master)master.textContent=active?'■ 停止全部':'▶ 播放雨聲';p.querySelectorAll('[data-wn-kind]').forEach(b=>{const on=!!activeNoises[b.dataset.wnKind];b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on))});const vol=p.querySelector('#sgWnVolume');if(vol&&document.activeElement!==vol)vol.value=ambientMasterVolume;const vv=p.querySelector('#sgWnVolumeValue');if(vv)vv.textContent=Math.round(ambientMasterVolume)+'%'}
const __sgOriginalOpenSettingsV116=window.openSettings;
window.openSettings=function(){__sgOriginalOpenSettingsV116.apply(this,arguments);requestAnimationFrame(()=>{const panel=document.querySelector('#modalRoot .modal');if(!panel||panel.querySelector('[data-sg-noise-settings]'))return;const custom=[...panel.querySelectorAll('details.settings-category-card,details.settings-category-details')].find(d=>/自定義/.test(d.querySelector(':scope > summary')?.textContent||''));if(!custom)return;const body=custom.querySelector(':scope > .settings-category-content,:scope > .settings-category-body');if(!body)return;const details=document.createElement('details');details.className='settings-subcategory settings-category-details';details.dataset.sgNoiseSettings='true';details.innerHTML='<summary class="settings-category-summary"><span class="settings-category-heading"><span class="settings-category-title">🎵 白噪音設定</span></span><span class="settings-category-chevron" aria-hidden="true">⌄</span></summary><div class="settings-category-content"><label class="flex items-center justify-between gap-3 mb-3"><span>進入自習室時自動播放 BGM</span><input id="sgNoiseAutoPlay" type="checkbox"></label><label class="block text-sm">自動播放來源<select id="sgNoiseAutoSource" class="w-full mt-2 rounded-xl p-3"><option value="none">不自動播放</option><option value="noise">預設白噪音</option><option value="youtube">YouTube BGM</option></select></label><label class="block text-sm mt-3">預設音量 <span id="sgNoisePrefVolumeValue">22%</span><input id="sgNoisePrefVolume" data-sg-independent-volume="1" type="range" min="0" max="100" value="22" class="w-full" oninput="document.getElementById(\'sgNoisePrefVolumeValue\').textContent=this.value+\'%\'"></label><label class="block text-sm mt-3">YouTube BGM 網址／清單<input id="sgNoiseYoutubeUrl" class="w-full mt-2 rounded-xl p-3" placeholder="貼上 YouTube 網址或清單連結"></label><button class="btn w-full mt-3" type="button" onclick="saveWhiteNoisePreferences()">儲存白噪音偏好</button><button class="btn w-full mt-2" type="button" onclick="openWhiteNoisePage()">開啟白噪音獨立頁面</button></div>';
const saveButtons=[...body.querySelectorAll('button')].filter(b=>/儲存|保存|套用/.test(b.textContent||''));if(saveButtons.length)body.insertBefore(details,saveButtons[0].closest('div')||saveButtons[0]);else body.appendChild(details);
const pref=JSON.parse(localStorage.getItem('shiguang.whiteNoisePrefs.v1')||'{}');details.querySelector('#sgNoiseAutoPlay').checked=!!pref.autoPlay;details.querySelector('#sgNoisePrefVolume').value=Number.isFinite(pref.volume)?pref.volume:22;details.querySelector('#sgNoisePrefVolumeValue').textContent=(Number.isFinite(pref.volume)?pref.volume:22)+'%';details.querySelector('#sgNoiseYoutubeUrl').value=pref.youtubeUrl||'';});};
function sgNoiseResolveSource(raw){raw=String(raw==null?'':raw);if(raw.indexOf('youtube:')===0){return {source:'youtube',trackId:raw.slice(8)}}return {source:(raw==='none'||raw==='noise'||raw==='youtube')?raw:'noise',trackId:''}}
function saveWhiteNoisePreferences(){let pref={};try{pref=JSON.parse(localStorage.getItem('shiguang.whiteNoisePrefs.v1')||'{}')||{}}catch(_){pref={}}const el=id=>document.getElementById(id);pref.autoPlay=!!el('sgNoiseAutoPlay')?.checked;const picked=sgNoiseResolveSource(el('sgNoiseAutoSource')?.value);pref.autoSource=picked.source;pref.youtubeTrackId=picked.trackId;const volEl=el('sgNoisePrefVolume');if(volEl){pref.volume=Math.max(0,Math.min(100,Number(volEl.value)||0))}else if(!Number.isFinite(pref.volume)){pref.volume=22}const typedUrl=(el('sgNoiseYoutubeUrl')?.value||'').trim();let track=null;if(picked.trackId){try{track=(typeof studyBgmList==='function'?studyBgmList():[]).find(x=>x&&x.videoId===picked.trackId)||null}catch(_){track=null}}if(track){pref.youtubeUrl='https://www.youtube.com/watch?v='+track.videoId;pref.youtubeName=track.name||'YouTube BGM'}else{pref.youtubeUrl=typedUrl}const fx=el('sgNoiseEffectsEnabled');if(fx)pref.effectsEnabled=!!fx.checked;localStorage.setItem('shiguang.whiteNoisePrefs.v1',JSON.stringify(pref));if(typeof showToast==='function')showToast('白噪音設定已儲存')} 
function openYoutubeBgmSettingsPage(){const p=document.getElementById('sgYoutubeBgmSettingsPage');if(!p)return;const pref=JSON.parse(localStorage.getItem('shiguang.whiteNoisePrefs.v1')||'{}');document.getElementById('sgBgmUrlPref').value=pref.youtubeUrl||'';document.getElementById('sgBgmNamePref').value=pref.youtubeName||'';p.classList.add('open');p.setAttribute('aria-hidden','false');document.documentElement.style.overflow='hidden';refreshYoutubeBgmPreferenceList()}
function closeYoutubeBgmSettingsPage(){const p=document.getElementById('sgYoutubeBgmSettingsPage');if(!p)return;p.classList.remove('open');p.setAttribute('aria-hidden','true');document.documentElement.style.overflow='';}
function saveYoutubeBgmPreference(){const url=(document.getElementById('sgBgmUrlPref')?.value||'').trim();const name=(document.getElementById('sgBgmNamePref')?.value||'').trim();const pref=JSON.parse(localStorage.getItem('shiguang.whiteNoisePrefs.v1')||'{}');pref.youtubeUrl=url;pref.youtubeName=name;localStorage.setItem('shiguang.whiteNoisePrefs.v1',JSON.stringify(pref));const status=document.getElementById('sgBgmPrefStatus');if(status)status.textContent='已儲存網址偏好。實際播放仍需由原播放器載入有效的 YouTube 影片網址。';refreshYoutubeBgmPreferenceList()}
function refreshYoutubeBgmPreferenceList(){const el=document.getElementById('sgBgmPrefList');if(!el)return;let list=[];try{list=typeof studyBgmList==='function'?studyBgmList():[]}catch(e){};const pref=JSON.parse(localStorage.getItem('shiguang.whiteNoisePrefs.v1')||'{}');el.innerHTML=(list.length?list.map(x=>'<div class="py-2 border-b border-slate-700">'+String(x.name||'YouTube BGM').replace(/[<>]/g,'')+'<div class="text-xs text-slate-400 break-all">'+String(x.videoId||'')+'</div></div>').join(''):'<p class="text-slate-400">原播放器目前沒有可讀取的歌曲項目。</p>')+(pref.youtubeUrl?'<div class="py-2"><strong>偏好網址</strong><div class="text-xs text-slate-400 break-all">'+pref.youtubeUrl.replace(/[<>]/g,'')+'</div></div>':'')}

</script>

<script id="v1151-ensure-noise-settings-minimal-icons">
(()=>{

<script id="v1157-bgm-source-and-volume">
(()=>{
'use strict';
/* Owns: (1) the saved-track entries inside #sgNoiseAutoSource, (2) the independent #sgNoisePrefVolume wiring.

   autoPlay, autoSource ('none'|'noise'|'youtube'), youtubeTrackId, youtubeUrl, youtubeName, volume, effectsEnabled.

const KEY='shiguang.whiteNoisePrefs.v1';

/* ---- (1) source menu: base sources + saved tracks in ONE select ---- */
function buildSourceMenu(noise){
  const sel=q(noise,'#sgNoiseAutoSource');if(!sel)return;
  let base=q(sel,'optgroup[data-sg-base-group]');
  if(!base){
    base=document.createElement('optgroup');base.label='預設播放來源';base.dataset.sgBaseGroup='1';
    [['none','不自動播放'],['noise','預設白噪音'],['youtube','YouTube BGM']].forEach(([v,txt])=>{
      let o=[...sel.options].find(x=>x.value===v);
      if(!o){o=document.createElement('option');o.value=v;o.textContent=txt}

    });

  if(url&&!url.dataset.sgUrlBound){
    url.dataset.sgUrlBound='1';
    url.addEventListener('input',()=>{
      const r=resolve(sel.value);if(!r.trackId)return;
      const t=savedTracks().find(x=>x.videoId===r.trackId);
      if(t&&url.value.trim()!==trackUrl(t)){sel.value='youtube';sel.dataset.sgUserChanged='1'}  /* a hand-typed URL is a custom source, not the saved track */
    });

/* ---- (2) #sgNoisePrefVolume: independent value text + live fill, never locked, never part of the global preview ---- */
function paintVolume(vol){
  const v=Math.max(0,Math.min(100,Number(vol.value)||0));

  if(label)label.classList.remove('sg-focus-row','course-height-preview-focus','course-height-preview-path','course-height-preview-muted');
  if(!vol.dataset.sgVolBound){
    vol.dataset.sgVolBound='1';
    const sync=()=>{const out=q(noise,'#sgNoisePrefVolumeValue');if(out)out.textContent=vol.value+'%';paintVolume(vol)};
    vol.addEventListener('input',sync);
    vol.addEventListener('change',sync);
  }
  paintVolume(vol);
  const out=q(noise,'#sgNoisePrefVolumeValue');if(out)out.textContent=vol.value+'%';
}

function run(){
  const root=document.getElementById('modalRoot');if(!root)return;
  root.querySelectorAll('details[data-sg-noise-settings]').forEach(n=>{try{wireVolume(n);buildSourceMenu(n)}catch(e){try{console.warn('[sg-bgm]',e)}catch(_){}}});

}
})();

<script id="v121-ui-js">
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const raf=window.requestAnimationFrame||(f=>setTimeout(f,16));
/* ---------- A. light-theme course colours ---------- */
const hex=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(h||'');if(!m)return null;const n=parseInt(m[1],16);return [(n>>16)&255,(n>>8)&255,n&255]};
const mix=(c,w,a)=>c.map(v=>Math.round(255-(255-v)*a)).join(',');
function lightCards(){
  const light=document.body.classList.contains('light-theme');
  document.querySelectorAll('.course').forEach(el=>{
    if(!light){if(el.dataset.sgLc){delete el.dataset.sgLc;['--sg-lc-bg','--sg-lc-fg','--sg-lc-bd'].forEach(k=>el.style.removeProperty(k))}return}
    if(el.dataset.sgLc)return;
    const st=el.getAttribute('style')||'';
    const col=/(?:^|;)\s*color:\s*(#[0-9a-f]{6})/i.exec(st);
    if(!col){el.dataset.sgLc='empty';return}
    const c=hex(col[1]);if(!c){el.dataset.sgLc='empty';return}
    el.style.setProperty('--sg-lc-bg','rgb('+mix(c,0,.2)+')');
    el.style.setProperty('--sg-lc-fg','rgb('+c.map(v=>Math.round(v*.42)).join(',')+')');
    el.style.setProperty('--sg-lc-bd','rgb('+mix(c,0,.45)+')');
    el.dataset.sgLc='card';
  });
}
['render','applyTheme','toggleTheme','renderSchedule'].forEach(n=>{const f=window[n];if(typeof f==='function'&&!f.__v121ui){const w=function(){const r=f.apply(this,arguments);try{lightCards()}catch(_){}return r};w.__v121ui=true;try{window[n]=w}catch(_){}}});
/* theme switch invalidates the cache of already-processed cards */
const themeObs=new MutationObserver(()=>{document.querySelectorAll('.course[data-sg-lc]').forEach(e=>{delete e.dataset.sgLc});lightCards()});
themeObs.observe(document.body,{attributes:true,attributeFilter:['class']});
/* ---------- B. page transition (no flash) ---------- */
function animateMain(){const m=document.getElementById('main');if(!m||!m.animate)return;try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return}catch(_){}m.getAnimations().forEach(a=>a.cancel());m.animate([{opacity:0,transform:'translateY(14px) scale(.985)'},{opacity:1,transform:'none'}],{duration:300,easing:'cubic-bezier(.22,.8,.24,1)'})}
(()=>{const f=window.go;if(typeof f==='function'&&!f.__v121anim){const w=function(p){let before='';try{before=page}catch(_){}const r=f.apply(this,arguments);if(p!==before)animateMain();return r};w.__v121anim=true;window.go=w}})();
/* ---------- C. global smart haptics (reuses the app's own sgHaptic + its preference switches) ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest&&e.target.closest('button,summary,[role=button],.navbtn,.arc-nav-item,input[type=checkbox],input[type=radio],.course,.quick-category,.drawer-link');
  if(!t||typeof window.sgHaptic!=='function')return;
  const txt=(t.textContent||'').trim(),oc=t.getAttribute('onclick')||'';
  let kind='light';
  if(/delete|remove|clear|刪除|清除/i.test(oc+txt))kind='alert';
  else if(/^(儲存|保存|完成|確認|新增|匯入|匯出|送出|套用)/.test(txt)||/save|submit|confirm/i.test(oc))kind='task';
  else if(t.matches('.course'))kind='schedule';
  window.sgHaptic(kind);
},true);
/* ---------- D. haptic category geometry ---------- */
function fixHaptic(){
  const acc=document.getElementById('sgHapticAccordion');if(!acc||acc.dataset.sg12)return;
  const sum=acc.querySelector(':scope>summary'),body=acc.querySelector(':scope>.settings-category-body,:scope>div');if(!sum)return;
  acc.dataset.sg12='1';acc.classList.remove('taskrow');acc.classList.add('settings-category-card','settings-category-details');
  sum.className='settings-category-summary';
  sum.innerHTML='<span class="settings-category-heading"><span class="settings-category-icon" aria-hidden="true"></span><span class="settings-category-title">觸覺震動回饋</span></span><span class="settings-category-chevron" aria-hidden="true">⌄</span>';
  if(body){body.classList.add('settings-category-content');const intro=document.createElement('p');intro.className='sg12-intro';intro.textContent='全域開關、任務完成、導覽操作與提醒；裝置不支援時自動略過。';body.insertBefore(intro,body.firstChild);const mark=body.querySelector('.sg-haptic-category-mark');if(mark){const row=mark.closest('.flex');if(row)row.style.display='none'}}
  if(typeof window.__sgApplySettingsIcons==='function')window.__sgApplySettingsIcons();
}
(()=>{const f=window.openSettings;if(typeof f==='function'&&!f.__v121hap){const w=function(...a){const r=f.apply(this,a);[150,450,900,1800].forEach(ms=>setTimeout(fixHaptic,ms));return r};w.__v121hap=true;window.openSettings=w}})();
/* ---------- E. colour emoji -> removed / plain symbols (DOM only; user content and code untouched) ---------- */
const EMO=/\p{Emoji_Presentation}|\p{Extended_Pictographic}\uFE0F|[\u200D\uFE0F]/gu;
const SOLE={'📚':'▤','🎯':'◎','✅':'✓','❌':'✕','⚙️':'⚙','☀️':'☼','🌙':'☾','🍅':'◔','📝':'✎','📅':'▦','🔒':'','🔓':''};
const SKIP='script,style,textarea,input,.course,[contenteditable],.sg-keep-emoji';
function cleanText(n){
  const v=n.nodeValue;if(!v||!EMO.test(v)){EMO.lastIndex=0;return}EMO.lastIndex=0;
  const trimmed=v.trim();
  if(SOLE[trimmed]!==undefined){n.nodeValue=SOLE[trimmed];return}
  let out=v.replace(EMO,'');out=out.replace(/^\s{1,2}(?=\S)/,'').replace(/[ \u00a0]{2,}/g,' ');
  if(trimmed&&!out.trim())out='';
  if(out!==v)n.nodeValue=out;
}
function sweep(root){
  if(!root)return;
  if(root.nodeType===3){const p=root.parentElement;if(p&&!p.closest(SKIP))cleanText(root);return}
  if(root.nodeType!==1||root.closest(SKIP))return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);let n;const list=[];while((n=w.nextNode()))list.push(n);
  list.forEach(t=>{const p=t.parentElement;if(p&&!p.closest(SKIP))cleanText(t)});
  root.querySelectorAll&&root.querySelectorAll('[title],[aria-label],[placeholder]').forEach(e=>['title','aria-label','placeholder'].forEach(a=>{const v=e.getAttribute(a);if(v&&EMO.test(v)){EMO.lastIndex=0;e.setAttribute(a,v.replace(EMO,'').trim())}EMO.lastIndex=0}));
}
let pending=new Set(),sched=false;
const emoObs=new MutationObserver(ms=>{ms.forEach(m=>{if(m.type==='characterData')pending.add(m.target);else m.addedNodes.forEach(n=>pending.add(n))});if(!sched){sched=true;raf(()=>{sched=false;const items=[...pending];pending=new Set();items.forEach(n=>{try{sweep(n)}catch(_){}});try{lightCards()}catch(_){}})}});
function startEmo(){sweep(document.body);emoObs.observe(document.body,{childList:true,subtree:true,characterData:true})}
if(document.body)startEmo();else document.addEventListener('DOMContentLoaded',startEmo);
/* ---------- F. calculator: ( ) ^ x² x³ % e abs, own parser (no eval / Function) ---------- */
const FN={'sin(':Math.sin,'cos(':Math.cos,'tan(':Math.tan,'√(':Math.sqrt,'log(':Math.log10,'ln(':Math.log,'abs(':Math.abs};
function calcEval(src){
  const s=src.replace(/\s+/g,'');let i=0;
  const tokens=[];
  while(i<s.length){const c=s[i];
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const n=Number(s.slice(i,j));if(!Number.isFinite(n))throw Error('num');tokens.push({t:'n',v:n});i=j;continue}
    if('＋+'.includes(c)){tokens.push({t:'o',v:'+'});i++;continue}
    if('−-'.includes(c)){tokens.push({t:'o',v:'-'});i++;continue}
    if('×*'.includes(c)){if(s[i+1]==='*'){tokens.push({t:'o',v:'^'});i+=2}else{tokens.push({t:'o',v:'*'});i++}continue}
    if('÷/'.includes(c)){tokens.push({t:'o',v:'/'});i++;continue}
    if(c==='^'){tokens.push({t:'o',v:'^'});i++;continue}
    if(c==='%'){tokens.push({t:'o',v:'%'});i++;continue}
    if(c==='('){tokens.push({t:'('});i++;continue}
    if(c===')'){tokens.push({t:')'});i++;continue}
    if(c==='π'){tokens.push({t:'n',v:Math.PI});i++;continue}
    if(c==='e'&&!/[a-z]/.test(s[i+1]||'')){tokens.push({t:'n',v:Math.E});i++;continue}
    let f=null;for(const k of Object.keys(FN)){if(s.startsWith(k,i)){f=k;break}}
    if(f){tokens.push({t:'f',v:f});i+=f.length;continue}
    throw Error('bad');
  }
  let depth=0;tokens.forEach(k=>{if(k.t==='('||k.t==='f')depth++;if(k.t===')')depth--});while(depth-- >0)tokens.push({t:')'});
  let p=0;const peek=()=>tokens[p];
  function expr(){let v=term();while(peek()&&peek().t==='o'&&(peek().v==='+'||peek().v==='-')){const o=tokens[p++].v;const r=term();v=o==='+'?v+r:v-r}return v}
  function term(){let v=unary();for(;;){const k=peek();if(!k)break;if(k.t==='o'&&(k.v==='*'||k.v==='/')){p++;const r=unary();v=k.v==='*'?v*r:v/r}else if(k.t==='('||k.t==='f'||k.t==='n'){v=v*unary()}else break}return v}
  function unary(){const k=peek();if(k&&k.t==='o'&&(k.v==='-'||k.v==='+')){p++;const v=unary();return k.v==='-'?-v:v}return power()}
  function power(){let b=post();if(peek()&&peek().t==='o'&&peek().v==='^'){p++;const e=unary();return Math.pow(b,e)}return b}
  function post(){let v=prim();while(peek()&&peek().t==='o'&&peek().v==='%'){p++;v=v/100}return v}
  function prim(){const k=tokens[p++];if(!k)throw Error('end');if(k.t==='n')return k.v;if(k.t==='f'){const v=expr();if(!tokens[p]||tokens[p].t!==')')throw Error('paren');p++;return FN[k.v](v)}if(k.t==='('){const v=expr();if(!tokens[p]||tokens[p].t!==')')throw Error('paren');p++;return v}throw Error('syntax')}
  const r=expr();if(p<tokens.length)throw Error('trail');return r;
}
window.__sgCalcEval=calcEval;
let ce='';
window.calcPress=function(v){
  try{if(typeof window.sgHaptic==='function')window.sgHaptic('light')}catch(_){}
  const disp=document.getElementById('calcDisplay'),ex=document.getElementById('calcExpression');
  if(v==='C')ce='';
  else if(v==='⌫')ce=ce.replace(/(sin\(|cos\(|tan\(|log\(|ln\(|abs\(|√\()$|.$/,'');
  else if(v==='=' ){try{const r=calcEval(ce);if(!Number.isFinite(r))throw Error('nan');if(ex)ex.textContent=ce+' =';ce=String(Number(r.toPrecision(12)))}catch(_){if(ex)ex.textContent='算式無法計算';ce=''}}
  else if(v==='x²')ce+='^2';else if(v==='x³')ce+='^3';else if(v==='xʸ')ce+='^';else if(v==='1/x')ce='1÷('+(ce||'1')+')';
  else ce+=v;
  if(disp)disp.textContent=ce||'0';if(v!=='='&&ex)ex.textContent='';
};
function upgradeCalc(){
  const g=document.querySelector('.calc-grid');if(!g||g.dataset.sg12)return;g.dataset.sg12='1';ce='';
  const keys=[['sin(','fn'],['cos(','fn'],['tan(','fn'],['√(','fn'],['(','fn'],[')','fn'],['xʸ','fn'],['x²','fn'],['7',''],['8',''],['9',''],['÷','operator'],['4',''],['5',''],['6',''],['×','operator'],['1',''],['2',''],['3',''],['−','operator'],['0',''],['.',''],['%','fn'],['＋','operator'],['π','fn'],['e','fn'],['log(','fn'],['ln(','fn'],['x³','fn'],['1/x','fn'],['⌫','operator'],['C','operator'],['=','equals']];
  g.innerHTML='';keys.forEach(([v,c])=>{const b=document.createElement('button');b.type='button';if(c)b.className=c;b.textContent=v;b.addEventListener('click',()=>window.calcPress(v));if(v==='=')b.style.gridColumn='span 4';g.appendChild(b)});
  const note=g.parentElement.querySelector('.widget-muted:last-child');if(note)note.textContent='支援 ( )、次方 xʸ、平方、立方、百分比與三角函數（弧度制）。缺少的右括號會自動補上。';
}
/* ---------- G. live exchange rates ---------- */
const FXKEY='shiguang.fx.v1';
const ZH={USD:'美元',TWD:'新台幣',JPY:'日圓',EUR:'歐元',GBP:'英鎊',CNY:'人民幣',HKD:'港幣',KRW:'韓元',AUD:'澳幣',CAD:'加幣',SGD:'新加坡幣',THB:'泰銖',MYR:'馬幣',VND:'越南盾',PHP:'菲律賓披索',IDR:'印尼盾',CHF:'瑞士法郎',NZD:'紐西蘭幣',INR:'印度盧比',SEK:'瑞典克朗',NOK:'挪威克朗',DKK:'丹麥克朗',RUB:'俄羅斯盧布',BRL:'巴西雷亞爾',MXN:'墨西哥披索',ZAR:'南非幣',TRY:'土耳其里拉',AED:'阿聯迪拉姆',SAR:'沙烏地里亞爾',MOP:'澳門幣'};
const PREFERRED=['TWD','USD','JPY','EUR','GBP','CNY','HKD','KRW','AUD','CAD','SGD','THB','MYR','VND','PHP','IDR','CHF','NZD','INR'];
let fx=null;
try{fx=JSON.parse(localStorage.getItem(FXKEY)||'null')}catch(_){}
async function fetchRates(force){
  if(!force&&fx&&Date.now()-fx.ts<6*3600e3)return fx;
  const srcs=[['https://open.er-api.com/v6/latest/USD',j=>j&&j.result==='success'?{rates:j.rates,date:j.time_last_update_utc,src:'open.er-api.com'}:null],['https://api.frankfurter.app/latest?from=USD',j=>j&&j.rates?{rates:Object.assign({USD:1},j.rates),date:j.date,src:'frankfurter.app（歐洲央行）'}:null]];
  for(const [url,parse] of srcs){try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);const r=await fetch(url,{signal:ctl.signal});clearTimeout(to);if(!r.ok)continue;const d=parse(await r.json());if(d){fx={ts:Date.now(),rates:d.rates,date:d.date,src:d.src};try{localStorage.setItem(FXKEY,JSON.stringify(fx))}catch(_){}return fx}}catch(_){}}
  return fx;
}
function fxNote(msg){let n=document.getElementById('fxNote');if(!n){const r=document.getElementById('unitResult');if(!r)return;n=document.createElement('div');n.id='fxNote';r.parentElement.appendChild(n)}n.textContent=msg}
function fxCodes(){const rates=fx&&fx.rates?fx.rates:{};const all=Object.keys(rates);return [...PREFERRED.filter(c=>rates[c]),...all.filter(c=>!PREFERRED.includes(c)).sort()]}
const origUpdate=window.updateUnitOptions,origConvert=window.convertUnits;
window.updateUnitOptions=function(){
  const type=document.getElementById('unitType')?.value;
  if(type!=='currency'){const n=document.getElementById('fxNote');if(n)n.remove();return origUpdate&&origUpdate.apply(this,arguments)}
  const from=document.getElementById('unitFrom'),to=document.getElementById('unitTo');if(!from||!to)return;
  const fill=()=>{const codes=fxCodes();if(!codes.length){fxNote('目前沒有可用匯率，請連線後再試。');return}const opt=c=>'<option value="'+c+'">'+c+(ZH[c]?' '+ZH[c]:'')+'</option>';from.innerHTML=to.innerHTML=codes.map(opt).join('');from.value='USD';to.value=codes.includes('TWD')?'TWD':codes[1]||codes[0];window.convertUnits()};
  fill();fxNote('正在取得最新匯率…');
  fetchRates(false).then(d=>{if(document.getElementById('unitType')?.value!=='currency')return;const f=from.value,t=to.value;fill();if(d){if([...from.options].some(o=>o.value===f))from.value=f;if([...to.options].some(o=>o.value===t))to.value=t;window.convertUnits()}});
};
window.convertUnits=function(){
  const type=document.getElementById('unitType')?.value;
  if(type!=='currency')return origConvert&&origConvert.apply(this,arguments);
  const from=document.getElementById('unitFrom')?.value,to=document.getElementById('unitTo')?.value,val=Number(document.getElementById('unitInput')?.value),el=document.getElementById('unitResult');
  if(!el||!Number.isFinite(val))return;
  if(!fx||!fx.rates||!fx.rates[from]||!fx.rates[to]){el.textContent='—';return}
  const r=val/fx.rates[from]*fx.rates[to];el.textContent=Number(r.toPrecision(10)).toLocaleString('en-US',{maximumFractionDigits:6})+' '+to;
  const age=Math.round((Date.now()-fx.ts)/60000);
  fxNote('匯率來源：'+fx.src+'；資料日期：'+(fx.date||'—')+'；本機更新於 '+(age<1?'剛剛':age<60?age+' 分鐘前':Math.round(age/60)+' 小時前')+'。離線時使用上次儲存的匯率，僅供參考。');
};
function upgradeUnits(){
  const sel=document.getElementById('unitType');if(!sel||sel.dataset.sg12)return;sel.dataset.sg12='1';
  const o=document.createElement('option');o.value='currency';o.textContent='匯率（實時）';sel.appendChild(o);
  const btn=document.createElement('button');btn.type='button';btn.className='btn w-full mt-3';btn.textContent='重新取得最新匯率';btn.addEventListener('click',async()=>{if(sel.value!=='currency')sel.value='currency',window.updateUnitOptions();fxNote('正在更新匯率…');const d=await fetchRates(true);fxNote(d?'已更新。':'更新失敗，沿用上次匯率。');window.updateUnitOptions()});
  const card=sel.closest('.widget-card');card&&card.appendChild(btn);
}
const toolObs=new MutationObserver(()=>{upgradeCalc();upgradeUnits()});
toolObs.observe(document.body,{childList:true,subtree:true});
upgradeCalc();upgradeUnits();
})();
</script>

const CAP=26000;
function gather(m){
  let out='',parts=[];
  m.fns.forEach(n=>{try{const f=window[n];if(typeof f==='function'){const s=String(f);if(!/\{\s*\[native code\]\s*\}/.test(s)&&!/__v121/.test(s.slice(0,0))){parts.push('// function '+n+'\n'+s)}}}catch(_){}});
  m.ids.forEach(id=>{const e=document.getElementById(id);if(e&&e.textContent.trim())parts.push('/* #'+id+' ('+e.tagName.toLowerCase()+') */\n'+e.textContent.trim())});
  if(m.dom){const e=document.querySelector(m.dom);if(e)parts.push('<!-- 目前畫面 DOM：'+m.dom+' -->\n'+e.outerHTML.slice(0,3500))}
  out=parts.join('\n\n');return out;
}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(txt);

}
function buildAiPanel(){

  const chips=sec.querySelector('.sg12-chips'),sel=new Set();
  MODS.forEach(m=>{const b=document.createElement('button');b.type='button';b.className='sg12-chip';b.textContent=m.name;b.dataset.id=m.id;b.addEventListener('click',()=>{sel.has(m.id)?sel.delete(m.id):sel.add(m.id);paint()});chips.appendChild(b)});
  const info=sec.querySelector('#sg12AiInfo'),ta=sec.querySelector('#sg12AiProblem');
  function paint(){chips.querySelectorAll('.sg12-chip').forEach(b=>b.classList.toggle('on',sel.has(b.dataset.id)));const chosen=MODS.filter(m=>sel.has(m.id));const len=chosen.reduce((n,m)=>n+gather(m).length,0);info.textContent=chosen.length?('已選 '+chosen.length+' 個模組，約 '+len.toLocaleString()+' 字元'+(len>CAP?'（超過上限，會自動截短）':'')):'尚未選擇模組；輸入問題可自動判斷。'}
  ta.addEventListener('input',()=>{const q=ta.value;if(!q.trim())return;const scored=MODS.map(m=>({m,s:m.kw.reduce((n,k)=>n+(q.includes(k)?1:0),0)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,2);sel.clear();scored.forEach(x=>sel.add(x.m.id));paint()});
