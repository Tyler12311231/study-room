/* Comprehensive motion polish: transform/opacity only for low-cost transitions. */
:root{--motion-fast:150ms;--motion-ui:260ms;--motion-ease:cubic-bezier(.2,.75,.25,1)}
.btn,.pill,.drawer-link,.taskrow,.planner-day-card,.planner-day-task,.course,.navbtn,.study-action,.study-mode-buttons button,.study-start-buttons button,.bottom-nav-glass,.quick-add{transition:transform var(--motion-fast) var(--motion-ease),background-color var(--motion-ui) ease,border-color var(--motion-ui) ease,box-shadow var(--motion-ui) ease,filter var(--motion-fast) ease}
.btn:active,.pill:active,.drawer-link:active,.study-action:active,.study-mode-buttons button:active,.study-start-buttons button:active,.navbtn:active{transform:scale(.97)}
.taskrow,.planner-day-card,.planner-day-task,.course{will-change:transform}
.taskrow:hover,.planner-day-card:hover,.planner-day-task:hover{border-color:#58d6f566;box-shadow:0 8px 24px #02061722}
.modal-backdrop{opacity:1;transition:opacity 190ms ease;}
.modal-enter{opacity:0}.modal-enter-active{opacity:1}.modal-leave{opacity:0;pointer-events:none}
.modal-enter-panel{opacity:0;transform:translateY(12px) scale(.975);transition:transform 260ms var(--motion-ease),opacity 220ms ease;}
.modal-enter-panel.modal-enter-active{opacity:1;transform:translateY(0) scale(1)}
.modal-leave-panel{opacity:0;transform:translateY(8px) scale(.985)}
.timer-ring{will-change:background,filter}.timer-ring.is-running,.study-ring.is-running{animation:focus-breathe 2.8s ease-in-out infinite}
@keyframes focus-breathe{0%,100%{filter:drop-shadow(0 0 2px #58d6f522)}50%{filter:drop-shadow(0 0 15px #58d6f566)}}
.app-toast.show{animation:toast-pop 260ms var(--motion-ease) both}
@keyframes toast-pop{from{opacity:0;transform:translate(-50%,12px) scale(.98)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
#main{animation:page-enter 220ms var(--motion-ease) both}
@keyframes page-enter{from{opacity:.72;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
button:focus-visible,[role=button]:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #58d6f5;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

/* Draggable bottom-navigation pill */
.bottom-nav-glass{position:relative;isolation:isolate;touch-action:pan-y;}
.bottom-nav-indicator{position:absolute;z-index:1;top:8px;bottom:8px;left:0;width:0;border-radius:16px;pointer-events:auto;touch-action:none;cursor:grab;background:linear-gradient(135deg,rgba(255,255,255,.88),rgba(219,245,255,.66));border:1px solid rgba(255,255,255,.7);box-shadow:0 0 12px rgba(186,230,253,.3),0 0 24px rgba(125,211,252,.22),inset 0 1px 0 rgba(255,255,255,.8);opacity:.88;transform:translate3d(0,0,0);transition:left .32s cubic-bezier(.2,.85,.25,1),width .32s cubic-bezier(.2,.85,.25,1),transform .32s cubic-bezier(.2,.85,.25,1),box-shadow .2s,opacity .2s;will-change:left,width,transform;}
.bottom-nav-indicator:after{content:"";position:absolute;inset:1px;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 70%);pointer-events:none;}
.bottom-nav-indicator.dragging{transition:none!important;cursor:grabbing;opacity:1;box-shadow:0 0 16px rgba(186,230,253,.48),0 0 32px rgba(125,211,252,.35),inset 0 1px 0 rgba(255,255,255,.9);}
.bottom-nav-glass .navbtn{position:relative;z-index:2;background:transparent!important;}
.bottom-nav-glass .navbtn.active{color:#071522;text-shadow:none;}
.bottom-nav-glass .quick-add{position:relative;z-index:3;}
body.light-theme .bottom-nav-indicator{background:linear-gradient(135deg,rgba(255,255,255,.98),rgba(224,247,255,.82));border-color:rgba(255,255,255,.95);box-shadow:0 0 12px rgba(14,165,233,.18),0 0 24px rgba(56,189,248,.12),inset 0 1px 0 #fff;}
@media(prefers-reduced-motion:reduce){.bottom-nav-indicator{transition:none!important}.bottom-nav-glass .navbtn{transition:none!important}}

async function getSnapImage(id){const d=await openSnapImageDB();try{return await new Promise((resolve,reject)=>{const tx=d.transaction(SNAP_IMAGE_STORE,'readonly'),req=tx.objectStore(SNAP_IMAGE_STORE).get(id);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error||new Error('照片讀取失敗'))})}finally{d.close()}}
async function deleteSnapImage(id){try{const d=await openSnapImageDB();try{await new Promise((resolve,reject)=>{const tx=d.transaction(SNAP_IMAGE_STORE,'readwrite');tx.objectStore(SNAP_IMAGE_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{d.close()}}catch(e){console.warn('刪除本機照片失敗',e)}}
async function migrateLegacySnapImages(){let changed=false;for(const n of (db.snapNotes||[])){if(typeof n.image==='string'&&n.image.startsWith('data:image/')){try{const blob=await (await fetch(n.image)).blob();await putSnapImage(n.id,blob);n.image='idb-snap:'+n.id;changed=true}catch(e){console.warn('舊補抄照片移轉失敗，先保留原資料',e)}}}if(changed)save();return changed}
function hydrateSnapImages(root=document){root.querySelectorAll('img[data-snap-ref]').forEach(async img=>{const ref=img.dataset.snapRef;if(!ref||!ref.startsWith('idb-snap:')||img.dataset.snapHydrated==='1')return;img.dataset.snapHydrated='1';try{const blob=await getSnapImage(ref.slice(9));if(!blob){img.alt=(img.alt||'補抄照片')+'（本機照片不存在，請檢查原裝置或雲端同步）';return}const url=URL.createObjectURL(blob);img.src=url;img.dataset.snapObjectUrl=url}catch(e){console.warn('讀取補抄照片失敗',e);img.alt=(img.alt||'補抄照片')+'（讀取失敗）'}})}

// v9.11：版面自定義只保存在各裝置本機，但仍可透過 JSON 備份／還原搬移。
// 只隔離純版面偏好；課堂時間、番茄鐘、學期設定等一般設定仍照常同步。
const LOCAL_ONLY_LAYOUT_SETTING_KEYS=['homepageCustomization','navCustomization','scheduleLayout','plannerLayout','layoutCustomization','homeLayout','studyPlanLayout'];
const LOCAL_ONLY_CUSTOMIZATION_KEYS=['courseHeight','plannerHeight','scheduleWidth'];
function clonePlain(value){try{return JSON.parse(JSON.stringify(value??{}))}catch(e){return {}}}
const CLOUD_SYNC_PREF_KEY='shiguang.cloudSyncModules.v1';
const CLOUD_SYNC_DEFAULT=['schedule','tasks','matrix','notes','plans','focus','friends','settings','tools','other'];
function getCloudSyncModules(){try{const a=JSON.parse(localStorage.getItem(CLOUD_SYNC_PREF_KEY)||'null');return Array.isArray(a)?a.filter(x=>JSON_BACKUP_MODULES.some(m=>m.id===x)):CLOUD_SYNC_DEFAULT.slice()}catch(e){return CLOUD_SYNC_DEFAULT.slice()}}
function cloudSyncData(source=db){
 const out=clonePlain(source);out.settings ||= {};const chosen=getCloudSyncModules();
 for(const k of Object.keys(out)){const group=jsonModuleForDbKey(k);if(group&&!chosen.includes(group))delete out[k];}
 for(const k of LOCAL_ONLY_LAYOUT_SETTING_KEYS)delete out.settings[k];
 if(out.settings.customization&&typeof out.settings.customization==='object'){
  out.settings.customization={...out.settings.customization};for(const k of LOCAL_ONLY_CUSTOMIZATION_KEYS)delete out.settings.customization[k];
  if(!Object.keys(out.settings.customization).length)delete out.settings.customization;
 }
 return out;
}
function mergeLocalOnlyLayoutSettings(remoteData){
 const local=clonePlain(db),merged=clonePlain(remoteData),chosen=getCloudSyncModules();
 for(const [k,v] of Object.entries(local)){const group=jsonModuleForDbKey(k);if(group&&!chosen.includes(group))merged[k]=v;}
 merged.settings ||= {};const localSettings=local.settings||{};
 for(const k of LOCAL_ONLY_LAYOUT_SETTING_KEYS){if(Object.prototype.hasOwnProperty.call(localSettings,k))merged.settings[k]=clonePlain(localSettings[k]);else delete merged.settings[k];}
 if(localSettings.customization&&typeof localSettings.customization==='object'){
  merged.settings.customization={...(merged.settings.customization||{})};
  for(const k of LOCAL_ONLY_CUSTOMIZATION_KEYS){if(Object.prototype.hasOwnProperty.call(localSettings.customization,k))merged.settings.customization[k]=localSettings.customization[k];else delete merged.settings.customization[k];}
 }
 return merged;
}

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db)); window.__storageWriteFailed=false;}catch(e){window.__storageWriteFailed=true;console.warn('LocalStorage 儲存失敗',e);if(e && (e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'))showToast('本機儲存空間不足，請先匯出備份或移除大型照片','error');}
  if(currentUser && cloudDb && cloudReady && !cloudApplying){
    clearTimeout(cloudSaveTimer); setCloudStatus('資料已儲存於本機，等待雲端同步…');
    cloudSaveTimer=setTimeout(()=>writeCloudData(false),700);
  }else if(!currentUser){setCloudStatus('尚未登入，資料暫存於本機')}
}
function initFirebase(){
  if(!firebaseConfigured()){setCloudStatus('請先填入 Firebase 設定，再啟用雲端同步');return}
  try{
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    cloudAuth=firebase.auth();cloudDb=firebase.firestore();cloudStorage=firebase.storage();
    // 啟用 Firestore 離線快取（若瀏覽器/環境不支援，仍保留 LocalStorage 備援）。
    cloudDb.enablePersistence({synchronizeTabs:true}).catch(e=>console.info('Firestore 離線快取未啟用：',e.code||e.message));
    cloudAuth.onAuthStateChanged(async user=>{
      currentUser=user||null; cloudReady=false; if(typeof syncSocialOnAuth==='function')syncSocialOnAuth();
      if(cloudUnsubscribe){cloudUnsubscribe();cloudUnsubscribe=null}
      updateAccountUI();
      if(!user){setCloudStatus('尚未登入，資料暫存於本機');return}
      setCloudStatus('正在載入雲端資料…');
      const ref=cloudDb.collection('users').doc(user.uid).collection('studyPlanner').doc('main');
      try{
        const snap=await ref.get();
        if(snap.exists && snap.data().data){
          cloudApplying=true;db=mergeLocalOnlyLayoutSettings(snap.data().data);ensureExtras();localStorage.setItem(KEY,JSON.stringify(db));cloudApplying=false;render();
          setCloudStatus('已載入此帳號的雲端資料');
        }else{
          // 該帳號尚無雲端文件：先把本機補抄照片移至 Storage，再初始化雲端資料。
          await ensureSnapImagesCloud();
          await ref.set({data:cloudSyncData(db),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),schemaVersion:1});
          setCloudStatus('首次登入：已將本機資料備份至雲端');
        }
        cloudReady=true;
        if(typeof syncSocialOnAuth==='function')syncSocialOnAuth();
        cloudUnsubscribe=ref.onSnapshot(s=>{
          if(!s.exists||!s.data().data)return;
          const remote=cloudSyncData(s.data().data);
          // 版面偏好保留本機；只比較及套用需要同步的資料。
          if(JSON.stringify(remote)!==JSON.stringify(cloudSyncData(db))){
            cloudApplying=true;db=mergeLocalOnlyLayoutSettings(remote);ensureExtras();localStorage.setItem(KEY,JSON.stringify(db));cloudApplying=false;render();
            setCloudStatus('已接收其他裝置的最新資料');
          }
        },err=>{console.error(err);setCloudStatus('雲端讀取失敗，暫時使用本機資料')});
      }catch(e){cloudApplying=false;console.error(e);setCloudStatus('雲端連線失敗，資料仍保存在本機：'+(e.code||e.message))}
    });
  }catch(e){console.error(e);setCloudStatus('Firebase 初始化失敗，請檢查設定')}
}
async function signInEmailPassword(){
  if(!firebaseConfigured()){alert('請先在「系統設定 → API／金鑰設定」填入 Firebase 專案設定。');return}
  const email=(document.getElementById('cloudLoginEmail')?.value||'').trim();
  const password=document.getElementById('cloudLoginPassword')?.value||'';
  if(!email||!password){alert('請輸入電子郵件與密碼。');return}
  if(!cloudAuth){alert('Firebase 尚未初始化，請確認設定並重新載入頁面。');return}
  try{await cloudAuth.signInWithEmailAndPassword(email,password)}
  catch(e){alert('登入失敗：'+(e.code==='auth/invalid-credential'?'電子郵件或密碼不正確。':e.code==='auth/too-many-requests'?'嘗試次數過多，請稍後再試。':e.message))}
}
async function createEmailAccount(){
  if(!firebaseConfigured()){alert('請先在「系統設定 → API／金鑰設定」填入 Firebase 專案設定。');return}
  const email=(document.getElementById('cloudLoginEmail')?.value||'').trim();
  const password=document.getElementById('cloudLoginPassword')?.value||'';
  if(!email||!password){alert('請先輸入電子郵件與密碼。');return}
  if(password.length<6){alert('密碼至少需要 6 個字元。');return}
  if(!cloudAuth){alert('Firebase 尚未初始化，請確認設定並重新載入頁面。');return}
  try{await cloudAuth.createUserWithEmailAndPassword(email,password);alert('帳號建立成功，已登入並啟用雲端同步。')}
  catch(e){alert('建立帳號失敗：'+(e.code==='auth/email-already-in-use'?'此電子郵件已註冊，請直接登入。':e.code==='auth/weak-password'?'密碼強度不足，請使用至少 6 個字元。':e.message))}
}
async function resetEmailPassword(){
  const email=(document.getElementById('cloudLoginEmail')?.value||'').trim();
  if(!email){alert('請先輸入電子郵件，再按「忘記密碼」。');return}
  if(!cloudAuth){alert('Firebase 尚未初始化，請確認設定並重新載入頁面。');return}
  try{await cloudAuth.sendPasswordResetEmail(email);alert('已寄出密碼重設郵件，請查看收件匣及垃圾郵件匣。')}
  catch(e){alert('無法寄送重設郵件：'+e.message)}
}
async function signOutAccount(){if(!cloudAuth)return;try{await cloudAuth.signOut();setCloudStatus('已登出，後續資料儲存於本機')}catch(e){alert('登出失敗：'+e.message)}}
async function ensureSnapImagesCloud(){if(!currentUser||!cloudStorage||!Array.isArray(db.snapNotes))return;let changed=false;for(const n of db.snapNotes){try{let blob=null;if(typeof n.image==='string'&&n.image.startsWith('data:image/'))blob=await (await fetch(n.image)).blob();else if(typeof n.image==='string'&&n.image.startsWith('idb-snap:'))blob=await getSnapImage(n.image.slice(9));if(blob){const ref=cloudStorage.ref(`users/${currentUser.uid}/snapNotes/${n.id}.jpg`);await ref.put(blob,{contentType:'image/jpeg'});n.image=await ref.getDownloadURL();changed=true}}catch(e){console.warn('照片上傳雲端失敗，保留本機照片：',e)}}if(changed){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){console.warn('更新照片網址時本機儲存失敗',e)}}}
async function writeCloudData(manual){
  if(!currentUser||!cloudDb){if(manual)alert('請先登入帳號並完成 Firebase 設定。');return}
  try{
    setCloudStatus('正在同步雲端…');
    await ensureSnapImagesCloud();
    await cloudDb.collection('users').doc(currentUser.uid).collection('studyPlanner').doc('main').set({data:cloudSyncData(db),updatedAt:firebase.firestore.FieldValue.serverTimestamp(),schemaVersion:1});
    setCloudStatus('雲端同步完成 · '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));
    if(manual)alert('雲端同步完成！');
  }catch(e){console.error(e);setCloudStatus('同步失敗，資料仍保存在本機');if(manual)alert('雲端同步失敗：'+e.message+'。本機資料仍保留，請檢查網路及 Firestore 規則。')}
}

function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function examFor(subject,date){return db.exams.filter(e=>e.subject.toLowerCase()===subject.toLowerCase()&&e.date===date)}
function tasksFor(date){return db.tasks.filter(t=>t.due===date&&!t.done)}
function go(p){page=p;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();if(typeof updateBottomNavIndicator==='function')requestAnimationFrame(updateBottomNavIndicator);if(typeof arcLayout==='function')requestAnimationFrame(arcLayout)}

function ensureSocial(){db.social ||= {friends:[],shareSchedule:false,displayName:'',shareCode:''};db.social.friends ||= [];if(typeof db.social.shareSchedule!=='boolean')db.social.shareSchedule=false;}
function socialCode(){ensureSocial();if(db.social.shareCode)return db.social.shareCode;const raw=(currentUser?.uid||'local-'+(localStorage.getItem(KEY)||'guest')).replace(/[^a-zA-Z0-9]/g,'').toUpperCase();db.social.shareCode='SG'+raw.slice(-8).padStart(8,'0');save();return db.social.shareCode;}
function socialStats(){ensureExtras();const today=isoToday();const seconds=(db.focusStats?.date===today?Number(db.focusStats.seconds)||0:0);const completed=(db.tasks||[]).filter(t=>t.done&&((t.completedAt||'').slice(0,10)===today||(!t.completedAt&&t.due===today))).length;return {seconds,completed};}
function socialProfileData(){const st=socialStats();return {uid:currentUser?.uid||'',code:socialCode(),name:(db.social?.displayName||currentUser?.displayName||'拾光同學').slice(0,32),online:true,updatedAt:Date.now(),focus:!!(pomo?.running&&pomo.mode==='focus'),remaining:Math.max(0,Math.ceil((pomo?.remaining||0))),mode:pomo?.mode||'focus',todaySeconds:st.seconds,todayCompleted:st.completed,shareSchedule:!!db.social?.shareSchedule,courses:db.social?.shareSchedule?(db.courses||[]).map(c=>({day:c.day,period:c.period,subject:c.subject,room:c.room||''})):[]};}
function socialCloudAvailable(){return !!(currentUser&&cloudDb&&cloudReady)}
let socialPresenceTimer=null,socialProfileUnsub=null,socialFriendUnsubs=[];
async function publishSocialProfile(){ensureSocial();if(!socialCloudAvailable())return;try{await cloudDb.collection('socialProfiles').doc(currentUser.uid).set(socialProfileData(),{merge:true});}catch(e){console.warn('社交狀態同步失敗',e);}}
function startSocialPresence(){if(socialPresenceTimer)clearInterval(socialPresenceTimer);publishSocialProfile();socialPresenceTimer=setInterval(publishSocialProfile,15000);window.addEventListener('beforeunload',()=>{if(socialPresenceTimer)clearInterval(socialPresenceTimer);if(socialCloudAvailable())cloudDb.collection('socialProfiles').doc(currentUser.uid).set({online:false,updatedAt:Date.now()},{merge:true}).catch(()=>{});},{once:true});}

ss="text-xs text-slate-500 mt-1">代碼 ${escapeHtml(f.code||'—')}</div></div><span class="text-slate-500">›</span></div><div class="mt-3" id="friendStatus_${i}">${socialFriendlyStatus(f.profile)}</div></button>`).join(''):'<div class="friend-card text-center py-8"><div class="text-3xl mb-3">📚</div><b>你的讀書圈還沒有好友</b><p class="text-sm text-slate-400 mt-2">先分享自己的代碼，或輸入同學的好友代碼。</p><button class="btn primary mt-4" onclick="openAddFriend()">新增第一位好友</button></div>'}<div class="text-xs text-slate-500 leading-relaxed mb-6">隱私提醒：課表分享預設關閉。好友互看與即時狀態需要 Firebase 專案與正確的 Firestore Rules；未登入時仍可管理本機好友名單，但無法真正跨裝置同步。</div>`;}

let arcRotation=0,arcGesture=null,arcWheelReady=false,arcCollapseTimer=null,arcLayoutRaf=0,arcCachedItems=null,arcLastHapticIndex=-1,arcLastHapticAt=0;
const ARC_PAGES=['today','schedule','matrix','plan','friends','snapnotes','widgets','prep'];
const ARC_STEP=360/ARC_PAGES.length;
function arcWrapAngle(a){while(a>180)a-=360;while(a<-180)a+=360;return a}
function arcItemAngle(i){return -162+i*(180/ARC_PAGES.length)}
function arcHalfTrackAngle(deg){let a=((deg+180)%180+180)%180-180;return a}
function arcIsExpanded(){return !!document.getElementById('arcNavShell')?.classList.contains('arc-expanded')}
function arcLayout(){
 const shell=document.getElementById('arcNavShell'),stage=document.getElementById('arcWheelStage'),wheel=document.getElementById('arcWheel');if(!wheel||!stage||!shell)return;
 const items=arcCachedItems||(arcCachedItems=[...wheel.querySelectorAll('.arc-nav-item')]),expanded=arcIsExpanded();
 if(!expanded){
   const visible=items.filter(b=>b.dataset.page!==page);
   items.forEach(b=>{b.classList.remove('arc-ring-inner','arc-ring-outer','arc-near-top','arc-selected');b.classList.toggle('arc-bar-hidden',b.dataset.page===page);b.classList.toggle('arc-current-page',b.dataset.page===page);});
   const slots=[12,32,68,88];visible.forEach((b,j)=>{b.style.left='';b.style.top='';b.style.setProperty('--bar-x',slots[j]+'%')});
   return;
 }
 const w=wheel.clientWidth||320,h=wheel.clientHeight||220,cx=w/2,cy=h-8;
 const rx=Math.min(150,w*.445),ry=Math.min(154,h*.70);
 let nearestIndex=0,nearestDist=Infinity;
 items.forEach((b,i)=>{const angle=arcHalfTrackAngle(arcItemAngle(i)+arcRotation);const dist=Math.abs(angle+90);if(dist<nearestDist){nearestDist=dist;nearestIndex=i}});
 items.forEach((b,i)=>{
   const a=arcHalfTrackAngle(arcItemAngle(i)+arcRotation)*Math.PI/180;
   const x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry;
   b.classList.remove('arc-bar-hidden','arc-ring-inner','arc-ring-outer','active');
   b.style.setProperty('left',x+'px','important');b.style.setProperty('top',y+'px','important');
   b.classList.toggle('arc-selected',i===nearestIndex);
   b.classList.toggle('arc-near-top',i===nearestIndex);
   b.classList.toggle('arc-current-page',b.dataset.page===page);
 });
}
function arcPageAtTop(){let best=0,dist=Infinity;ARC_PAGES.forEach((p,i)=>{const d=Math.abs(arcHalfTrackAngle(arcItemAngle(i)+arcRotation)+90);if(d<dist){dist=d;best=i}});return best}
function arcSelectionHaptic(index){if(index===arcLastHapticIndex)return;arcLastHapticIndex=index;arcLastHapticAt=Date.now();try{if(typeof navigator!=='undefined'&&typeof navigator.vibrate==='function')navigator.vibrate(15)}catch(_){}}
function arcSetPage(idx){idx=(idx%ARC_PAGES.length+ARC_PAGES.length)%ARC_PAGES.length;arcRotation=-90-arcItemAngle(idx);go(ARC_PAGES[idx]);arcLayout()}
function arcExpand(){const shell=document.getElementById('arcNavShell');if(!shell)return;clearTimeout(arcCollapseTimer);if(shell.classList.contains('arc-expanded'))return;arcLayout();void shell.offsetHeight;shell.classList.remove('arc-collapsed','arc-awake','arc-spring');shell.classList.add('arc-expanded');void shell.offsetHeight;arcLayout()}
function arcCollapse(){const shell=document.getElementById('arcNavShell');if(!shell)return;clearTimeout(arcCollapseTimer);shell.classList.remove('arc-expanded','arc-dragging','arc-awake');shell.classList.add('arc-collapsed');arcGesture=null;arcLayout()}
function arcScheduleCollapse(){clearTimeout(arcCollapseTimer);arcCollapseTimer=setTimeout(arcCollapse,1000)}
function arcSnapAndNavigate(){const shell=document.getElementById('arcNavShell');const idx=arcPageAtTop();shell?.classList.remove('arc-spring');arcSetPage(idx);if(shell){void shell.offsetWidth;shell.classList.add('arc-spring');setTimeout(()=>shell.classList.remove('arc-spring'),500)}arcScheduleCollapse()}
function arcAngleAt(ev,cachedRect){const stage=document.getElementById('arcWheelStage'),r=cachedRect||stage.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.bottom-10;return {angle:Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI,cx,cy}}
function arcScheduleLayout(){if(arcLayoutRaf)return;const raf=window.requestAnimationFrame||((fn)=>setTimeout(fn,16));arcLayoutRaf=raf(()=>{arcLayoutRaf=0;arcLayout()})}
function initArcWheel(){
 const shell=document.getElementById('arcNavShell'),stage=document.getElementById('arcWheelStage'),wheel=document.getElementById('arcWheel');if(!shell||!stage||!wheel||arcWheelReady)return;arcWheelReady=true;
 wheel.querySelectorAll('.arc-nav-item').forEach((b,i)=>b.addEventListener('click',ev=>{if(wheel.dataset.suppressClick==='1'){wheel.dataset.suppressClick='0';ev.preventDefault();ev.stopPropagation();return}if(arcGesture?.moved){ev.preventDefault();ev.stopPropagation();return}ev.stopPropagation();arcSetPage(i);if(arcIsExpanded())arcScheduleCollapse()}));
 stage.addEventListener('pointerdown',ev=>{if(ev.target.closest('.arc-center-add'))return;if(ev.pointerType==='mouse'&&ev.button!==0)return;const stageRect=stage.getBoundingClientRect(),pt=arcAngleAt(ev,stageRect);arcGesture={id:ev.pointerId,x:ev.clientX,y:ev.clientY,start:pt.angle,rotation:arcRotation,cx:pt.cx,cy:pt.cy,stageRect,moved:false,expanded:arcIsExpanded(),mode:arcIsExpanded()?'arc':'bar'};arcLastHapticIndex=arcPageAtTop();clearTimeout(arcCollapseTimer);try{stage.setPointerCapture(ev.pointerId)}catch(_){} });
 stage.addEventListener('pointermove',ev=>{const g=arcGesture;if(!g||g.id!==ev.pointerId)return;const dx=ev.clientX-g.x,dy=ev.clientY-g.y;
   if(!g.expanded){if(Math.abs(dx)>18&&Math.abs(dx)>Math.abs(dy)*1.15){g.moved=true;g.expanded=true;g.mode='arc';arcExpand();shell.classList.add('arc-dragging');const pt=arcAngleAt(ev,g.stageRect);g.start=pt.angle;g.rotation=arcRotation;g.cx=pt.cx;g.cy=pt.cy;try{stage.setPointerCapture(ev.pointerId)}catch(_){}ev.preventDefault()}return}
   if(dy>30&&dy>Math.abs(dx)*1.05){g.moved=true;g.mode='collapse';arcCollapse();ev.preventDefault();return}if(g.mode==='collapse')return;
   const a=Math.atan2(ev.clientY-g.cy,ev.clientX-g.cx)*180/Math.PI;let delta=a-g.start;while(delta>180)delta-=360;while(delta<-180)delta+=360;if(Math.abs(delta)>2)g.moved=true;arcRotation=g.rotation+delta;arcSelectionHaptic(arcPageAtTop());arcScheduleLayout();ev.preventDefault();
 });
 const finish=ev=>{const g=arcGesture;if(!g||g.id!==ev.pointerId)return;arcGesture=null;shell.classList.remove('arc-dragging');if(g.mode==='collapse'){arcCollapse();return}if(g.moved&&g.expanded){wheel.dataset.suppressClick='1';arcSnapAndNavigate();setTimeout(()=>wheel.dataset.suppressClick='0',450)}else if(g.expanded)arcScheduleCollapse();else arcLayout()};
 stage.addEventListener('pointerup',finish);stage.addEventListener('pointercancel',finish);
 window.addEventListener('resize',arcLayout,{passive:true});document.addEventListener('keydown',ev=>{if(!['ArrowLeft','ArrowRight','Home','End','Escape'].includes(ev.key))return;if(ev.key==='Escape'&&arcIsExpanded()){arcCollapse();return}let n=ARC_PAGES.indexOf(page);if(n<0)n=0;if(ev.key==='ArrowLeft')n=(n-1+ARC_PAGES.length)%ARC_PAGES.length;if(ev.key==='ArrowRight')n=(n+1)%ARC_PAGES.length;if(ev.key==='Home')n=0;if(ev.key==='End')n=ARC_PAGES.length-1;ev.preventDefault();arcSetPage(n);if(arcIsExpanded())arcScheduleCollapse()});
 const idx=Math.max(0,ARC_PAGES.indexOf(page));arcRotation=-90-arcItemAngle(idx);shell.classList.add('arc-collapsed');arcLayout();
}

function currentClassInfo(){
 const now=new Date(),today=isoToday(),day=(now.getDay()+6)%7,minutes=now.getHours()*60+now.getMinutes();
 if(day>4)return {kind:'free',message:'今天沒有常態課程，享受自由時間／專注讀書吧！'};
 let active=null,next=null;
 for(let p=0;p<PERIODS.length;p++){
  const c=courseFor(day,p,today);if(!c)continue;
  const [sh,sm]=PERIODS[p][0].split(':').map(Number),[eh,em]=PERIODS[p][1].split(':').map(Number),a=sh*60+sm,b=eh*60+em;
  if(minutes>=a&&minutes<b){active={course:c,period:p,end:b,remaining:b-minutes};break}
  if(minutes<a&&!next)next={course:c,period:p,start:a,until:a-minutes};
 }
 if(active)return {kind:'active',...active};if(next)return {kind:'next',...next};
 return {kind:'free',message:'目前沒有後續課程，享受自由時間／專注讀書吧！'};
}

// 每週固定課堂提醒：頁面開啟時檢查課堂開始時間，已提醒的任務／日期不會重複彈出。
function checkWeeklyTaskReminders(){
 try{
  if(document.visibilityState==='hidden')return;
  const now=new Date(),today=isoToday(),day=(now.getDay()+6)%7,minute=now.getHours()*60+now.getMinutes();
  (db.tasks||[]).filter(t=>t.weeklyRecurring&&!t.done&&Number(t.recurringDay)===day&&t.linkedCourseId&&!(Array.isArray(t.recurringCompletedDates)&&t.recurringCompletedDates.includes(today))).forEach(t=>{
   const course=db.courses.find(c=>c.id===t.linkedCourseId&&c.day===day&&c.period===Number(t.recurringPeriod));if(!course)return;
   const start=PERIODS[Number(t.recurringPeriod)]?.[0];if(!start)return;const [hh,mm]=start.split(':').map(Number),startMinute=hh*60+mm;
   if(Math.abs(minute-startMinute)>0)return;
   const key=`shiguang-weekly-task-reminder-${t.id}-${today}`;if(localStorage.getItem(key)==='1')return;localStorage.setItem(key,'1');
   const message=`${t.title||'自習／待辦任務'} · ${course.subject} 第${Number(t.recurringPeriod)+1}節`;
   if('Notification' in window&&Notification.permission==='granted'){try{new Notification('拾光自習｜每週課堂提醒',{body:message,tag:key})}catch(e){}}
   if(typeof showToast==='function')showToast(`🔔 每週提醒：${message}`);
  });
 }catch(e){console.warn('Weekly reminder check failed',e)}
}
setInterval(checkWeeklyTaskReminders,15000);
setTimeout(checkWeeklyTaskReminders,1800);

edDeadlines.length>1?linkedDeadlines.length+' 項作業':'作業截止'}</span>`:''}${c.room?`<small>@${escapeHtml(c.room)}</small>`:''}${c.teacher?`<small>${escapeHtml(c.teacher)}</small>`:''}`:'<small>＋</small>'}</div>`}if(p===morningCount-1)rows+=`<div class="breakbar">午休 · ${(db.settings?.customization?.lunchStart||'12:00')}–${(db.settings?.customization?.lunchEnd||'13:10')}</div>`}

function ensurePlannerData(){
  db.plannerBlocks ||= [];
  db.plannerSettings ||= {repeatDefault:false};
  // Keep existing plan data and turn its steps into visible schedule blocks once, without deleting legacy plans.
  if(!db._plannerMigrated){
    db.plans ||= [];
    db.plans.forEach(p=>(p.steps||[]).forEach((step,i)=>{
      if(!db.plannerBlocks.some(b=>b.legacyPlanId===p.id&&b.legacyStepIndex===i)){
        const date=step.date||isoToday(), day=(new Date(date+'T12:00:00').getDay()+6)%7;
        db.plannerBlocks.push({id:uid(),weekStart:mondayOf(date),day,start:'19:00',end:'19:45',subject:p.subject||'',scope:step.text||p.title||'複習',done:!!step.done,legacyPlanId:p.id,legacyStepIndex:i,color:(i%COLORS.length)});
      }
    }));
    db._plannerMigrated=true; save();
  }
}

function packNavCustomizationIntoCustomCategory(settingsPanel){

  const custom=directSections.find(s=>/^\s*🛠\s*自定義\s*$/.test((s.querySelector(':scope > h4')?.textContent||'').trim()));
  const nav=directSections.find(s=>s.classList.contains('sg-nav-settings') || /底部導覽列自定義/.test((s.querySelector(':scope > h4')?.textContent||'')));
  if(!custom || !nav || custom.contains(nav))return !!(custom && custom.querySelector('.sg-nav-settings-packed'));
  // Move the actual settings DOM node, not a copy, so every existing event handler and input is retained.
  const oldHeading=nav.querySelector(':scope > h4');
  const details=document.createElement('details');
  details.className='settings-subcategory taskrow mb-3 sg-nav-settings-packed';
  details.open=false;
  const summary=document.createElement('summary');
  summary.className='settings-category-summary';
  summary.innerHTML='<span class="settings-category-icon">🧭</span><span class="settings-category-copy"><strong>底部導覽列自定義</strong><small>高度、垂直位移與所有按鈕顯示開關</small></span><span class="settings-category-chevron" aria-hidden="true">⌄</span>';
  const body=document.createElement('div');
  body.className='settings-category-body';
  body.style.cssText='padding-top:12px';
  [...nav.childNodes].forEach(node=>{if(node!==oldHeading)body.appendChild(node)});
  details.append(summary,body);
  const saveButton=custom.querySelector(':scope > button[onclick="saveCustomizationSettings()"]');
  custom.insertBefore(details,saveButton||null);
  nav.remove();
  return true;
}

function buildAICoursePrompt(){return `你是精準的課表圖片辨識與 JSON 轉換器。請辨識我附上的課表圖片，將每一堂「常態課程」轉換成系統可匯入的 JSON 陣列。請嚴格遵守：
1. 只輸出合法 JSON，不要 Markdown 程式碼圍欄、說明文字或註解。
2. 每筆課程包含 day、period、subject、room、teacher、items 欄位。
3. day 使用整數：0=星期一、1=星期二、2=星期三、3=星期四、4=星期五、5=星期六、6=星期日。
4. period 使用從 0 起算的整數：0=第 1 節、1=第 2 節，以此類推。請依圖片上的節次欄位判斷，不要把時間鐘點誤當節次。
5. subject 是科目名稱；room 是教室，teacher 是老師姓名。看不清楚或圖片未提供時使用空字串，不要猜測。
6. items 是該課需攜帶物品的字串陣列；若圖片沒有相關資訊，請使用 []。只有圖片明確列出物品時才填入。
7. 不要輸出空白格、午休、下課或非課程活動；如果圖片中有明確課程，請保留每一堂。
8. 不要自行合併不同節次的課程；同一科目連堂時，每一節各輸出一筆。
9. 輸出格式範例：
[
  {"day":0,"period":0,"subject":"國文","room":"301","teacher":"王老師","items":["國文課本","習作"]},
  {"day":0,"period":1,"subject":"英文","room":"語言教室","teacher":"陳老師","items":[]}
]
請以我附上的課表圖片為唯一依據，逐格檢查星期與節次，最後只回傳 JSON 陣列。`}
async function generateAndCopyCoursePrompt(){const prompt=buildAICoursePrompt();try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(prompt)}else{const ta=document.createElement('textarea');ta.value=prompt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('clipboard unavailable')}showToast('已複製 AI 提示詞，請前往 AI 貼上並附上圖片');const status=document.getElementById('aiCourseImportStatus');if(status)status.textContent='已複製 AI 提示詞，請前往 AI 貼上並附上圖片。'}catch(e){console.warn('複製提示詞失敗',e);showModal(`<h3 class="text-lg font-bold mb-2">AI 課表轉換提示詞</h3><p class="text-sm text-slate-400 mb-3">瀏覽器未允許自動複製，請長按下方文字全選複製。</p><textarea class="field" rows="12" readonly>${escapeHtml(prompt)}</textarea><button class="btn primary w-full mt-3" onclick="closeModal()">完成</button>`);}}
function normalizeAICourseDay(v){if(typeof v==='number'&&Number.isInteger(v)&&v>=0&&v<=6)return v;const t=String(v??'').trim().toLowerCase();const m=t.match(/(?:星期|週|周|礼拜|礼拜)?\s*([一二三四五六日天1-7])/);if(!m)return null;const map={'一':0,'二':1,'三':2,'四':3,'五':4,'六':5,'日':6,'天':6,'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'7':6};return map[m[1]]??null}
function normalizeAICoursePeriod(v){if(typeof v==='number'&&Number.isInteger(v)&&v>=0&&v<PERIODS.length)return v;const t=String(v??'').trim();let m=t.match(/第\s*(\d+)\s*節/);if(m){const n=Number(m[1]);return n>=1&&n<=PERIODS.length?n-1:null}if(/^\d+$/.test(t)){const n=Number(t);if(n>=0&&n<PERIODS.length)return n;if(n>=1&&n<=PERIODS.length)return n-1}return null}
function importAICoursesFromSettings(){const input=document.getElementById('aiCourseJsonInput'),status=document.getElementById('aiCourseImportStatus');if(!input)return;let importMode=window.__courseImportMode;if(!importMode){window.__pendingCourseImportText=input.value;showModal(`<div class="flex items-start justify-between gap-3 mb-3"><h3 class="text-xl font-black">選擇課表匯入方式</h3><button class="text-xl" onclick="window.__courseImportMode='cancel';closeModal();openSettings()" aria-label="關閉">×</button></div><div class="space-y-3"><div class="taskrow"><button class="btn primary w-full" onclick="chooseCourseImportMode('merge')">🔘 合併匯入</button><p class="text-sm mt-2">保留你原本課表中的既有課程，僅將匯入的新課程填入空白時段或更新有變動的格子。</p></div><div class="taskrow"><button class="btn w-full" onclick="chooseCourseImportMode('overwrite')">🔘 完整覆蓋</button><p class="text-sm mt-2">清除目前所有的課表內容，完全以這次匯入的新課表資料取代（若匯入資料有空白則該節課會變空白）。</p></div><div class="taskrow"><button class="btn w-full" onclick="chooseCourseImportMode('cancel')">🔘 取消</button><p class="text-sm mt-2">放棄此次匯入動作，不對現有課表做任何更動。</p></div></div>`);return;}if(importMode==='cancel'){window.__courseImportMode=null;return;}window.__courseImportMode=null;let parsed;try{let raw=input.value.trim();if(!raw)throw new Error('請先貼上 AI 產生的 JSON。');raw=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');parsed=JSON.parse(raw);if(!Array.isArray(parsed)){if(parsed&&Array.isArray(parsed.courses))parsed=parsed.courses;else throw new Error('JSON 頂層必須是陣列，或是包含 courses 陣列的物件。')}if(!parsed.length)throw new Error('JSON 陣列目前是空的。');}catch(e){if(status)status.textContent='匯入失敗：'+e.message;showToast('JSON 格式錯誤，請確認 AI 回覆內容');return}
 const normalized=[],errors=[];parsed.forEach((item,i)=>{if(!item||typeof item!=='object'){errors.push(`第 ${i+1} 筆不是物件`);return}const day=normalizeAICourseDay(item.day??item.weekday??item.weekDay??item.week),period=normalizeAICoursePeriod(item.period??item.lesson??item.section);const subject=String(item.subject??item.course??item.name??'').trim();if(day===null||period===null||(!subject&&importMode!=='overwrite')){errors.push(`第 ${i+1} 筆缺少有效的星期、節次或科目名稱`);return}if(!subject&&importMode==='overwrite'){normalized.push({day,period,subject:'',clear:true});return}const items=Array.isArray(item.items)?item.items:Array.isArray(item.supplies)?item.supplies:Array.isArray(item.bringItems)?item.bringItems:[];normalized.push({day,period,subject,room:String(item.room??item.classroom??'').trim(),teacher:String(item.teacher??item.instructor??'').trim(),items:items.map(x=>String(x).trim()).filter(Boolean),color:Number.isInteger(Number(item.color))&&Number(item.color)>=0?Number(item.color)%COLORS.length:(day+period)%COLORS.length})});if(!normalized.length){const msg='沒有可匯入的有效課程。'+(errors.length?' '+errors.slice(0,3).join('；'):'');if(status)status.textContent=msg;showToast('找不到有效課程，請檢查 JSON');return}
 // 同一份 JSON 若同格重複，保留最後一筆；與既有常態課表同格時，以匯入資料更新，其他格保留。
 const unique=new Map();normalized.forEach(c=>unique.set(`${c.day}:${c.period}`,c));let incoming=[...unique.values()];if(importMode==='overwrite'){const explicit=new Set(incoming.map(c=>`${c.day}:${c.period}`));for(let d=0;d<7;d++)for(let per=0;per<Math.max(1,Math.min(14,PERIODS.length));per++)if(!explicit.has(`${d}:${per}`))incoming.push({day:d,period:per,subject:'',clear:true});}let replaced=0,added=0;db.courses ||= [];
 if(importMode==='overwrite'){const slots=new Set(incoming.map(c=>`${c.day}:${c.period}`));db.courses=db.courses.filter(c=>!slots.has(`${c.day}:${c.period}`));}db.tasks ||= [];db.prepItems ||= [];
 incoming.forEach(c=>{if(c.clear){const before=db.courses.length;db.courses=db.courses.filter(x=>!(Number(x.day)===c.day&&Number(x.period)===c.period));if(before!==db.courses.length)replaced++;return}const old=db.courses.find(x=>Number(x.day)===c.day&&Number(x.period)===c.period);let courseId;if(old){courseId=old.id;Object.assign(old,c,{id:courseId});replaced++}else{courseId=uid();db.courses.push({...c,id:courseId});added++}
 // 將圖片中明確辨識的攜帶物品綁定到該課程；不重複新增同名、同課程物品。
 c.items.forEach(name=>{const exists=db.prepItems.some(x=>x.courseId===courseId&&String(x.name||'').trim()===name);if(!exists)db.prepItems.push({id:uid(),name,courseId,quadrant:'schedule',done:false,createdAt:isoToday(),note:'由 AI 課表匯入'})});
 // 常態課程只存於課表，不再建立矩陣任務；避免 AI 匯入後矩陣塞滿每一堂課。
 db.tasks=db.tasks.filter(x=>!(x.courseId===courseId&&x.taskKind==='course'));
 });save();render();const msg=`匯入完成（${importMode==='overwrite'?'完整覆蓋':'合併保留'}）：新增 ${added} 堂、更新／清除 ${replaced} 格，已自動排除同格重複。`+(errors.length?` 略過 ${errors.length} 筆格式不完整資料。`:'');if(status)status.textContent=msg;showToast(`課表匯入完成！新增 ${added} 堂、更新 ${replaced} 堂`);}

function exportData(includeKeys){
  try {
    save();
    const safeData = JSON.parse(JSON.stringify(db));
    if(!includeKeys && safeData.settings) delete safeData.settings.apiKeys;
    const payload = {app:'拾光自習',formatVersion:2,exportedAt:new Date().toISOString(),data:safeData};
    if(includeKeys){
      payload.firebaseConfig = {...FIREBASE_CONFIG};
      payload.customApiKeys = {...(db.settings?.apiKeys||{})};
      payload.includesSensitiveSettings = true;
    }
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download=makeVersionedBackupName(includeKeys?'backup_with_keys':'backup'); a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
    showToast(includeKeys?'已匯出資料與設定（含金鑰，請妥善保管）':'已匯出學習資料備份');
  } catch(err){console.error('資料備份失敗：',err);showToast('備份失敗，請確認裝置儲存空間。','error')}
}
function importData(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      const incoming=(parsed&&parsed.data&&typeof parsed.data==='object')?parsed.data:parsed;
      if(!incoming||!Array.isArray(incoming.courses)||!Array.isArray(incoming.tasks)||!Array.isArray(incoming.exams))throw new Error('備份格式不正確');
      if(!window.confirm('即將以備份檔取代目前學習資料。若要繼續，請再次確認；選擇取消不會更動資料。'))return;
      const hasConfig=parsed&&parsed.firebaseConfig&&typeof parsed.firebaseConfig==='object';
      db=incoming;ensureExtras();
      if(parsed&&parsed.customApiKeys&&typeof parsed.customApiKeys==='object')db.settings.apiKeys={...parsed.customApiKeys};
      save();
      if(hasConfig){
        const safe={};['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'].forEach(k=>{if(typeof parsed.firebaseConfig[k]==='string')safe[k]=parsed.firebaseConfig[k]});
        localStorage.setItem(FIREBASE_CONFIG_STORAGE_KEY,JSON.stringify({...FIREBASE_CONFIG_DEFAULT,...safe}));
      }
      closeModal();render();
      if(hasConfig){alert('學習資料與 Firebase 設定已匯入。為讓 Firebase 設定生效，請重新載入頁面；若在 APK 中，請關閉後重新開啟。')}
      else alert('學習資料匯入成功');
    }catch(e){console.error(e);alert('檔案格式不正確，請選擇有效的拾光自習 JSON 備份檔。')}
  };
  reader.onerror=()=>alert('無法讀取檔案，請重新選擇備份檔。');reader.readAsText(file);
}

function copyStudyAssistantPrompt(){
 const text=SG_AI_HELP_PROMPT;
 if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>showToast('AI 專屬提示詞已複製，可貼給 AI 使用')).catch(()=>copyStudyAssistantPromptFallback(text));}else copyStudyAssistantPromptFallback(text);
}
function copyStudyAssistantPromptFallback(text){
 const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();if(ok)showToast('AI 專屬提示詞已複製，可貼給 AI 使用');else showToast('無法自動複製，請長按提示詞區域自行複製','error');
}

function saveFirebaseSettings(ev){

function previewSnapImage(input){const file=input.files?.[0];if(!file)return;const otherId=input.id==='snapCameraInput'?'snapAlbumInput':'snapCameraInput';const other=document.getElementById(otherId);if(other)other.value='';const wrap=document.getElementById('snapPreviewWrap'),img=document.getElementById('snapPreview');if(wrap&&img){img.src=URL.createObjectURL(file);wrap.classList.remove('hide')}}
function snapDataUrlToBlob(dataUrl){const parts=String(dataUrl).split(',');if(parts.length<2)throw new Error('圖片資料格式不正確');const mime=(parts[0].match(/data:([^;]+)/)||[])[1]||'image/jpeg';const raw=atob(parts[1]);const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type:mime})}
function compressSnapImageFallback(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const max=960,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');if(!ctx)throw new Error('無法建立圖片畫布');ctx.drawImage(img,0,0,canvas.width,canvas.height);const data=canvas.toDataURL('image/jpeg',.5);URL.revokeObjectURL(url);resolve(data)}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image decode failed'))};img.src=url})}
function compressSnapImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const max=1440,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.72))}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image decode failed'))};img.src=url})}
function snapNotesPage(){ensureExtras();const notes=db.snapNotes||[],pending=notes.filter(n=>n.status!=='done'),done=notes.filter(n=>n.status==='done');const cardHtml=n=>`<article class="snap-card"><button class="w-full text-left" onclick="viewSnapNote('${n.id}')"><img class="snap-thumb mb-3" src="${n.image.startsWith("idb-snap:")?"":n.image}" data-snap-ref="${n.image.startsWith("idb-snap:")?n.image:""}" alt="${escapeHtml(n.title)}" loading="lazy"><div class="flex items-start justify-between gap-2"><b class="font-bold">${escapeHtml(n.title||'未命名筆記')}</b><span class="snap-status ${n.status==='done'?'done':'pending'}">${n.status==='done'?'已補抄':'待補抄'}</span></div><p class="text-xs text-cyan-200 mt-2">${escapeHtml(n.subject||'未指定科目')} · ${escapeHtml(n.createdAt||'')}</p>${n.note?`<p class="text-sm text-slate-400 mt-2 line-clamp-3">${escapeHtml(n.note)}</p>`:''}</button><div class="grid grid-cols-2 gap-2 mt-3"><button class="btn ${n.status==='done'?'':'primary'}" onclick="toggleSnapDone('${n.id}')">${n.status==='done'?'↩ 撤回補抄':'✓ 已完成補抄'}</button><button class="btn" onclick="deleteSnapNote('${n.id}')">🗑 刪除</button></div></article>`;return `<div class="flex items-start justify-between gap-3 mb-4"><div><h2 class="text-2xl font-black">📸 黑板補抄相簿</h2><p class="text-sm text-slate-400 mt-1">拍下黑板、講義或截圖，回家再慢慢補齊。</p></div><button class="btn primary" onclick="openAdd('snap')">＋ 新增</button></div><div class="grid grid-cols-2 gap-2 mb-4"><div class="glass rounded-2xl p-3"><div class="text-xs text-slate-400">待補抄</div><div class="text-2xl font-black text-amber-200">${pending.length}</div></div><div class="glass rounded-2xl p-3"><div class="text-xs text-slate-400">已封存</div><div class="text-2xl font-black text-emerald-200">${done.length}</div></div></div><h3 class="font-bold mb-3">🟡 待補抄清單</h3>${pending.length?`<div class="grid grid-cols-2 gap-3">${pending.map(cardHtml).join('')}</div>`:'<div class="taskrow text-sm text-slate-400 mb-5">目前沒有待補抄筆記。課堂上遇到來不及抄的內容，可以直接拍照加入。</div>'}<details class=" function closeDrawer(){const b=document.getElementById('drawerBackdrop');if(!b){document.getElementById('drawerRoot').innerHTML='';return}b.classList.remove('open');setTimeout(()=>{if(!b.classList.contains('open'))document.getElementById('drawerRoot').innerHTML=''},280)}
function formatDuration(sec){sec=Math.max(0,Math.floor(sec||0));let h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h?`${h} 小時 ${m} 分鐘`:`${m} 分鐘`}
const POMO_DEFAULTS={focus:25,shortBreak:5,longBreak:15,cycles:4};
function getPomoSettings(){
 db.settings ||= {};
 db.settings.pomodoro ||= {...POMO_DEFAULTS};
 for(const k of Object.keys(POMO_DEFAULTS)){
  const v=Number(db.settings.pomodoro[k]);
  db.settings.pomodoro[k]=Number.isFinite(v)?Math.max(1,Math.min(k==='cycles'?20:180,Math.round(v))):POMO_DEFAULTS[k];
 }
 return db.settings.pomodoro;
}
let pomoSettings=getPomoSettings();
let pomo={mode:'focus',duration:pomoSettings.focus*60,remaining:pomoSettings.focus*60,running:false,startedAt:0,interval:null,completed:0,round:1};
function pomoDuration(mode){const s=getPomoSettings();return (mode==='focus'?s.focus:mode==='longBreak'?s.longBreak:s.shortBreak)*60}
function pomoSetMode(mode){if(pomo.running)return;pomo.mode=mode;pomo.duration=pomoDuration(mode);pomo.remaining=pomo.duration;renderPomoModal()}
function pomoSaveSettings(){
 const fields=['focus','shortBreak','longBreak','cycles'];
 for(const key of fields){const el=document.getElementById('pomoCfg_'+key);if(!el)continue;const max=key==='cycles'?20:180;let n=Math.round(Number(el.value));if(!Number.isFinite(n))n=POMO_DEFAULTS[key];n=Math.max(1,Math.min(max,n));el.value=n;pomoSettings[key]=n;}
 db.settings.pomodoro={...pomoSettings};save();
 if(!pomo.running){pomo.duration=pomoDuration(pomo.mode);pomo.remaining=pomo.duration;pomo.completed=Math.min(pomo.completed,pomoSettings.cycles);pomo.round=Math.min(pomoSettings.cycles,pomo.completed+1);}
 renderPomoModal();
}
function openPomodoro(){pomoSettings=getPomoSettings();renderPomoModal()}
function renderPomoModal(){
 const s=getPomoSettings(),isFocus=pomo.mode==='focus',progress=pomo.duration?Math.min(100,(pomo.duration-pomo.remaining)/pomo.duration*100):0;
 const modeName=pomo.mode==='focus'?'專注時間':pomo.mode==='longBreak'?'長休息':'短暫休息';
 const displayRound=Math.min(s.cycles,Math.max(1,pomo.mode==='focus'?pomo.completed+1:pomo.completed));
 showModal(`<div class="flex justify-between items-start gap-3"><div><h3 class="text-xl font-black">🍅 番茄鐘專注計時器</h3><p class="text-sm text-slate-400 mt-1">自訂時間與循環，依自己的節奏學習。</p></div><button class="text-slate-400 text-xl" onclick="closeModal()">×</button></div>
 <div class="grid grid-cols-3 gap-2 mt-4"><button class="pill ${pomo.mode==='focus'?'selected':''}" onclick="pomoSetMode('focus')">專注 ${s.focus} 分</button><button class="pill ${pomo.mode==='shortBreak'?'selected':''}" onclick="pomoSetMode('shortBreak')">短休 ${s.shortBreak} 分</button><button class="pill ${pomo.mode==='longBreak'?'selected':''}" onclick="pomoSetMode('longBreak')">長休 ${s.longBreak} 分</button></div>
 <div class="flex justify-center mt-5"><div class="timer-ring" style="--progress:${progress}%"><div class="timer-inner"><div class="text-xs text-slate-400 mb-1">${modeName}</div><div class="timer-time" id="pomoTime">${String(Math.floor(pomo.remaining/60)).padStart(2,'0')}:${String(pomo.remaining%60).padStart(2,'0')}</div><div class="text-xs text-slate-500 mt-1" id="pomoStatus">${pomo.running?'進行中':'準備開始'}</div></div></div></div>
 <div class="text-center mt-3"><span class="text-cyan-300 font-bold" id="pomoRound">第 ${displayRound} / ${s.cycles} 輪</span><span class="text-xs text-slate-500 ml-2">已完成 ${pomo.completed} 輪</span></div>
 <div class="grid grid-cols-2 gap-3 mt-5"><button class="btn primary" onclick="pomoToggle()">${pomo.running?'暫停':'開始'}</button><button class="btn" onclick="pomoReset()">重置本輪</button></div>
 <details class="mt-5 rounded-2xl border border-slate-700 p-3" ${pomoSettings.showSettings?'open':''}><summary class="font-bold text-sm cursor-pointer">⚙️ 自訂時間與循環次數</summary><div class="grid grid-cols-2 gap-3 mt-4">${[['focus','專注時間（分鐘）'],['shortBreak','短暫休息（分鐘）'],['longBreak','長休息（分鐘）'],['cycles','總專注循環（輪）']].map(([k,label])=>`<div><label>${label}</label><input class="field" id="pomoCfg_${k}" type="number" min="1" max="${k==='cycles'?20:180}" step="1" value="${s[k]}" ${pomo.running?'disabled':''}></div>`).join('')}</div><p class="text-xs text-slate-500 mt-3">每輪專注結束後自動休息；每完成 4 輪且仍有剩餘輪次時，改為長休息。達到總輪數後自動停止。</p><button class="btn w-full mt-3" onclick="pomoSaveSettings()" ${pomo.running?'disabled':''}>儲存設定</button></details>
 <div class="grid grid-cols-2 gap-3 mt-4"><div class="taskrow"><div class="text-xs text-slate-400">今日專注總時間</div><div class="text-lg font-black mt-1">${formatDuration(db.focusStats.seconds)}</div></div><div class="taskrow"><div class="text-xs text-slate-400">完成番茄鐘次數</div><div class="text-lg font-black mt-1">${db.focusStats.pomodoros} 次</div></div></div><p class="text-xs text-slate-500 mt-3">倒數結束會播放提示聲；若瀏覽器支援通知，也會顯示系統提醒。計時時請保持頁面開啟。</p>`);
}
function pomoToggle(){if(pomo.running){pomoPause();return}if(pomo.remaining<=0)pomo.remaining=pomoDuration(pomo.mode);pomo.running=true;pomo.startedAt=Date.now();pomo.interval=setInterval(pomoTick,250);renderPomoModal()}
function pomoPause(redraw=true){if(pomo.running){pomoTick();pomo.running=false;clearInterval(pomo.interval);pomo.interval=null}if(redraw&&document.getElementById('modalRoot').innerHTML.includes('番茄鐘'))renderPomoModal()}
function pomoReset(){pomoPause(false);pomo.remaining=pomoDuration(pomo.mode);pomo.duration=pomoDuration(pomo.mode);renderPomoModal()}
function pomoNotify(title,body){playChime();if('Notification'in window&&Notification.permission==='granted'){try{new Notification(title,{body})}catch(e){}}}
function pomoTick(){
 if(!pomo.running)return;
 const now=Date.now(),elapsed=Math.max(0,Math.floor((now-pomo.startedAt)/1000));if(!elapsed)return;
 pomo.startedAt+=elapsed*1000;pomo.remaining=Math.max(0,pomo.remaining-elapsed);
 if(pomo.mode==='focus'){db.focusStats.seconds+=elapsed;save();}
 const time=document.getElementById('pomoTime');if(time)time.textContent=`${String(Math.floor(pomo.remaining/60)).padStart(2,'0')}:${String(pomo.remaining%60).padStart(2,'0')}`;
 const ring=document.querySelector('.timer-ring');if(ring){ring.classList.toggle('is-running',pomo.running);ring.style.setProperty('--progress',`${(pomo.duration-pomo.remaining)/pomo.duration*100}%`);}
 if(pomo.remaining<=0){
  clearInterval(pomo.interval);pomo.interval=null;pomo.running=false;
  if(pomo.mode==='focus'){
   pomo.completed++;db.focusStats.pomodoros++;save();
   if(pomo.completed>=getPomoSettings().cycles){const finishedCycles=pomo.completed;pomoNotify('恭喜完成！','你已完成設定的全部專注循環。');pomo.completed=0;pomo.round=1;pomo.mode='focus';pomo.duration=pomoDuration('focus');pomo.remaining=pomo.duration;if(document.body.classList.contains('study-room-open')){updateStudyRoomPomoUI();showToast(`🎉 已完成 ${finishedCycles} 輪專注！`)}else{renderPomoModal();setTimeout(()=>alert(`🎉 恭喜！你已完成 ${finishedCycles} 輪專注。`),80)}return;}
   pomo.mode=(pomo.completed%4===0)?'longBreak':'shortBreak';
   pomoNotify('專注完成！',pomo.mode==='longBreak'?'完成四輪專注，現在進入長休息。':'做得好！現在進入短暫休息。');
  }else{
   pomo.mode='focus';pomoNotify('休息結束！','準備開始下一輪專注。');
  }
  pomo.duration=pomoDuration(pomo.mode);pomo.remaining=pomo.duration;pomo.round=Math.min(getPomoSettings().cycles,pomo.completed+1);if(document.body.classList.contains('study-room-open'))updateStudyRoomPomoUI();else renderPomoModal();return;
 }
 const status=document.getElementById('pomoStatus');if(status)status.textContent='進行中';
 const round=document.getElementById('pomoRound');if(round)round.textContent=`第 ${Math.min(getPomoSettings().cycles,Math.max(1,pomo.mode==='focus'?pomo.completed+1:pomo.completed))} / ${getPomoSettings().cycles} 輪`;
}
function playChime(){try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let ctx=new C();[660,880,1046].forEach((freq,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.001,ctx.currentTime+i*.18);g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+i*.18+.03);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.18+.22);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*.18);o.stop(ctx.currentTime+i*.18+.24)});setTimeout(()=>ctx.close(),1000)}catch(e){}}
function openAnalytics(){ensureExtras();let today=isoToday(),week=mondayOf(today),weekEnd=dateAdd(week,6);let completed=db.tasks.filter(t=>t.done&&((t.completedAt&&t.completedAt>=week&&t.completedAt<=weekEnd)||(!t.completedAt&&t.due&&t.due>=week&&t.due<=weekEnd))).length;let exams=db.exams.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date));showModal(`<div class="flex justify-between items-start"><div><h3 class="text-xl font-black">📊 學習統計與進度分析</h3><p class="text-sm text-slate-400 mt-1">本週 ${fmt(week)}–${fmt(weekEnd)}</p></div><button class="text-slate-400 text-xl" onclick="closeModal()">×</button></div><div class="grid grid-cols-2 gap-3 mt-5"><div class="taskrow"><div class="text-xs text-slate-400">本週已完成作業／任務</div><div class="analytics-number mt-2">${completed} 項</div></div><div class="taskrow"><div class="text-xs text-slate-400">今日專注總時數</div><div class="analytics-number mt-2">${formatDuration(db.focusStats.seconds)}</div></div><div class="taskrow"><div class="text-xs text-slate-400">完成番茄鐘次數</div><div class="analytics-number mt-2">${db.focusStats.pomodoros} 次</div></div><div class="taskrow"><div class="text-xs text-slate-400">待完成任務</div><div class="analytics-number mt-2">${db.tasks.filter(t=>!t.done).length} 項</div></div></div><div class="mt-5"><h4 class="font-bold mb-3">考試倒數</h4>${exams.length?exams.map(e=>{let days=Math.ceil((new Date(e.date+'T00:00:00')-new Date(today+'T00:00:00'))/86400000);return `<div class="taskrow mb-2 flex items-center justify-between gap-3"><div class="min-w-0"><b>${escapeHtml(e.subject)}</b><div class="text-xs text-slate-400 mt-1">${fmt(e.date)} ${escapeHtml(e.time||'')}</div><div class="text-xs text-slate-500 mt-1">${escapeHtml(e.scope||'範圍尚未填寫')}</div></div><div class="text-right shrink-0"><div class="text-xl font-black ${days<=3?'text-rose-300':'text-cyan-300'}">${days===0?'今天':days+' 天'}</div><div class="text-xs text-slate-500">${days===0?'考試日':'剩餘'}</div></div></div>`}).join(''):'<p class="text-sm text-slate-500">目前沒有未 // 強化 JSON 匯入：同時還原學習資料、Firebase 設定與自訂 API 金鑰。
// 支援新版 {data, firebaseConfig, customApiKeys} 與舊版直接匯出資料格式。
importData=function(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw new Error('JSON 根節點必須是物件');
      const incoming=(parsed.data&&typeof parsed.data==='object'&&!Array.isArray(parsed.data))?parsed.data:parsed;
      if(!incoming||!Array.isArray(incoming.courses)||!Array.isArray(incoming.tasks)||!Array.isArray(incoming.exams))throw new Error('備份格式不正確');
      const configSource=(parsed.firebaseConfig&&typeof parsed.firebaseConfig==='object')?parsed.firebaseConfig:
        ((parsed.data&&parsed.data.firebaseConfig&&typeof parsed.data.firebaseConfig==='object')?parsed.data.firebaseConfig:null);
      const apiSource=(parsed.customApiKeys&&typeof parsed.customApiKeys==='object')?parsed.customApiKeys:
        ((incoming.settings&&incoming.settings.apiKeys&&typeof incoming.settings.apiKeys==='object')?incoming.settings.apiKeys:null);
      const hasConfig=!!configSource;
      const hasApiKeys=!!apiSource;
      if(!confirm(`匯入備份會以檔案內容取代目前學習資料。${hasConfig||hasApiKeys?'此檔案也含有設定／API 金鑰，匯入後會一併還原。':''}建議先匯出目前資料。確定繼續嗎？`))return;
      db=incoming;ensureExtras();
      if(hasApiKeys)db.settings.apiKeys={...apiSource};
      save();
      if(hasConfig){
        const safe={};['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'].forEach(k=>{if(typeof configSource[k]==='string')safe[k]=configSource[k]});
        localStorage.setItem(FIREBASE_CONFIG_STORAGE_KEY,JSON.stringify({...FIREBASE_CONFIG_DEFAULT,...safe}));
        FIREBASE_CONFIG={...FIREBASE_CONFIG_DEFAULT,...safe};
      }
      closeModal();render();
      if(hasConfig){alert('學習資料與 Firebase 設定已匯入。'+(hasApiKeys?'自訂 API 金鑰也已還原。':'未從備份還原自訂 API 金鑰。')+'Firebase 設定需重新載入頁面後套用。請妥善保管含金鑰的備份檔。');}
      else if(hasApiKeys)alert('學習資料與自訂 API 金鑰已匯入。請妥善保管含金鑰的備份檔。');
      else alert('學習資料匯入成功');
    }catch(e){console.error('JSON 匯入失敗：',e);alert('匯入失敗：JSON 格式不正確，或不是有效的拾光自習備份檔。請確認檔案完整後再試。')}
  };
  reader.onerror=()=>alert('無法讀取檔案，請重新選擇備份檔。');
  reader.readAsText(file);
};

<script id="study-youtube-api-recovery">
/* Single, instrumented YouTube IFrame API loader/player lifecycle. */
(function(){
  window.__studyYtLoadTimer = null;
  window.__studyYtPlayerTimer = null;
  window.__studyYtLoadAttempt = window.__studyYtLoadAttempt || 0;
  window.__studyYtMountNode = null;
  window.__studyYtProgress = {percent:0,stage:'尚未開始',failed:false};

  function diagnosticText(){
    const mount=document.getElementById('studyYoutubePlayer');
    const wrap=mount?.closest('.study-bgm-player-wrap');
    const rect=mount?.getBoundingClientRect();
    const protocol=location.protocol==='file:'?'file:// 本機檔案':location.protocol;
    const api=!!(window.YT&&typeof window.YT.Player==='function');
    const player=!!studyBgmPlayer;
    const ready=!!studyBgmPlayerReady;
    const size=rect?Math.round(rect.width)+'×'+Math.round(rect.height):'無掛載節點';
    const iframe=mount?.querySelector('iframe')||wrap?.querySelector('iframe');
    const iframeState=iframe?'iframe已插入':'iframe未插入';
    const connected=mount?.isConnected?'節點已連接':'節點未連接';
    return `來源=${protocol}；API=${api?'已載入':'未載入'}；播放器=${player?'已建立':'未建立'}；就緒=${ready?'是':'否'}；容器=${size}；${connected}；${iframeState}；外層=${wrap?'存在':'不存在'}`;
  }
  window.getStudyBgmDiagnostics=function(){
    const mount=document.getElementById('studyYoutubePlayer'); const iframe=mount?.querySelector('iframe')||mount?.closest('.study-bgm-player-wrap')?.querySelector('iframe');
    return { ...window.__studyYtProgress, protocol:location.protocol, secureContext:window.isSecureContext, readyState:document.readyState, apiLoaded:!!(window.YT&&typeof window.YT.Player==='function'), apiLoading:!!studyBgmApiLoading, playerCreated:!!studyBgmPlayer, playerReady:!!studyBgmPlayerReady, mountExists:!!mount, mountConnected:!!mount?.isConnected, iframeExists:!!iframe, iframeSrc:iframe?.src||'', userAgent:navigator.userAgent, diagnostic:diagnosticText() };
  };
  window.setStudyBgmProgress=function(percent,stage,failed=false){
    const n=Math.max(0,Math.min(100,Math.round(Number(percent)||0)));
    window.__studyYtProgress={percent:n,stage:String(stage||''),failed:!!failed};
    const box=document.getElementById('studyBgmProgress');
    const label=document.getElementById('studyBgmProgressLabel');
    const pct=document.getElementById('studyBgmProgressPercent');
    const fill=document.getElementById('studyBgmProgressFill');
    const diag=document.getElementById('studyBgmDiagnostic');
    if(box)box.hidden=!(n>0||failed);
    if(label)label.textContent=(failed?'未完成：':n===100?'完成：':'初始化：')+String(stage||'');
    if(pct)pct.textContent=failed?'失敗':n+'%';
    if(fill){fill.style.width=(failed?0:n)+'%';fill.classList.toggle('failed',!!failed);}
    if(diag)diag.textContent=diagnosticText();
  };
  function clearTimer(name){if(window[name]){clearTimeout(window[name]);window[name]=null;}}
  function fail(stage,message){
    clearTimer('__studyYtLoadTimer');clearTimer('__studyYtPlayerTimer');
    studyBgmApiLoading=false;
    const localContent=location.protocol==='content:'||location.protocol==='file:';
    const sourceNote=localContent?'目前使用 '+location.protocol+' 本機內容來源，通常沒有一般 HTTPS 網站的 Referer。單靠修改 HTML 無法可靠補出該來源；請以 HTTPS 網址測試，若包成 APK，需由 WebView 使用有效的 base URL。':'';
    window.setStudyBgmProgress(0,stage,true);
    const shortMessage=String(message||'播放器初始化失敗。').split('（來源=')[0].slice(0,180);
    setStudyBgmHint(shortMessage+(sourceNote?' '+sourceNote:'')+' 完整狀態請看下方診斷列。',true);
  }
  function apiReady(){
    return !!(window.YT&&typeof window.YT.Player==='function');
  }

  window.loadStudyYoutubeApi=function(){
    if(apiReady()){
      studyBgmApiReady=true;studyBgmApiLoading=false;
      window.setStudyBgmProgress(Math.max(window.__studyYtProgress.percent,35),'YouTube API 已載入');
      window.createStudyYoutubePlayer();
      return;
    }
    if(studyBgmApiLoading){
      setStudyBgmHint('正在載入 YouTube API（'+(window.__studyYtProgress.percent||15)+'%）…');
      return;
    }
    studyBgmApiLoading=true;studyBgmApiReady=false;window.__studyYtLoadAttempt++;
    window.setStudyBgmProgress(8,'已開始請求 YouTube API');
    setStudyBgmHint('正在連線 YouTube（8%）…');

    /* Set the callback before adding the script, and reuse only a live request. */
    window.onYouTubeIframeAPIReady=function(){
      clearTimer('__studyYtLoadTimer');
      studyBgmApiReady=apiReady();studyBgmApiLoading=false;
      if(!studyBgmApiReady){fail('API 回呼沒有有效的 YT.Player','YouTube API 回應不完整。請檢查網路、內容封鎖或 WebView 設定。');return;}
      window.setStudyBgmProgress(35,'YouTube API 已載入，準備建立播放器');
      window.createStudyYoutubePlayer();
    };

    let sc=document.querySelector('script[data-study-youtube-api="1"]')||document.querySelector('script[src*="youtube.com/iframe_api"]');
    if(sc && sc.dataset.studyYoutubeFailed==='1') { try{sc.remove()}catch(e){} sc=null; }
    const newScript=!sc;
    if(!sc){sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.async=true;sc.dataset.studyYoutubeApi='1';}
    /* Attach handlers before insertion to avoid missing a very fast load/error event. */
    sc.onerror=function(){
      sc.dataset.studyYoutubeFailed='1';try{sc.remove()}catch(e){}
      fail('YouTube API 下載失敗','無法下載 YouTube 播放器程式。請檢查網路、DNS、廣告／內容封鎖或 WebView 網路權限。');
    };
    clearTimer('__studyYtLoadTimer');
    window.__studyYtLoadTimer=setTimeout(function(){
      if(!apiReady()){
        try{if(sc&&sc.parentNode)sc.remove()}catch(e){}
        fail('API 等待逾時','15 秒內沒有收到 YouTube API 回應。此時尚未進入影片播放階段。');
      }
    },15000);
    if(newScript)document.head.appendChild(sc);
    /* Covers the case where the API became available between the first check and timer setup. */
    if(apiReady())window.onYouTubeIframeAPIReady();
  };

  window.createStudyYoutubePlayer=function(){
    const mount=document.getElementById('studyYoutubePlayer');
    if(!studyBgmApiReady||!mount||!apiReady())return;
    if(studyBgmPlayer&&window.__studyYtMountNode!==mount){
      try{studyBgmPlayer.destroy?.()}catch(e){}
      studyBgmPlayer=null;studyBgmPlayerReady=false;
    }
    if(studyBgmPlayer){
      if(studyBgmPlayerReady)window.setStudyBgmProgress(Math.max(window.__studyYtProgress.percent,70),'播放器已就緒');
      return;
    }
    window.__studyYtMountNode=mount;studyBgmPlayerReady=false;studyBgmLastState=-1;
    window.setStudyBgmProgress(48,'正在建立 200×200 播放器視窗');
    setStudyBgmHint('YouTube API 已載入，正在建立播放器（48%）…');
    try{
      const playerVars={autoplay:0,controls:1,playsinline:1,rel:0,iv_load_policy:3,enablejsapi:1};
      if(location.protocol==='http:'||location.protocol==='https:')playerVars.origin=location.origin;
      const playerOptions={width:200,height:200,playerVars,events:{
        onReady:function(e){
          clearTimer('__studyYtPlayerTimer');studyBgmPlayerReady=true;studyBgmApiReady=true;
          try{e.target.setVolume(studyBgmVolume)}catch(err){}
          window.setStudyBgmProgress(72,'播放器已回報 onReady');
          const pending=studyBgmPendingId;
          if(pending){
            if(!/^[A-Za-z0-9_-]{11}$/.test(String(pending))){
              studyBgmPendingId='';
              fail('影片 ID 格式錯誤','播放器已就緒，但待播放的影片 ID 不是有效的 11 字元 YouTube ID。請刪除該筆舊曲目，重新貼上完整 YouTube 網址。');
              return;
            }
            studyBgmPendingId='';
            try{
              e.target.cueVideoById({videoId:String(pending),suggestedQuality:'small'});
              studyBgmUserWantsPlay=false;studyBgmPauseGuard=true;applyStudyBgmRate();
              window.setStudyBgmProgress(100,'曲目已載入，等待手動播放');
              setStudyBgmHint('曲目已載入，尚未播放。請手動按「播放」開始。');
            }catch(err){studyBgmPendingId=pending;fail('載入影片失敗','播放器已就緒，但無法載入影片。請再按一次播放或換一支影片。');}
          }else{
            window.setStudyBgmProgress(72,'播放器已就緒，等待選擇曲目');
            setStudyBgmHint('播放器已就緒，請新增或選擇 BGM。');
          }
        },
        onStateChange:function(e){
          studyBgmLastState=e.data;
          const b=document.getElementById('studyBgmPlay');
          if(b)b.textContent=e.data===YT.PlayerState.PLAYING?'⏸ 暫停':'▶ 播放';
          if(e.data===YT.PlayerState.PLAYING){
            if(studyBgmPauseGuard||!studyBgmUserWantsPlay){try{studyBgmPlayer?.pauseVideo()}catch(err){};const pb=document.getElementById('studyBgmPlay');if(pb)pb.textContent='▶ 播放';return;}
            applyStudyBgmRate();
            window.setStudyBgmProgress(100,'正在播放');
            setStudyBgmHint('正在播放：'+(studyBgmCurrentName||'YouTube BGM'));
          }else if(e.data===YT.PlayerState.PAUSED){
            if(studyBgmPauseGuard||!studyBgmUserWantsPlay){const pb=document.getElementById('studyBgmPlay');if(pb)pb.textContent='▶ 播放';}
          }else if(e.data===YT.PlayerState.BUFFERING){
            window.setStudyBgmProgress(92,'影片緩衝中');setStudyBgmHint('影片緩衝中（92%）…');
          }else if(e.data===YT.PlayerState.CUED){
            window.setStudyBgmProgress(100,'曲目已載入，等待手動播放');setStudyBgmHint('曲目已載入，尚未播放。請按「播放／暫停」開始；不會自動播放。');
          }else if(e.data===YT.PlayerState.ENDED&&studyBgmLoop&&studyBgmUserWantsPlay&&!studyBgmPauseGuard){
            try{studyBgmPlayer.seekTo(0,true);studyBgmPlayer.playVideo()}catch(err){}
          }
        },
        onAutoplayBlocked:function(){
          window.setStudyBgmProgress(88,'瀏覽器阻擋自動播放');
          setStudyBgmHint('播放器已就緒，但瀏覽器阻擋自動播放。請手動按「播放／暫停」開始。');
        },
        onError:function(e){
          const messages={2:'影片 ID 無效。',5:'影片無法使用 HTML5 播放器播放。',100:'影片不存在、已移除或設為私人。',101:'影片擁有者不允許嵌入播放。',150:'影片擁有者不允許嵌入播放。',153:'YouTube 沒有收到有效的 Referer／用戶端識別資訊。APK 需要使用有效的 HTTPS 網頁來源或正確的 WebView base URL。'};
          fail('YouTube 播放錯誤 '+e.data,messages[e.data]||('YouTube 回報錯誤代碼 '+e.data+'。'));
        }
      }};
      /* Do not pass videoId to the constructor. Some WebViews/API builds reject a stale or malformed saved ID here before onReady can fire. Create a neutral player first, then load only a validated 11-character ID from onReady. */
      delete playerOptions.videoId;
      studyBgmPlayer=new YT.Player('studyYoutubePlayer',playerOptions);
      clearTimer('__studyYtPlayerTimer');
      window.__studyYtPlayerTimer=setTimeout(function(){
        if(!studyBgmPlayerReady){
          const mountNow=document.getElementById('studyYoutubePlayer');
          const frameNow=mountNow?.querySelector('iframe')||mountNow?.closest('.study-bgm-player-wrap')?.querySelector('iframe');
          const extra=frameNow?'iframe 已插入，但 onReady 未回報':'iframe 未插入，播放器可能未建立成功';
          fail('播放器 onReady 逾時',`API 已載入，但播放器未回報 onReady：${extra}。`);
        }
      },15000);
    }catch(err){
      studyBgmPlayer=null;studyBgmPlayerReady=false;window.__studyYtMountNode=null;
      fail('建立播放器時發生例外','建立 YouTube 播放器失敗：'+(err?.message||String(err)));
    }
  };
})();
</script>

/* Brighter, broader touch glow while retaining the original fade timing. */

.soft-touch-glow.is-fading{opacity:0;transform:translate3d(-50%,-50%,0) scale(1.32)!important;}
/* Stable glide: do not animate opacity or scale on the pill during page changes. */
.bottom-nav-indicator{transition:all .35s cubic-bezier(.4,0,.2,1)!important;will-change:left,width,transform;}
.bottom-nav-indicator.dragging{transition:none!important;}

<script id="precision-indicator-stability">
(()=>{
 const sync=()=>{if(typeof updateBottomNavIndicator==='function')requestAnimationFrame(()=>requestAnimationFrame(updateBottomNavIndicator));};
 window.addEventListener('resize',sync,{passive:true});
 window.addEventListener('orientationchange',()=>setTimeout(sync,120),{passive:true});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});
 // Keep the pill visible and let CSS animate its geometry instead of toggling it off/on.
 const indicator=document.getElementById('bottomNavIndicator');
 if(indicator){indicator.style.visibility='visible';indicator.style.display='block';sync();}
 const room=document.getElementById('studyRoomFull');
 if(room){const observer=new MutationObserver(()=>{
   const status=room.querySelector('#studyPomoStatus');
   const running=!!status&&/專注中/.test(status.textContent||'');
   const card=room.querySelector('.study-pomo-card');
   if(card)card.classList.toggle('focus-card-running',running);
 });observer.observe(room,{subtree:true,childList:true,characterData:true,attributes:true});}
})();
</script>

<script id="v112-calendar-root-category-fix">
(()=>{
 'use strict';
 const CALKEY='shiguang.externalCalendarSync.v1', NAVKEY='shiguang.navCustomization.persist.v1';
 const $=(sel,root=document)=>root.querySelector(sel);
 function readCalendar(){try{return JSON.parse(localStorage.getItem(CALKEY)||'{"google":false,"device":false}')}catch(_){return {google:false,device:false}}}
 function calendarUI(){
  const panel=$('#modalRoot .modal');if(!panel||panel.querySelector('.sg-calendar-sync-category'))return;
  const state=readCalendar(),details=document.createElement('details');details.className='sg-calendar-sync-category settings-category-card settings-category-details taskrow mb-4';details.dataset.sgCategory='external-calendar';details.open=false;
  details.innerHTML=`<summary class="settings-category-summary"><span class="settings-category-heading"><span class="settings-category-icon">▦</span><span class="settings-category-title">外部日曆同步設定</span></span><span class="settings-category-chevron" aria-hidden="true">⌄</span></summary><div class="settings-category-content"><label class="sg-calendar-row"><input type="checkbox" id="sgGoogleCalendarSync" ${state.google?'checked':''}><span>啟用 Google 日曆同步</span></label><label class="sg-calendar-row"><input type="checkbox" id="sgDeviceCalendarSync" ${state.device?'checked':''}><span>啟用本機裝置行事曆同步</span></label><button type="button" class="btn primary w-full" id="sgCalendarRefresh">🔄 立即手動重新整理同步</button><p id="sgCalendarStatus" class="sg-calendar-hint" aria-live="polite">兩種來源可獨立開關。實際讀取 Google 日曆需 OAuth/API 授權；讀取 Android 系統行事曆需原生橋接。</p></div>`;
  // Keep this as a root-level settings category, alongside cloud sync and course import.
  const reference=[...panel.querySelectorAll(':scope > details.settings-category-card, :scope > details.settings-category-details')].find(d=>/課表|雲端同步|帳號登入/.test(d.querySelector(':scope > summary')?.textContent||''));
  if(reference)reference.insertAdjacentElement('afterend',details);else panel.appendChild(details);
  const save=()=>{const v={google:$('#sgGoogleCalendarSync',details).checked,device:$('#sgDeviceCalendarSync',details).checked};try{localStorage.setItem(CALKEY,JSON.stringify(v))}catch(_){}};
  $('#sgGoogleCalendarSync',details).addEventListener('change',save);$('#sgDeviceCalendarSync',details).addEventListener('change',save);
  $('#sgCalendarRefresh',details).addEventListener('click',()=>{save();const st=$('#sgCalendarStatus',details),v=readCalendar();if(!v.google&&!v.device){st.textContent='兩種日曆來源皆未啟用；設定已保存，沒有來源需要重新整理。';return;}st.textContent='已檢查同步選項，但目前尚未接通 Google OAuth/API 或 Android 原生行事曆橋接，無法抓取外部事件。';try{window.showToast?.('同步選項已檢查；外部日曆尚未完成串接')}catch(_){}});
 }
 function unifyCategoryIcons(panel){
  if(!panel)return;
  const rules=[
   [/外部日曆|日曆同步|行事曆/i,'▦'],[/課表.*匯入|智慧課表|課程匯入/i,'⇧'],[/帳號登入|雲端同步|雲端/i,'☁'],[/api|金鑰|firebase/i,'⌘'],[/備份|匯出|匯入資料|安全匯出/i,'↗'],[/自定義|自訂/i,'⚙'],[/學期設定|學期/i,'◷'],[/資料清理|清除資料/i,'⌫'],[/介面外觀|主題|外觀/i,'◐'],[/功能引導|操作示範|使用手冊/i,'ⓘ'],[/課程|課表/i,'▤'],[/通知|提醒/i,'◉'],[/隱私|安全/i,'◇'],[/其他服務/i,'⌁']
  ];
  const used=new Set();
  const cards=[...panel.querySelectorAll(':scope > details.settings-category-card, :scope > details.settings-category-details, :scope > details.backup-export-details')];
  cards.forEach((card,index)=>{
   const summary=card.querySelector(':scope > summary');if(!summary)return;
   let heading=summary.querySelector(':scope > .settings-category-heading');
   if(!heading){const old=summary.querySelector(':scope > span:first-child');if(old){heading=old;heading.classList.add('settings-category-heading')}else return;}
   let title=heading.querySelector('.settings-category-title');
   if(!title){const spans=[...heading.querySelectorAll('span')];title=spans.find(x=>!x.classList.contains('settings-category-icon'));if(!title)return;title.classList.add('settings-category-title')}
   let icon=heading.querySelector('.settings-category-icon');
   const label=(title.textContent||'').trim();
   let glyph=(rules.find(([re])=>re.test(label))||[])[1];
   if(!glyph)glyph=['◷','▤','◇','⌘','↗','◐','⌁','⊙','⌫','⇧','▦','◉'][index%12];
   if(used.has(glyph)){glyph=['◷','▤','◇','⌘','↗','◐','⌁','⊙','⌫','⇧','▦','◉'].find(g=>!used.has(g))||'·'}
   used.add(glyph);
   if(!icon){icon=document.createElement('span');icon.className='settings-category-icon';heading.insertBefore(icon,title)}
   /* icon glyph now owned by v1157 icon registry */
  });
 }
 function persistNav(){try{if(!window.db?.settings)return;localStorage.setItem(NAVKEY,JSON.stringify(db.settings.navCustomization||{}))}catch(_){}}
 function restoreNav(){try{const raw=localStorage.getItem(NAVKEY);if(!raw||!window.db?.settings)return;const saved=JSON.parse(raw);db.settings.navCustomization={...(db.settings.navCustomization||{}),...saved,other:{...(db.settings.navCustomization?.other||{}),...(saved.other||{})}}}catch(_){}}
 function installSaveHook(){if(typeof window.save==='function'&&!window.save.__v111Persist){const original=window.save;const wrapped=function(...args){const result=original.apply(this,args);persistNav();return result};wrapped.__v111Persist=true;window.save=wrapped}}
 function watchSliders(){const panel=$('#modalRoot .modal');if(!panel)return;panel.querySelectorAll('.sg-plus-control').forEach(row=>{const hint=row.querySelector('.sg-lock-hint,.sg-preview-lock-hint'),slider=row.querySelector('input[type=range]');if(hint&&slider&&hint.nextElementSibling!==slider){slider.insertAdjacentElement('beforebegin',hint)}});panel.querySelectorAll('.sg-individual-lock').forEach(btn=>{if(btn.dataset.v111AutoLock)return;const row=btn.closest('.sg-plus-control'),slider=row?.querySelector('input[type=range]');if(!slider)return;btn.dataset.v111AutoLock='1';slider.addEventListener('change',()=>{setTimeout(()=>{slider.disabled=true;slider.classList.add('sg-slider-is-locked');slider.setAttribute('aria-disabled','true');btn.textContent='🔒';btn.title='長按解鎖；短按上鎖'},0)})})}
 function afterSettings(){restoreNav();installSaveHook();calendarUI();unifyCategoryIcons($('#modalRoot .modal'));watchSliders()}
 restoreNav();installSaveHook();
 // No whole-document MutationObserver: moving hint nodes inside it caused a mutation loop and froze Settings.
 const original=window.openSettings;
 if(typeof original==='function'&&!original.__v111CalendarSettings){const wrapped=function(...args){const result=original.apply(this,args);setTimeout(afterSettings,0);setTimeout(afterSettings,100);return result};wrapped.__v111CalendarSettings=true;window.openSettings=wrapped}
 document.addEventListener('click',e=>{if(e.target?.closest?.('[onclick*="openSettings"]'))setTimeout(afterSettings,120)},true);
 document.addEventListener('input',e=>{if(/^sg(Nav|Other|Plus)/.test(e.target?.id||''))persistNav()},true);
 document.addEventListener('change',e=>{if(/^sg(Nav|Other|Plus)/.test(e.target?.id||''))persistNav()},true);
 window.addEventListener('pagehide',persistNav);
})();
</script>
