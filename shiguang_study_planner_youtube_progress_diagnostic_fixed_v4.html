/* Comprehensive motion polish: transform/opacity only for low-cost transitions. */
:root{--motion-fast:150ms;--motion-ui:260ms;--motion-ease:cubic-bezier(.2,.75,.25,1)}
.btn,.pill,.drawer-link,.taskrow,.planner-day-card,.planner-day-task,.course,.navbtn,.study-action,.study-mode-buttons button,.study-start-buttons button,.bottom-nav-glass,.quick-add{transition:transform var(--motion-fast) var(--motion-ease),background-color var(--motion-ui) ease,border-color var(--motion-ui) ease,box-shadow var(--motion-ui) ease,filter var(--motion-fast) ease}
.btn:active,.pill:active,.drawer-link:active,.study-action:active,.study-mode-buttons button:active,.study-start-buttons button:active,.navbtn:active{transform:scale(.97)}
.taskrow,.planner-day-card,.planner-day-task,.course{will-change:transform}
.taskrow:hover,.planner-day-card:hover,.planner-day-task:hover{border-color:#58d6f566;box-shadow:0 8px 24px #02061722}
.modal-backdrop{opacity:1;transition:opacity 190ms ease;}
.modal-enter{opacity:0}.modal-enter-active{opacity:1}.modal-leave{opacity:0;pointer-events:none}

.modal-enter-panel.modal-enter-active{opacity:1;transform:translateY(0) scale(1)}
.modal-leave-panel{opacity:0;transform:translateY(8px) scale(.985)}
.timer-ring{will-change:background,filter}.timer-ring.is-running,.study-ring.is-running{animation:focus-breathe 2.8s ease-in-out infinite}
@keyframes focus-breathe{0%,100%{filter:drop-shadow(0 0 2px #58d6f522)}50%{filter:drop-shadow(0 0 15px #58d6f566)}}
.app-toast.show{animation:toast-pop 260ms var(--motion-ease) both}
@keyframes toast-pop{from{opacity:0;transform:translate(-50%,12px) scale(.98)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
#main{animation:page-enter 220ms var(--motion-ease) both}

],exams:[],tasks:[],plans:[],overrides:{},settings:{weekStart:mondayOf(isoToday())}}}

// ===== Firebase 設定區：請把下方範例值替換成自己的 Firebase Web App 設定 =====
// Firebase Console：建立專案 → 新增 Web App → 複製 firebaseConfig。
// 請勿將服務帳戶私鑰放進前端 HTML；這裡只放 Firebase Web App 公開設定。
// Firestore Rules 需限制使用者只能讀寫自己的 users/{uid}/studyPlanner/{docId}：
// match /users/{uid}/studyPlanner/{docId} { allow read, write: if request.auth != null && request.auth.uid == uid; }
const FIREBASE_CONFIG_DEFAULT = {
  apiKey: "在此填入自己的_apiKey",
  authDomain: "在此填入自己的專案.firebaseapp.com",
  projectId: "在此填入自己的_projectId",
  storageBucket: "在此填入自己的專案.firebasestorage.app",
  messagingSenderId: "在此填入自己的_messagingSenderId",
  appId: "在此填入自己的_appId",
  measurementId: ""
};
const FIREBASE_CONFIG_STORAGE_KEY = 'shiguang-firebase-config-v1';
let FIREBASE_CONFIG = (()=>{try{return {...FIREBASE_CONFIG_DEFAULT,...JSON.parse(localStorage.getItem(FIREBASE_CONFIG_STORAGE_KEY)||'{}')}}catch(e){return {...FIREBASE_CONFIG_DEFAULT}}})();
let cloudAuth=null, cloudDb=null, cloudStorage=null, currentUser=null, cloudReady=false, cloudUnsubscribe=null;
let cloudSaveTimer=null, cloudApplying=false, cloudStatus='尚未登入，資料暫存於本機';
function firebaseConfigured(){return FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('在此填入') && FIREBASE_CONFIG.projectId && !FIREBASE_CONFIG.projectId.startsWith('在此填入')}
function setCloudStatus(s){cloudStatus=s;const el=document.getElementById('cloudStatus');if(el)el.textContent=s;const drawer=document.getElementById('cloudDrawerStatus');if(drawer)drawer.textContent=s;const pill=document.getElementById('cloudStatusPill');if(pill){const t=String(s);pill.title=t;const syncing=/正在同步|正在載入|等待雲端同步/.test(t),synced=/同步完成|已載入|首次登入：已將|已接收其他裝置/.test(t),local=/尚未登入|暫存於本機|等待雲端同步/.test(t),error=/失敗|請先填入/.test(t);pill.textContent=error?'同步異常':syncing?'同步中…':synced?(t.match(/同步完成[^·]*/)?.[0]?.trim()||'已同步'):local?'僅存本機':'雲端狀態';pill.classList.toggle('is-syncing',syncing);pill.classList.toggle('is-synced',synced);pill.classList.toggle('is-local',local);pill.classList.toggle('is-error',error);}}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db)); window.__storageWriteFailed=false;}catch(e){window.__storageWriteFailed=true;console.warn('LocalStorage 儲存失敗',e);if(e && (e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'))showToast('本機儲存空間不足，請先匯出備份或移除大型照片','error');}
  if(currentUser && cloudDb && cloudReady && !cloudApplying){
    clearTimeout(cloudSaveTimer); setCloudStatus('資料已儲存於本機，等待雲端同步…');
    cloudSaveTimer=setTimeout(()=>writeCloudData(false),700);
  }else if(!currentUser){setCloudStatus('尚未登入，資料暫存於本機')}
}
function initFirebase(){
  if(!firebaseConfigured()){setCloudStatus('請先填入 Firebase 設定，再啟用雲端同步');return}
  try{
    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
    cloudAuth=firebase.auth();cloudDb=firebase.firestore();cloudStorage=firebase.storage();
    // 啟用 Firestore 離線快取（若瀏覽器/環境不支援，仍保留 LocalStorage 備援）。
    cloudDb.enablePersistence({synchronizeTabs:true}).catch(e=>console.info('Firestore 離線快取未啟用：',e.code||e.message));
    cloudAuth.onAuthStateChanged(async user=>{
      currentUser=user||null; cloudReady=false; if(typeof syncSocialOnAuth==='function')syncSocialOnAuth();
      if(cloudUnsubscribe){cloudUnsubscribe();cloudUnsubscribe=null}
      updateAccountUI();
      if(!user){setCloudStatus('尚未登入，資料暫存於本機');return}
      setCloudStatus('正在載入雲端資料…');
      const ref=cloudDb.collection('users').doc(user.uid).collection('studyPlanner').doc('main');
      try{
        const snap=await ref.get();
        if(snap.exists && snap.data().data){
          cloudApplying=true;db=snap.data().data;ensureExtras();localStorage.setItem(KEY,JSON.stringify(db));cloudApplying=false;render();
          setCloudStatus('已載入此帳號的雲端資料');
        }else{
          // 該帳號尚無雲端文件：先把本機補抄照片移至 Storage，再初始化雲端資料。
          await ensureSnapImagesCloud();
          await ref.set({data:db,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),schemaVersion:1});
          setCloudStatus('首次登入：已將本機資料備份至雲端');
        }
        cloudReady=true;
        if(typeof syncSocialOnAuth==='function')syncSocialOnAuth();
        cloudUnsubscribe=ref.onSnapshot(s=>{
          if(!s.exists||!s.data().data)return;
          const remote=s.data().data;
          // 避免自己的寫入回聲重繪；僅在內容不同時套用其他裝置的變更。
          if(JSON.stringify(remote)!==JSON.stringify(db)){
            cloudApplying=true;db=remote;ensureExtras();localStorage.setItem(KEY,JSON.stringify(db));cloudApplying=false;render();
            setCloudStatus('已接收其他裝置的最新資料');
          }
        },err=>{console.error(err);setCloudStatus('雲端讀取失敗，暫時使用本機資料')});
      }catch(e){cloudApplying=false;console.error(e);setCloudStatus('雲端連線失敗，資料仍保存在本機：'+(e.code||e.message))}
    });
  }catch(e){console.error(e);setCloudStatus('Firebase 初始化失敗，請檢查設定')}
}
async function signInEmailPassword(){
  if(!firebaseConfigured()){alert('請先在「系統設定 → API／金鑰設定」填入 Firebase 專案設定。');return}
  const email=(document.getElementById('cloudLoginEmail')?.value||'').trim();
  const password=document.getElementById('cloudLoginPassword')?.value||'';
  if(!email||!password){alert('請輸入電子郵件與密碼。');return}
  if(!cloudAuth){alert('Firebase 尚未初始化，請確認設定並重新載入頁面。');return}
  try{await cloudAuth.signInWithEmailAndPassword(email,password)}
  catch(e){alert('登入失敗：'+(e.code==='auth/invalid-credential'?'電子郵件或密碼不正確。':e.code==='auth/too-many-requests'?'嘗試次數過多，請稍後再試。':e.message))}
}
async function createEmailAccount(){
  if(!firebaseConfigured()){alert('請先在「系統設定 → API／金鑰設定」填入 Firebase 專案設定。');return}
  const email=(document.getElementById('cloudLoginEmail')?.value||'').trim();
  const password=document.getElementById('cloudLoginPassword')?.value||'';
  if(!email||!password){alert('請先輸入電子郵件與密碼。');return}
  if(password.length<6){alert('密碼至少需要 6 個字元。');return}
  if(!cloudAuth){alert('Firebase 尚未初始化，請確認設定並重新載入頁面。');return}
  try{await cloudAuth.createUserWithEmailAndPassword(email,password);alert('帳號建立成功，已登入並啟用雲端同步。')}
  catch(e){alert('建立帳號失敗：'+(e.code==='auth/email-already-in-use'?'此電子郵件已註冊，請直接登入。':e.code==='auth/weak-password'?'密碼強度不足，請使用至少 6 個字元。':e.message))}
}
async function resetEmailPassword(){
  const email=(document.getElementById('cloudLoginEmail')?.value||'').trim();
  if(!email){alert('請先輸入電子郵件，再按「忘記密碼」。');return}
  if(!cloudAuth){alert('Firebase 尚未初始化，請確認設定並重新載入頁面。');return}
  try{await cloudAuth.sendPasswordResetEmail(email);alert('已寄出密碼重設郵件，請查看收件匣及垃圾郵件匣。')}
  catch(e){alert('無法寄送重設郵件：'+e.message)}
}
async function signOutAccount(){if(!cloudAuth)return;try{await cloudAuth.signOut();setCloudStatus('已登出，後續資料儲存於本機')}catch(e){alert('登出失敗：'+e.message)}}
async function ensureSnapImagesCloud(){if(!currentUser||!cloudStorage||!Array.isArray(db.snapNotes))return;let changed=false;for(const n of db.snapNotes){if(typeof n.image==='string'&&n.image.startsWith('data:image/')){try{const blob=await (await fetch(n.image)).blob();const ref=cloudStorage.ref(`users/${currentUser.uid}/snapNotes/${n.id}.jpg`);await ref.put(blob,{contentType:'image/jpeg'});n.image=await ref.getDownloadURL();changed=true}catch(e){console.warn('照片上傳雲端失敗，保留本機圖片：',e);}}}if(changed){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}}
async function writeCloudData(manual){
  if(!currentUser||!cloudDb){if(manual)alert('請先登入帳號並完成 Firebase 設定。');return}
  try{
    setCloudStatus('正在同步雲端…');
    await ensureSnapImagesCloud();
    await cloudDb.collection('users').doc(currentUser.uid).collection('studyPlanner').doc('main').set({data:db,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),schemaVersion:1});

function currentClassInfo(){
 const now=new Date(),today=isoToday(),day=(now.getDay()+6)%7,minutes=now.getHours()*60+now.getMinutes();
 if(day>4)return {kind:'free',message:'今天沒有常態課程，享受自由時間／專注讀書吧！'};
 let active=null,next=null;
 for(let p=0;p<PERIODS.length;p++){
  const c=courseFor(day,p,today);if(!c)continue;
  const [sh,sm]=PERIODS[p][0].split(':').map(Number),[eh,em]=PERIODS[p][1].split(':').map(Number),a=sh*60+sm,b=eh*60+em;
  if(minutes>=a&&minutes<b){active={course:c,period:p,end:b,remaining:b-minutes};break}
  if(minutes<a&&!next)next={course:c,period:p,start:a,until:a-minutes};
 }
 if(active)return {kind:'active',...active};if(next)return {kind:'next',...next};
 return {kind:'free',message:'目前沒有後續課程，享受自由時間／專注讀書吧！'};
}

function openPrepReminderSettings(){ensureExtras();showModal(`<h3 class="text-xl font-black mb-3">⏰ 前一天提醒設定</h3><p class="text-sm text-slate-400 mb-3">當 App 開啟時，系統會在設定時間檢查明日清單，並在當天顯示一次提醒。若瀏覽器或 App 關閉，無法保證背景推播。</p><form onsubmit="savePrepReminder(event)"><label>提醒時間</label><input class="field mt-1" type="time" name="time" value="${escapeHtml(db.settings.prepReminderTime||'18:00')}" required><button class="btn primary w-full mt-4" type="submit">儲存提醒時間</button></form><button class="btn w-full mt-2" onclick="showPrepReminder(true)">立即預覽提醒</button>`)}
function savePrepReminder(ev){ev.preventDefault();db.settings.prepReminderTime=new FormData(ev.target).get('time')||'18:00';save();closeModal();render()}
function showPrepReminder(force=false){const items=prepItemsForTomorrow();if(!items.length&&!force)return;const grouped={};items.filter(x=>!x.done).forEach(x=>{const k=prepCourseName(x);(grouped[k]||=[]).push(escapeHtml(x.name))});const msg=Object.keys(grouped).length?Object.entries(grouped).map(([c,n])=>`⚠️ 明天有「${c}」，請記得攜帶：${n.join('、')}！`).join('<br>'):'明日攜帶物品已全部打包完成！';showModal(`<div class="text-center"><div class="text-4xl mb-3">🎒</div><h3 class="text-xl font-black mb-3">明日上課準備提醒</h3><div class="taskrow text-left leading-7">${msg}</div><button class="btn primary w-full mt-4" onclick="closeModal()">知道了，開始打包</button></div>`)}
function checkPrepReminder(){try{ensureExtras();const now=new Date(),time=now.toTimeString().slice(0,5),key='shiguang-prep-reminder-'+isoToday();if(time>=(db.settings.prepReminderTime||'18:00')&&localStorage.getItem(key)!== '1'&&prepItemsForTomorrow().some(x=>!x.done)){localStorage.setItem(key,'1');showPrepReminder()}}catch(e){}}
setInterval(()=>{if(document.visibilityState!=='hidden')checkPrepReminder()},30000);

// 每週固定課堂提醒：頁面開啟時檢查課堂開始時間，已提醒的任務／日期不會重複彈出。
function checkWeeklyTaskReminders(){
 try{
  if(document.visibilityState==='hidden')return;
  const now=new Date(),today=isoToday(),day=(now.getDay()+6)%7,minute=now.getHours()*60+now.getMinutes();
  (db.tasks||[]).filter(t=>t.weeklyRecurring&&!t.done&&Number(t.recurringDay)===day&&t.linkedCourseId&&!(Array.isArray(t.recurringCompletedDates)&&t.recurringCompletedDates.includes(today))).forEach(t=>{
   const course=db.courses.find(c=>c.id===t.linkedCourseId&&c.day===day&&c.period===Number(t.recurringPeriod));if(!course)return;
   const start=PERIODS[Number(t.recurringPeriod)]?.[0];if(!start)return;const [hh,mm]=start.split(':').map(Number),startMinute=hh*60+mm;
   if(Math.abs(minute-startMinute)>0)return;
   const key=`shiguang-weekly-task-reminder-${t.id}-${today}`;if(localStorage.getItem(key)==='1')return;localStorage.setItem(key,'1');
   const message=`${t.title||'自習／待辦任務'} · ${course.subject} 第${Number(t.recurringPeriod)+1}節`;
   if('Notification' in window&&Notification.permission==='granted'){try{new Notification('拾光自習｜每週課堂提醒',{body:message,tag:key})}catch(e){}}
   if(typeof showToast==='function')showToast(`🔔 每週提醒：${message}`);
  });
 }catch(e){console.warn('Weekly reminder check failed',e)}
}
setInterval(checkWeeklyTaskReminders,15000);
setTimeout(checkWeeklyTaskReminders,1800);

function courseFor(day,period,date){let override=db.overrides[date]?.[period];if(override!==undefined)return override==='cancel'?null:override;return db.courses.find(c=>c.day===day&&c.period===period)||null}
function schedulePage(){let dates=Array.from({length:5},(_,i)=>dateAdd(weekStart,i));let rows='';for(let p=0;p<7;p++){rows+=`<div class="period flex flex-col items-center justify-center"><b class="text-slate-300">${p+1}</b><span>${PERIODS[p][0]}</span><span>${PERIODS[p][1]}</span></div>`;for(let d=0;d<5;d++){let c=courseFor(d,p,dates[d]);let exams=c?examFor(c.subject,dates[d]):[];let linkedDeadlines=c?db.tasks.filter(t=>!t.done&&t.due===dates[d]&&((t.linkedCourseId&&t.linkedCourseId===c.id)||((t.linkedCourseName||t.subject)===c.subject))&&(t.taskKind==='assignment'||!t.taskKind||t.taskKind==='other')):[];rows+=`<div class="course min-h-[74px] ${c?'':'opacity-30 border-dashed'} ${linkedDeadlines.length?'has-homework':''}" data-day="${d}" data-period="${p}" data-date="${dates[d]}" data-course-id="${c?(c.id||''):''}" data-course-present="${c?'1':'0'}" style="${c?`background:${COLORS[c.color%COLORS.length][0]};color:${COLORS[c.color%COLORS.length][1]}`:'background:#111827'}" ${c?`onclick="if(!window.__suppressCourseClick)courseAction('${dates[d]}',${p},'${c.id||''}')"`:''}>${c?`<strong>${escapeHtml(c.subject)}</strong>${exams.length?'<span class="tag">⚠ 今日考試</span>':''}${linkedDeadlines.length?`<span class="homework-dot">📝 ${linkedDeadlines.length>1?linkedDeadlines.length+' 項作業':'作業截止'}</span>`:''}${c.room?`<small>@${escapeHtml(c.room)}</small>`:''}${c.teacher?`<small>${escapeHtml(c.teacher)}</small>`:''}`:'<small>＋</small>'}</div>`}if(p===3)rows+=`<div class="breakbar">午休 · 12:00–13:10</div>`}
return `<div class="flex items-center justify-between mb-4"><div><h2 class="text-xl font-black">每週課程表</h2><p class="text-xs text-slate-400 mt-1">常態循環 · 單日調課不影響原課表</p></div><button class="btn" onclick="openAdd('course')">＋ 課程</button></div><div class="glass rounded-2xl p-2 mb-3"><div class="flex justify-between items-center px-1 pb-3"><button class="btn !p-2" onclick="shiftWeek(-7)">‹</button><div class="text-sm font-bold">第 ${Math.max(1,Math.ceil((new Date(weekStart+'T12:00:00')-new Date(new Date(weekStart+'T12:00:00').getFullYear(),0,1))/604800000)+1)} 週</div><button class="btn !p-2" onclick="shiftWeek(7)">›</button></div><div class="schedule-grid"><div></div>${dates.map((d,i)=>`<div class="dayhead"><div>${DAYNAMES[i]}</div><div class="date">${fmt(d)}</div></div>`).join('')}${rows}<div class="breakbar">晚休 · 放學後好好休息</div></div></div><div class="flex justify-center gap-2 mb-4"><button class="btn primary !rounded-full px-7" onclick="backToday()">今</button><button class="btn" onclick="openAdd('override')">單日調課／補課</button></div><p class="text-xs text-slate-500 px-1">點選課程卡片可查看考試、編輯課程或調整單日安排。空白格也能新增當日課程。</p>`}
function matrixPage(){
 const groups=[['do','重要且緊急','立即處理','border-rose-400/30 bg-rose-950/20'],['schedule','重要但不緊急','安排時間','border-cyan-400/30 bg-cyan-950/20'],['delegate','不重要但緊急','盡可能簡化','border-amber-400/30 bg-amber-950/20'],['delete','不重要且不緊急','考慮減少','border-slate-400/30 bg-slate-800/40']];
 const categoryName=k=>({assignment:'📝 作業',exam:'💯 考試',course:'📚 課程',other:'📌 其他／待辦'}[k]||'📌 其他／待辦');
 const categoryTag=k=>`<span class="matrix-category-tag ${k==='assignment'?'tag-assignment':k==='exam'?'tag-exam':k==='course'?'tag-course':'tag-other'}">${categoryName(k)}</span>`;
 const matches=k=>matrixFilter==='all'||(matrixFilter==='exam'?k==='exam':k===matrixFilter);
 const all=groups.map(g=>{const tasks=db.tasks.filter(t=>!t.done&&(t.quadrant||'schedule')===g[0]&&matches(t.taskKind||'other'));const exams=db.exams.filter(e=>!e.done&&(e.quadrant||'schedule')===g[0]&&matches('exam'));
 return `<section class="quad ${g[3]}"><div class="quad-head"><div><div class="font-bold text-sm">${g[1]}</div><div class="text-xs text-slate-400 mt-1">${g[2]}</div></div><button class="quad-add" aria-label="在${g[1]}新增任務" onclick="openMatrixAdd('${g[0]}')">＋</button></div>${tasks.map(t=>`<div class="matrix-entry ${t.done?'done':''}"><input class="check mt-1" type="checkbox" ${t.done?'checked':''} aria-label="完成${escapeHtml(t.title)}" onchange="toggleTask('${t.id}',this.checked)"><button class="flex-1 text-left min-w-0" onclick="editTask('${t.id}')"><div class="entry-title">${categoryTag(t.taskKind||'other')} ${escapeHtml(t.title)}</div><div class="entry-meta">${t.due?fmt(t.due):'未設定日期'}${t.subject?' · '+escapeHtml(t.subject):''}</div></button><button class="text-slate-500 px-1" aria-label="刪除任務" onclick="deleteItem('tasks','${t.id}')">×</button></div>`).join('')}${exams.map(e=>`<div class="matrix-entry ${e.done?'done':''}"><input class="check mt-1" type="checkbox" ${e.done?'checked':''} aria-label="完成考試${escapeHtml(e.subject)}" onchange="toggleExamDone('${e.id}',this.checked)"><button class="flex-1 text-left min-w-0" onclick="viewExam('${e.id}')"><div class="entry-title">${categoryTag('exam')} ${escapeHtml(e.subject)}</div><div class="entry-meta">${e.date?fmt(e.date):'未設定日期'} ${escapeHtml(e.time||'')}</div></button><button class="text-slate-500 px-1" aria-label="刪除考試" onclick="deleteItem('exams','${e.id}')">×</button></div>`).join('')}${!tasks.length&&!exams.length?'<div class="text-xs text-slate-600 mt-4">此分類目前沒有任務</div>':''}</section>`}).join('');
 const tabs=[['all','全部分類'],['assignment','📝 作業'],['exam','💯 考試'],['other','📌 其他']];
 return `<div class="mb-4"><h2 class="text-xl font-black">艾森豪矩陣</h2><p class="text-sm text-slate-400 mt-1">依類別篩選任務；勾選完成後會立即移至已完成紀錄，撤回即可回到原象限。</p></div><div class="matrix-filter-tabs mb-4">${tabs.map(([k,label])=>`<button class="pill ${matrixFilter===k?'selected':''}" onclick="setMatrixFilter('${k}')">${label}</button>`).join('')}</div><div class="grid grid-cols-2 gap-3 matrix-grid">${all}</div><div class="mt-4">${card('近期考試',db.exams.filter(e=>e.date>=isoToday()&&!e.done).sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="taskrow mb-2 flex justify-between items-center"><div><b>${escapeHtml(e.subject)}</b><div class="text-xs text-slate-400 mt-1">${fmt(e.date)} · ${escapeHtml(e.scope||'範圍待補')}</div></div><button class="btn !p-2" onclick="viewExam('${e.id}')">查看</button></div>`).join('')||'<p class="text-sm text-slate-500">新增考試後，便能在這裡檢視。</p>')}</div>`
}
function setMatrixFilter(value){matrixFilter=value;render()}
function openMatrixAdd(quadrant){showModal(`<div class="flex justify-between items-center mb-4"><div><h3 class="text-xl font-black">在此象限新增</h3><p class="text-sm text-slate-400 mt-1">優先級已鎖定</p></div><button class="text-slate-400 text-xl" onclick="closeModal()">×</button></div><div class="quick-category-grid"><button class="quick-category" onclick="closeModal();openAdd('task',{quadrant:'${quadrant}',taskKind:'assignment',lockQuadrant:true})"><span class="qicon">📝</span><b>作業</b></button><button class="quick-category" onclick="closeModal();openAdd('exam',{quadrant:'${quadrant}',lockQuadrant:true})"><span class="qicon">💯</span><b>考試</b></button><button class="quick-category" onclick="closeModal();openAdd('task',{quadrant:'${quadrant}',taskKind:'other',lockQuadrant:true})"><span class="qicon">📌</span><b>其他／待辦</b></button></div>`)}
function ensurePlannerData(){
  db.plannerBlocks ||= [];
  db.plannerSettings ||= {repeatDefault:false};
  // Keep existing plan data and turn its steps into visible schedule blocks once, without deleting legacy plans.
  if(!db._plannerMigrated){
    db.plans ||= [];
    db.plans.forEach(p=>(p.steps||[]).forEach((step,i)=>{
      if(!db.plannerBlocks.some(b=>b.legacyPlanId===p.id&&b.legacyStepIndex===i)){
        const date=step.date||isoToday(), day=(new Date(date+'T12:00:00').getDay()+6)%7;
        db.plannerBlocks.push({id:uid(),weekStart:mondayOf(date),day,start:'19:00',end:'19:45',subject:p.subject||'',scope:step.text||p.title||'複習',done:!!step.done,legacyPlanId:p.id,legacyStepIndex:i,color:(i%COLORS.length)});
      }
    }));
    db._plannerMigrated=true; save();
  }
}
function plannerWeekNumber(start){return semesterWeekNumber(start)}
function semesterWeekNumber(date){const start=db.settings?.semesterStart;if(!start)return Math.max(1,Math.floor((new Date(mondayOf(date)+'T12:00:00')-new Date(mondayOf(`${new Date(date+'T12:00:00').getFullYear()}-01-01`)+'T12:00:00'))/604800000)+1);return Math.max(1,Math.floor((new Date(mondayOf(date)+'T12:00:00')-new Date(mondayOf(start)+'T12:00:00'))/604800000)+1)}
function semesterWeekLabel(date){const start=db.settings?.semesterStart,end=db.settings?.semesterEnd;if(!start)return '尚未設定學期';if(end&&date>end)return '本學期已結束';if(date<start)return '開學前';return `開學第 ${semesterWeekNumber(date)} 週`}
function plannerBlockForm(id='',day=0,start='19:00'){
 const b=id?db.plannerBlocks.find(x=>x.id===id):null;
 const chosenDay=b?b.day:day, chosenStart=b?b.start:start;
 showModal(`<div class="flex justify-between items-center mb-4"><h3 class="text-xl font-black">${b?'編輯讀書時段':'新增讀書時段'}</h3><button class="text-slate-400 text-xl" onclick="closeModal()">×</button></div>
 <form onsubmit="savePlannerBlock(event,'${id}')">
 <div class="grid grid-cols-2 gap-3">
 <div><label>星期</label><select class="field" name="day">${['星期一','星期二','星期三','星期四','星期五','星期六','星期日'].map((d,i)=>`<option value="${i}" ${chosenDay===i?'selected':''}>${d}</option>`).join('')}</select></div>
 <div><label>科目</label><input class="field" name="subject" required value="${escapeHtml(b?.subject||'')}" placeholder="例如：數學"></div>
 <div><label>開始時間</label><input class="field" name="start" type="time" required value="${escapeHtml(chosenStart)}"></div>
 <div><label>結束時間</label><input class="field" name="end" type="time" required value="${escapeHtml(b?.end||'19:45')}"></div>
 </div>
 <div class="mt-3"><label>章節／詳細複習範圍</label><textarea class="field" name="scope" rows="3" required placeholder="例如：第二章 2-1 至 2-3、整理錯題">${escapeHtml(b?.scope||'')}</textarea></div>
 <label class="flex items-center gap-2 mt-3"><input class="check" type="checkbox" name="repeat" ${b?.repeat?'checked':''}>套用到未來 4 週的相同星期與時間</label>
 <div class="flex gap-2 mt-5"><button class="btn primary flex-1" type="submit">儲存時段</button>${b?`<button class="btn" type="button" onclick="deletePlannerBlock('${id}')">刪除</button>`:''}</div>
 </form>`);
}
function savePlannerBlock(ev,id){ev.preventDefault();ensurePlannerData();const f=Object.fromEntries(new FormData(ev.target).entries());if(f.end<=f.start){alert('結束時間必須晚於開始時間。');return}
 const base={weekStart:plannerWeekStart,day:+f.day,start:f.start,end:f.end,subject:f.subject.trim(),scope:f.scope.trim(),done:false,color:(db.plannerBlocks.length%COLORS.length),repeat:!!f.repeat};
 if(id){let b=db.plannerBlocks.find(x=>x.id===id);if(b)Object.assign(b,base,{done:b.done});}
 else db.plannerBlocks.push({...base,id:uid()});
 if(f.repeat){for(let w=1;w<=4;w++)db.plannerBlocks.push({...base,id:uid(),weekStart:dateAdd(plannerWeekStart,w*7),done:false,repeat:false})}
 save();closeModal();render();
}
function deletePlannerBlock(id){if(!confirm('確定刪除此讀書時段？'))return;db.plannerBlocks=db.plannerBlocks.filter(b=>b.id!==id);save();closeModal();render()}
function togglePlannerBlock(id,done){ensurePlannerData();const b=db.plannerBlocks.find(x=>x.id===id);if(b){b.done=done;b.completedAt=done?isoToday():null}save();render();if(done)petCelebrate('讀書打卡成功！再接再厲！✨')}
function copyPlannerWeek(){ensurePlannerData();showModal(`<h3 class="text-xl font-black mb-3">複製本週讀書計畫</h3><p class="text-sm text-slate-400 mb-4">將目前這週的所有時段複製到指定的未來週次；已存在的時段不會被刪除。</p><form onsubmit="copyPlannerToWeek(event)"><label>目標週一日期</label><input class="field" type="date" name="target" required min="${dateAdd(plannerWeekStart,7)}" value="${dateAdd(plannerWeekStart,7)}"><div class="flex gap-2 mt-4"><button class="btn primary flex-1" type="submit">複製計畫</button><button class="btn" type="button" onclick="closeModal()">取消</button></div></form>`)}
function copyPlannerToWeek(ev){ev.preventDefault();const target=mondayOf(new FormData(ev.target).get('target'));if(target===plannerWeekStart){alert('請選擇其他週次。');return}const source=db.plannerBlocks.filter(b=>b.weekStart===plannerWeekStart);if(!source.length){alert('本週沒有可複製的讀書時段。');return}source.forEach(b=>db.plannerBlocks.push({...b,id:uid(),weekStart:target,done:false,legacyPlanId:undefined,legacyStepIndex:undefined}));save();plannerWeekStart=target;closeModal();render()}
function planPage(){ensurePlannerData();const dates=Array.from({length:7},(_,i)=>dateAdd(plannerWeekStart,i));const blocks=db.plannerBlocks.filter(b=>b.weekStart===plannerWeekStart);if(!dates.includes(plannerSelectedDate))plannerSelectedDate=isoToday()>=dates[0]&&isoToday()<=dates[6]?isoToday():dates[0];
 const START_MIN=8*60,END_MIN=22*60,PPM=1,TLH=(END_MIN-START_MIN)*PPM;
 const mins=t=>{const [h,m]=String(t||'08:00').split(':').map(Number);return h*60+m};
 const taskHtml=(b,day)=>{const top=Math.max(0,(mins(b.start)-START_MIN)*PPM),height=Math.max(34,(mins(b.end)-mins(b.start))*PPM);return `<div class="planner-event ${b.done?'is-done':''}" style="top:${top}px;height:${height}px;--event-bg:${COLORS[(b.color||0)%COLORS.length][0]};--event-fg:${COLORS[(b.color||0)%COLORS.length][1]}" onclick="event.stopPropagation();plannerBlockForm('${b.id}')"><div class="planner-event-head"><input class="check !w-4 !h-4" type="checkbox" ${b.done?'checked':''} aria-label="完成${escapeHtml(b.subject)}" onclick="event.stopPropagation()" onchange="togglePlannerBlock('${b.id}',this.checked)"><b>${escapeHtml(b.subject)}</b><span class="planner-edit">✎</span></div><div class="planner-event-scope">${escapeHtml(b.scope)}</div><div class="planner-event-time">${escapeHtml(b.start)} – ${escapeHtml(b.end)}</div></div>`};
 const dayIndex=(new Date(plannerSelectedDate+'T12:00:00').getDay()+6)%7,dayBlocks=blocks.filter(b=>b.day===dayIndex).sort((a,b)=>a.start.localeCompare(b.start));
 const timeRail=`<div class="planner-time-rail" style="height:${TLH}px">${Array.from({length:15},(_,i)=>`<div style="top:${i*60}px">${String(i+8).padStart(2,'0')}:00</div>`).join('')}</div>`;
 const dayLane=(day)=>`<div class="planner-lane" style="height:${TLH}px" onclick="plannerBlockForm('',${day},plannerTimeFromClick(event,this))">${Array.from({length:14},(_,i)=>`<div class="planner-hour-line" style="top:${i*60}px"></div>`).join('')}${blocks.filter(b=>b.day===day&&mins(b.start)<END_MIN&&mins(b.end)>START_MIN).sort((a,b)=>a.start.localeCompare(b.start)).map(b=>taskHtml(b,day)).join('')}</div>`;
 const headers=dates.map((d,i)=>`<button class="planner-day ${d===isoToday()?'today':''}" onclick="selectPlannerDay('${d}')"><b>${['一','二','三','四','五','六','日'][i]}</b><small>${fmt(d)}</small></button>`).join('');
 const grid=`<div class="planner-timeline-wrap"><div class="planner-timeline-grid"><div class="planner-timeline-head"><div class="planner-corner">時間</div>${headers}</div><div class="planner-timeline-body">${timeRail}${dates.map((d,i)=>dayLane(i)).join('')}</div></div></div>`;
 const dayView=`<div class="planner-day-timeline"><div class="planner-day-date">${fmt(plannerSelectedDate,{month:'long',day:'numeric',weekday:'long'})} · ${dayBlocks.length} 個時段</div><div class="planner-day-body">${timeRail}${dayLane(dayIndex)}</div></div>`;

function plannerTimeFromClick(ev,lane){const r=lane.getBoundingClientRect();const minute=Math.max(0,Math.min(14*60-1,Math.floor((ev.clientY-r.top))));const total=8*60+minute;return String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0')}

function shiftWeek(n){weekStart=dateAdd(weekStart,n);render()}function backToday(){weekStart=mondayOf(isoToday());selectedDate=isoToday();render()}
function nearestDateForCourse(day,period){
 const today=isoToday(),todayDow=(new Date(today+'T12:00:00').getDay()+6)%7;
 let delta=(day-todayDow+7)%7;
 const now=new Date(), start=PERIODS[period][0].split(':').map(Number), classMinutes=start[0]*60+start[1];
 if(delta===0 && (now.getHours()*60+now.getMinutes())>=classMinutes) delta=7;
 return dateAdd(today,delta);
}

i>請 AI 僅輸出符合範例格式的 JSON 陣列。</li><li>複製 AI 回覆的 JSON，貼到輸入框，再按「確認匯入並自動排除」。</li></ol><button type="button" class="btn primary w-full" onclick="generateAndCopyCoursePrompt()">✨ 一鍵產生並複製提示詞</button><label class="block mt-4 mb-1">AI 產生的 JSON 課表</label><textarea id="aiCourseJsonInput" class="field" rows="7" placeholder='貼上 JSON，例如：[{"day":0,"period":0,"subject":"國文","room":"301","teacher":"王老師","items":["課本","習作"]}]'></textarea><p class="text-xs text-slate-500 mt-2">星期可用 0–6（0=星期一、6=星期日），節次使用 0 起算（0=第 1 節）。也支援星期一～星期日與第 1 節等文字格式。</p><button type="button" class="btn w-full mt-3" onclick="importAICoursesFromSettings()">📥 確認匯入並自動排除</button><p id="aiCourseImportStatus" class="text-xs text-cyan-200 mt-2" aria-live="polite"></p></section><button class="btn w-full mt-3" onclick="if(confirm('確定要清除所有課表、考試、任務與計畫？此動作無法復原。')){localStorage.removeItem(KEY);db=defaultData();ensureExtras();save();closeModal();render()}">清除全部資料</button><button class="btn w-full mt-3" onclick="closeModal()">完成</button>`);const settingsBackdrop=document.querySelector("#modalRoot .modal-backdrop"),settingsPanel=document.querySelector("#modalRoot .modal");settingsBackdrop?.classList.add("settings-modal-backdrop");settingsPanel?.classList.add("settings-modal-panel");updateAccountUI();renderCustomApiKeys();
 // 將原有設定區塊收納成分類卡片，內容與原本的表單/事件保持不變。

function buildAICoursePrompt(){return `你是精準的課表圖片辨識與 JSON 轉換器。請辨識我附上的課表圖片，將每一堂「常態課程」轉換成系統可匯入的 JSON 陣列。請嚴格遵守：
1. 只輸出合法 JSON，不要 Markdown 程式碼圍欄、說明文字或註解。
2. 每筆課程包含 day、period、subject、room、teacher、items 欄位。
3. day 使用整數：0=星期一、1=星期二、2=星期三、3=星期四、4=星期五、5=星期六、6=星期日。
4. period 使用從 0 起算的整數：0=第 1 節、1=第 2 節，以此類推。請依圖片上的節次欄位判斷，不要把時間鐘點誤當節次。
5. subject 是科目名稱；room 是教室，teacher 是老師姓名。看不清楚或圖片未提供時使用空字串，不要猜測。
6. items 是該課需攜帶物品的字串陣列；若圖片沒有相關資訊，請使用 []。只有圖片明確列出物品時才填入。
7. 不要輸出空白格、午休、下課或非課程活動；如果圖片中有明確課程，請保留每一堂。
8. 不要自行合併不同節次的課程；同一科目連堂時，每一節各輸出一筆。
9. 輸出格式範例：
[
  {"day":0,"period":0,"subject":"國文","room":"301","teacher":"王老師","items":["國文課本","習作"]},
  {"day":0,"period":1,"subject":"英文","room":"語言教室","teacher":"陳老師","items":[]}
]
請以我附上的課表圖片為唯一依據，逐格檢查星期與節次，最後只回傳 JSON 陣列。`}
async function generateAndCopyCoursePrompt(){const prompt=buildAICoursePrompt();try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(prompt)}else{const ta=document.createElement('textarea');ta.value=prompt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('clipboard unavailable')}showToast('已複製 AI 提示詞，請前往 AI 貼上並附上圖片');const status=document.getElementById('aiCourseImportStatus');if(status)status.textContent='已複製 AI 提示詞，請前往 AI 貼上並附上圖片。'}catch(e){console.warn('複製提示詞失敗',e);showModal(`<h3 class="text-lg font-bold mb-2">AI 課表轉換提示詞</h3><p class="text-sm text-slate-400 mb-3">瀏覽器未允許自動複製，請長按下方文字全選複製。</p><textarea class="field" rows="12" readonly>${escapeHtml(prompt)}</textarea><button class="btn primary w-full mt-3" onclick="closeModal()">完成</button>`);}}
function normalizeAICourseDay(v){if(typeof v==='number'&&Number.isInteger(v)&&v>=0&&v<=6)return v;const t=String(v??'').trim().toLowerCase();const m=t.match(/(?:星期|週|周|礼拜|礼拜)?\s*([一二三四五六日天1-7])/);if(!m)return null;const map={'一':0,'二':1,'三':2,'四':3,'五':4,'六':5,'日':6,'天':6,'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'7':6};return map[m[1]]??null}
function normalizeAICoursePeriod(v){if(typeof v==='number'&&Number.isInteger(v)&&v>=0&&v<PERIODS.length)return v;const t=String(v??'').trim();let m=t.match(/第\s*(\d+)\s*節/);if(m){const n=Number(m[1]);return n>=1&&n<=PERIODS.length?n-1:null}if(/^\d+$/.test(t)){const n=Number(t);if(n>=0&&n<PERIODS.length)return n;if(n>=1&&n<=PERIODS.length)return n-1}return null}
function importAICoursesFromSettings(){const input=document.getElementById('aiCourseJsonInput'),status=document.getElementById('aiCourseImportStatus');if(!input)return;let parsed;try{let raw=input.value.trim();if(!raw)throw new Error('請先貼上 AI 產生的 JSON。');raw=raw.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');parsed=JSON.parse(raw);if(!Array.isArray(parsed)){if(parsed&&Array.isArray(parsed.courses))parsed=parsed.courses;else throw new Error('JSON 頂層必須是陣列，或是包含 courses 陣列的物件。')}if(!parsed.length)throw new Error('JSON 陣列目前是空的。');}catch(e){if(status)status.textContent='匯入失敗：'+e.message;showToast('JSON 格式錯誤，請確認 AI 回覆內容');return}
 const normalized=[],errors=[];parsed.forEach((item,i)=>{if(!item||typeof item!=='object'){errors.push(`第 ${i+1} 筆不是物件`);return}const day=normalizeAICourseDay(item.day??item.weekday??item.weekDay??item.week),period=normalizeAICoursePeriod(item.period??item.lesson??item.section);const subject=String(item.subject??item.course??item.name??'').trim();if(day===null||period===null||!subject){errors.push(`第 ${i+1} 筆缺少有效的星期、節次或科目名稱`);return}const items=Array.isArray(item.items)?item.items:Array.isArray(item.supplies)?item.supplies:Array.isArray(item.bringItems)?item.bringItems:[];normalized.push({day,period,subject,room:String(item.room??item.classroom??'').trim(),teacher:String(item.teacher??item.instructor??'').trim(),items:items.map(x=>String(x).trim()).filter(Boolean),color:Number.isInteger(Number(item.color))&&Number(item.color)>=0?Number(item.color)%COLORS.length:(day+period)%COLORS.length})});if(!normalized.length){const msg='沒有可匯入的有效課程。'+(errors.length?' '+errors.slice(0,3).join('；'):'');if(status)status.textContent=msg;showToast('找不到有效課程，請檢查 JSON');return}
 // 同一份 JSON 若同格重複，保留最後一筆；與既有常態課表同格時，以匯入資料更新，其他格保留。
 const unique=new Map();normalized.forEach(c=>unique.set(`${c.day}:${c.period}`,c));const incoming=[...unique.values()];let replaced=0,added=0;db.courses ||= [];db.tasks ||= [];db.prepItems ||= [];
 incoming.forEach(c=>{const old=db.courses.find(x=>Number(x.day)===c.day&&Number(x.period)===c.period);let courseId;if(old){courseId=old.id;Object.assign(old,c,{id:courseId});replaced++}else{courseId=uid();db.courses.push({...c,id:courseId});added++}
 // 將圖片中明確辨識的攜帶物品綁定到該課程；不重複新增同名、同課程物品。
 c.items.forEach(name=>{const exists=db.prepItems.some(x=>x.courseId===courseId&&String(x.name||'').trim()===name);if(!exists)db.prepItems.push({id:uid(),name,courseId,done:false,createdAt:isoToday(),note:'由 AI 課表匯入'})});
 // 同步更新此課程對應的矩陣課程任務，不重複建立。
 let task=db.tasks.find(x=>x.courseId===courseId&&x.taskKind==='course');if(task){task.title=c.subject;task.subject=c.subject;task.note=`常態課程：星期${c.day+1}第${c.period+1}節`}else db.tasks.push({id:uid(),title:c.subject,subject:c.subject,due:'',taskKind:'course',quadrant:'schedule',done:false,note:`常態課程：星期${c.day+1}第${c.period+1}節`,courseId});
 });save();render();const msg=`匯入完成：新增 ${added} 堂、更新覆蓋 ${replaced} 堂，已自動排除同格重複。`+(errors.length?` 略過 ${errors.length} 筆格式不完整資料。`:'');if(status)status.textContent=msg;showToast(`課表匯入完成！新增 ${added} 堂、更新 ${replaced} 堂`);}

function addRecurringInstances(collection,item,dateField){const type=item.recurrenceType||'none';collection.push(item);if(type==='none')return;const start=item[dateField];if(!start)return;const step=type==='weekly'?7:type==='biweekly'?14:type==='interval'?Math.max(1,Math.min(365,Number(item.intervalDays)||3)):0;if(!step)return;const group=item.recurrenceGroupId||item.id;item.recurrenceGroupId=group;item.recurrenceMaster=true;const maxDate=dateAdd(start,180);for(let d=dateAdd(start,step);d<=maxDate;d=dateAdd(d,step)){const copy={...item,id:uid(),[dateField]:d,done:false,completedAt:null,createdAt:isoToday(),recurrenceMaster:false,recurrenceGenerated:true,recurrenceGroupId:group,recurrenceType:type,recurringCompletedDates:[]};collection.push(copy)}}

async function submitForm(ev,type,editId){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target).entries());if(type==='snap'){try{const form=ev.target;const file=(form.querySelector('#snapCameraInput')?.files?.[0]||form.querySelector('#snapAlbumInput')?.files?.[0]);if(!file){showToast('請先拍照或從相簿選擇圖片','error');return}if(!file.type.startsWith('image/')){showToast('請選擇圖片檔案','error');return}if(file.size>20*1024*1024){showToast('原始圖片太大，請選擇 20 MB 以下的圖片','error');return}let imageData=await compressSnapImage(file);const noteId=uid();if(currentUser&&cloudStorage){try{const blob=await (await fetch(imageData)).blob();const ref=cloudStorage.ref(`users/${currentUser.uid}/snapNotes/${noteId}.jpg`);await ref.put(blob,{contentType:'image/jpeg'});imageData=await ref.getDownloadURL()}catch(uploadErr){console.warn('照片雲端上傳未完成，先保存在本機',uploadErr)}}db.snapNotes ||= [];db.snapNotes.unshift({id:noteId,title:f.title.trim(),subject:f.subject||'',note:f.note||'',image:imageData,status:'pending',createdAt:isoToday(),createdAtTime:new Date().toISOString(),completedAt:null});save();closeModal();page='snapnotes';document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));render();if(typeof updateBottomNavIndicator==='function')requestAnimationFrame(updateBottomNavIndicator);showToast('已加入回家補抄清單 📸');return}catch(err){console.error(err);showToast('圖片處理失敗，請改選其他照片','error');return}}if(type==='prep'){db.prepItems ||= [];if(editId){const old=db.prepItems.find(x=>x.id===editId);if(old){const group=old.recurrenceGroupId||old.id;db.prepItems=db.prepItems.filter(x=>x.id!==editId&&x.recurrenceGroupId!==group)}}const item={...f,id:editId||uid(),done:false,createdAt:isoToday(),recurrenceType:f.recurrenceType||'none',intervalDays:Number(f.intervalDays)||3};addRecurringInstances(db.prepItems,item,'prepDate')}
if(type==='exam'){if(editId){const old=db.exams.find(x=>x.id===editId);if(old){const group=old.recurrenceGroupId||old.id;db.exams=db.exams.filter(x=>x.id!==editId&&x.recurrenceGroupId!==group)}}const item={...f,quadrant:f.quadrant||'schedule',done:false,id:editId||uid(),recurrenceType:f.recurrenceType||'none',intervalDays:Number(f.intervalDays)||3};addRecurringInstances(db.exams,item,'date')}
if(type==='task'){if(editId){const old=db.tasks.find(x=>x.id===editId);if(old){const group=old.recurrenceGroupId||old.id;db.tasks=db.tasks.filter(x=>x.id!==editId&&x.recurrenceGroupId!==group)}}const item={...f,weeklyRecurring:false,recurringDay:f.recurringDay===''?null:Number(f.recurringDay),recurringPeriod:f.recurringPeriod===''?null:Number(f.recurringPeriod),recurringCompletedDates:[],recurrenceType:f.recurrenceType||'none',intervalDays:Number(f.intervalDays)||3,taskKind:f.taskKind||'other',quadrant:f.quadrant||'schedule',done:false,id:editId||uid()};addRecurringInstances(db.tasks,item,'due')}
if(type==='course'){let c={...f,id:editId||uid(),day:+f.day,period:+f.period,color:+f.color};if(editId)db.courses=db.courses.map(x=>x.id===editId?c:x);else {db.courses.push(c);db.tasks.push({id:uid(),title:f.subject,subject:f.subject,due:'',taskKind:'course',quadrant:f.quadrant||'schedule',done:false,note:`常態課程：星期${(+f.day)+1}第${(+f.period)+1}節`,courseId:c.id})}}
if(type==='override'){let date=f.date,period=+f.period;db.overrides[date] ||= {};if(f.mode==='cancel')db.overrides[date][period]='cancel';else db.overrides[date][period]={id:uid(),day:(new Date(date+'T12:00:00').getDay()+6)%7,period,subject:f.subject,room:f.room,teacher:f.teacher,color:+f.color,oneDay:true};}
if(type==='plan'){let scope=f.scope.split('\n').map(s=>s.trim()).filter(Boolean);if(!scope.length)scope=['複習'+f.subject+'重點','完成練習題','整理錯題與複習'];let start=isoToday(),end=f.examDate,total=Math.max(1,Math.ceil((new Date(end+'T12:00:00')-new Date(start+'T12:00:00'))/86400000));let steps=scope.map((s,i)=>({text:s,date:dateAdd(start,Math.min(total-1,Math.floor(i*total/scope.length))),done:false}));db.plans.push({id:uid(),...f,steps})}
save();closeModal();render()}

 let el=document.getElementById('appToast');if(!el){el=document.createElement('div');el.id='appToast';el.className='app-toast';el.setAttribute('role','status');el.setAttribute('aria-live','polite');document.body.appendChild(el)}
 el.textContent=(kind==='error'?'⚠️ ':kind==='loading'?'⏳ ':'✓ ')+message;el.classList.add('show');clearTimeout(showToast.timer);if(kind!=='loading')showToast.timer=setTimeout(()=>el.classList.remove('show'),3600);
}
function exportData(includeKeys){
  try {
    save();
    const safeData = JSON.parse(JSON.stringify(db));
    if(!includeKeys && safeData.settings) delete safeData.settings.apiKeys;
    const payload = {app:'拾光自習',formatVersion:2,exportedAt:new Date().toISOString(),data:safeData};
    if(includeKeys){
      payload.firebaseConfig = {...FIREBASE_CONFIG};
      payload.customApiKeys = {...(db.settings?.apiKeys||{})};
      payload.includesSensitiveSettings = true;
    }
    const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
    const url = URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download='拾光自習完整備份-'+isoToday()+'.json'; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
    showToast(includeKeys?'已匯出資料與設定（含金鑰，請妥善保管）':'已匯出學習資料備份');
  } catch(err){console.error('資料備份失敗：',err);showToast('備份失敗，請確認裝置儲存空間。','error')}
}
function importData(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      const incoming=(parsed&&parsed.data&&typeof parsed.data==='object')?parsed.data:parsed;
      if(!incoming||!Array.isArray(incoming.courses)||!Array.isArray(incoming.tasks)||!Array.isArray(incoming.exams))throw new Error('備份格式不正確');
      if(!confirm('匯入會以備份檔的學習資料取代目前資料。建議先匯出現有資料。確定繼續嗎？'))return;
      const hasConfig=parsed&&parsed.firebaseConfig&&typeof parsed.firebaseConfig==='object';
      db=incoming;ensureExtras();
      if(parsed&&parsed.customApiKeys&&typeof parsed.customApiKeys==='object')db.settings.apiKeys={...parsed.customApiKeys};
      save();
      if(hasConfig){
        const safe={};['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'].forEach(k=>{if(typeof parsed.firebaseConfig[k]==='string')safe[k]=parsed.firebaseConfig[k]});
        localStorage.setItem(FIREBASE_CONFIG_STORAGE_KEY,JSON.stringify({...FIREBASE_CONFIG_DEFAULT,...safe}));
      }
      closeModal();render();
      if(hasConfig){alert('學習資料與 Firebase 設定已匯入。為讓 Firebase 設定生效，請重新載入頁面；若在 APK 中，請關閉後重新開啟。')}
      else alert('學習資料匯入成功');
    }catch(e){console.error(e);alert('檔案格式不正確，請選擇有效的拾光自習 JSON 備份檔。')}
  };
  reader.onerror=()=>alert('無法讀取檔案，請重新選擇備份檔。');reader.readAsText(file);
}
function saveFirebaseSettings(ev){
  ev.preventDefault();const form=ev.currentTarget;const next={};
  ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'].forEach(k=>{next[k]=String(form.elements[k]?.value||'').trim()});
  if(next.apiKey&&!next.projectId){showToast('填寫 Firebase API Key 時也必須填寫 Project ID。','error');return}
  try{localStorage.setItem(FIREBASE_CONFIG_STORAGE_KEY,JSON.stringify({...FIREBASE_CONFIG_DEFAULT,...next}));showToast('Firebase 設定已儲存；重新載入後套用。');if(confirm('Firebase 設定已儲存。現在重新載入頁面以套用設定嗎？'))location.reload()}catch(e){showToast('無法儲存 Firebase 設定。','error')}
}
function addCustomApiKey(){

  if(!name||!key){showToast('請輸入服務名稱與 API 金鑰。','error');return}
  db.settings ||= {};db.settings.apiKeys ||= {};db.settings.apiKeys[name]=key;save();
  const n=document.getElementById('customApiName'),v=document.getElementById('customApiValue');if(n)n.value='';if(v)v.value='';renderCustomApiKeys();showToast('API 設定已儲存於本機');
}

function previewSnapImage(input){const file=input.files?.[0];if(!file)return;const otherId=input.id==='snapCameraInput'?'snapAlbumInput':'snapCameraInput';const other=document.getElementById(otherId);if(other)other.value='';const wrap=document.getElementById('snapPreviewWrap'),img=document.getElementById('snapPreview');if(wrap&&img){img.src=URL.createObjectURL(file);wrap.classList.remove('hide')}}
function compressSnapImage(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{const max=1440,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.72))}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image decode failed'))};img.src=url})}
function snapNotesPage(){ensureExtras();const notes=db.snapNotes||[],pending=notes.filter(n=>n.status!=='done'),done=notes.filter(n=>n.status==='done');const cardHtml=n=>`<article class="snap-card"><button class="w-full text-left" onclick="viewSnapNote('${n.id}')"><img class="snap-thumb mb-3" src="${n.image}" alt="${escapeHtml(n.title)}" loading="lazy"><div class="flex items-start justify-between gap-2"><b class="font-bold">${escapeHtml(n.title||'未命名筆記')}</b><span class="snap-status ${n.status==='done'?'done':'pending'}">${n.status==='done'?'已補抄':'待補抄'}</span></div><p class="text-xs text-cyan-200 mt-2">${escapeHtml(n.subject||'未指定科目')} · ${escapeHtml(n.createdAt||'')}</p>${n.note?`<p class="text-sm text-slate-400 mt-2 line-clamp-3">${escapeHtml(n.note)}</p>`:''}</button><div class="grid grid-cols-2 gap-2 mt-3"><button class="btn ${n.status==='done'?'':'primary'}" onclick="toggleSnapDone('${n.id}')">${n.status==='done'?'↩ 撤回補抄':'✓ 已完成補抄'}</button><button class="btn" onclick="deleteSnapNote('${n.id}')">🗑 刪除</button></div></article>`;return `<div class="flex items-start justify-between gap-3 mb-4"><div><h2 class="text-2xl font-black">📸 黑板補抄相簿</h2><p class="text-sm text-slate-400 mt-1">拍下黑板、講義或截圖，回家再慢慢補齊。</p></div><button class="btn primary" onclick="openAdd('snap')">＋ 新增</button></div><div class="grid grid-cols-2 gap-2 mb-4"><div class="glass rounded-2xl p-3"><div class="text-xs text-slate-400">待補抄</div><div class="text-2xl font-black text-amber-200">${pending.length}</div></div><div class="glass rounded-2xl p-3"><div class="text-xs text-slate-400">已封存</div><div class="text-2xl font-black text-emerald-200">${done.length}</div></div></div><h3 class="font-bold mb-3">🟡 待補抄清單</h3>${pending.length?`<div class="grid grid-cols-2 gap-3">${pending.map(cardHtml).join('')}</div>`:'<div class="taskrow text-sm text-slate-400 mb-5">目前沒有待補抄筆記。課堂上遇到來不及抄的內容，可以直接拍照加入。</div>'}<details class="glass rounded-2xl p-4 mt-5 mb-6"><summary class="font-bold cursor-pointer">✅ 已完成／封存（${done.length ll></span><span>›</span></button><div class="text-xs text-slate-500 tracking-widest mt-5 mb-2 px-2">系統</div><button class="drawer-link" onclick="closeDrawer();openSettings()"><span class="drawer-icon">⚙️</span><span class="flex-1">系統設定與資料管理<small class="block text-xs text-slate-400 font-normal mt-1">備份、匯入、匯出與重置</small></span><span>›</span></button><button class="drawer-link" onclick="closeDrawer();go('today')"><span class="drawer-icon">⌂</span><span class="flex-1">回到今日首頁</span><span>›</span></button><div class="text-xs text-slate-500 mt-6 px-2" id="cloudDrawerStatus">${escapeHtml(cloudStatus)}</div></aside></div>`;

function formatDuration(sec){sec=Math.max(0,Math.floor(sec||0));let h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60);return h?`${h} 小時 ${m} 分鐘`:`${m} 分鐘`}
const POMO_DEFAULTS={focus:25,shortBreak:5,longBreak:15,cycles:4};
function getPomoSettings(){
 db.settings ||= {};
 db.settings.pomodoro ||= {...POMO_DEFAULTS};
 for(const k of Object.keys(POMO_DEFAULTS)){
  const v=Number(db.settings.pomodoro[k]);
  db.settings.pomodoro[k]=Number.isFinite(v)?Math.max(1,Math.min(k==='cycles'?20:180,Math.round(v))):POMO_DEFAULTS[k];
 }
 return db.settings.pomodoro;
}
let pomoSettings=getPomoSettings();
let pomo={mode:'focus',duration:pomoSettings.focus*60,remaining:pomoSettings.focus*60,running:false,startedAt:0,interval:null,completed:0,round:1};
function pomoDuration(mode){const s=getPomoSettings();return (mode==='focus'?s.focus:mode==='longBreak'?s.longBreak:s.shortBreak)*60}
function pomoSetMode(mode){if(pomo.running)return;pomo.mode=mode;pomo.duration=pomoDuration(mode);pomo.remaining=pomo.duration;renderPomoModal()}
function pomoSaveSettings(){
 const fields=['focus','shortBreak','longBreak','cycles'];
 for(const key of fields){const el=document.getElementById('pomoCfg_'+key);if(!el)continue;const max=key==='cycles'?20:180;let n=Math.round(Number(el.value));if(!Number.isFinite(n))n=POMO_DEFAULTS[key];n=Math.max(1,Math.min(max,n));el.value=n;pomoSettings[key]=n;}
 db.settings.pomodoro={...pomoSettings};save();
 if(!pomo.running){pomo.duration=pomoDuration(pomo.mode);pomo.remaining=pomo.duration;pomo.completed=Math.min(pomo.completed,pomoSettings.cycles);pomo.round=Math.min(pomoSettings.cycles,pomo.completed+1);}
 renderPomoModal();
}
function openPomodoro(){pomoSettings=getPomoSettings();renderPomoModal()}

 const s=getPomoSettings(),isFocus=pomo.mode==='focus',progress=pomo.duration?Math.min(100,(pomo.duration-pomo.remaining)/pomo.duration*100):0;
 const modeName=pomo.mode==='focus'?'專注時間':pomo.mode==='longBreak'?'長休息':'短暫休息';

 showModal(`<div class="flex justify-between items-start gap-3"><div><h3 class="text-xl font-black">🍅 番茄鐘專注計時器</h3><p class="text-sm text-slate-400 mt-1">自訂時間與循環，依自己的節奏學習。</p></div><button class="text-slate-400 text-xl" onclick="closeModal()">×</button></div>
 <div class="grid grid-cols-3 gap-2 mt-4"><button class="pill ${pomo.mode==='focus'?'selected':''}" onclick="pomoSetMode('focus')">專注 ${s.focus} 分</button><button class="pill ${pomo.mode==='shortBreak'?'selected':''}" onclick="pomoSetMode('shortBreak')">短休 ${s.shortBreak} 分</button><button class="pill ${pomo.mode==='longBreak'?'selected':''}" onclick="pomoSetMode('longBreak')">長休 ${s.longBreak} 分</button></div>
 <div class="flex justify-center mt-5"><div class="timer-ring" style="--progress:${progress}%"><div class="timer-inner"><div class="text-xs text-slate-400 mb-1">${modeName}</div><div class="timer-time" id="pomoTime">${String(Math.floor(pomo.remaining/60)).padStart(2,'0')}:${String(pomo.remaining%60).padStart(2,'0')}</div><div class="text-xs text-slate-500 mt-1" id="pomoStatus">${pomo.running?'進行中':'準備開始'}</div></div></div></div>
 <div class="text-center mt-3"><span class="text-cyan-300 font-bold" id="pomoRound">第 ${displayRound} / ${s.cycles} 輪</span><span class="text-xs text-slate-500 ml-2">已完成 ${pomo.completed} 輪</span></div>
 <div class="grid grid-cols-2 gap-3 mt-5"><button class="btn primary" onclick="pomoToggle()">${pomo.running?'暫停':'開始'}</button><button class="btn" onclick="pomoReset()">重置本輪</button></div>

 <div class="grid grid-cols-2 gap-3 mt-4"><div class="taskrow"><div class="text-xs text-slate-400">今日專注總時間</div><div class="text-lg font-black mt-1">${formatDuration(db.focusStats.seconds)}</div></div><div class="taskrow"><div class="text-xs text-slate-400">完成番茄鐘次數</div><div class="text-lg font-black mt-1">${db.focusStats.pomodoros} 次</div></div></div><p class="text-xs text-slate-500 mt-3">倒數結束會播放提示聲；若瀏覽器支援通知，也會顯示系統提醒。計時時請保持頁面開啟。</p>`);
}
function pomoToggle(){if(pomo.running){pomoPause();return}if(pomo.remaining<=0)pomo.remaining=pomoDuration(pomo.mode);pomo.running=true;pomo.startedAt=Date.now();pomo.interval=setInterval(pomoTick,250);renderPomoModal()}
function pomoPause(redraw=true){if(pomo.running){pomoTick();pomo.running=false;clearInterval(pomo.interval);pomo.interval=null}if(redraw&&document.getElementById('modalRoot').innerHTML.includes('番茄鐘'))renderPomoModal()}
function pomoReset(){pomoPause(false);pomo.remaining=pomoDuration(pomo.mode);pomo.duration=pomoDuration(pomo.mode);renderPomoModal()}
function pomoNotify(title,body){playChime();if('Notification'in window&&Notification.permission==='granted'){try{new Notification(title,{body})}catch(e){}}}
function pomoTick(){
 if(!pomo.running)return;
 const now=Date.now(),elapsed=Math.max(0,Math.floor((now-pomo.startedAt)/1000));if(!elapsed)return;

// 強化 JSON 匯入：同時還原學習資料、Firebase 設定與自訂 API 金鑰。
// 支援新版 {data, firebaseConfig, customApiKeys} 與舊版直接匯出資料格式。
importData=function(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      if(!parsed||typeof parsed!=='object'||Array.isArray(parsed))throw new Error('JSON 根節點必須是物件');
      const incoming=(parsed.data&&typeof parsed.data==='object'&&!Array.isArray(parsed.data))?parsed.data:parsed;
      if(!incoming||!Array.isArray(incoming.courses)||!Array.isArray(incoming.tasks)||!Array.isArray(incoming.exams))throw new Error('備份格式不正確');
      const configSource=(parsed.firebaseConfig&&typeof parsed.firebaseConfig==='object')?parsed.firebaseConfig:
        ((parsed.data&&parsed.data.firebaseConfig&&typeof parsed.data.firebaseConfig==='object')?parsed.data.firebaseConfig:null);
      const apiSource=(parsed.customApiKeys&&typeof parsed.customApiKeys==='object')?parsed.customApiKeys:
        ((incoming.settings&&incoming.settings.apiKeys&&typeof incoming.settings.apiKeys==='object')?incoming.settings.apiKeys:null);
      const hasConfig=!!configSource;
      const hasApiKeys=!!apiSource;
      if(!confirm(`匯入備份會以檔案內容取代目前學習資料。${hasConfig||hasApiKeys?'此檔案也含有設定／API 金鑰，匯入後會一併還原。':''}建議先匯出目前資料。確定繼續嗎？`))return;
      db=incoming;ensureExtras();
      if(hasApiKeys)db.settings.apiKeys={...apiSource};
      save();
      if(hasConfig){
        const safe={};['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'].forEach(k=>{if(typeof configSource[k]==='string')safe[k]=configSource[k]});
        localStorage.setItem(FIREBASE_CONFIG_STORAGE_KEY,JSON.stringify({...FIREBASE_CONFIG_DEFAULT,...safe}));
        FIREBASE_CONFIG={...FIREBASE_CONFIG_DEFAULT,...safe};
      }
      closeModal();render();
      if(hasConfig){alert('學習資料與 Firebase 設定已匯入。'+(hasApiKeys?'自訂 API 金鑰也已還原。':'未從備份還原自訂 API 金鑰。')+'Firebase 設定需重新載入頁面後套用。請妥善保管含金鑰的備份檔。');}
      else if(hasApiKeys)alert('學習資料與自訂 API 金鑰已匯入。請妥善保管含金鑰的備份檔。');
      else alert('學習資料匯入成功');
    }catch(e){console.error('JSON 匯入失敗：',e);alert('匯入失敗：JSON 格式不正確，或不是有效的拾光自習備份檔。請確認檔案完整後再試。')}
  };
  reader.onerror=()=>alert('無法讀取檔案，請重新選擇備份檔。');
  reader.readAsText(file);
};

function onTimetablePointerDown(e){const cell=e.target.closest?.('.course[data-date][data-period]');if(!cell||cell.dataset.coursePresent!=='1')return;if(e.pointerType==='mouse'&&e.button!==0)return;startTimetableDrag(cell,e.clientX,e.clientY);if(!timetableDrag)return;const pointerId=e.pointerId;dragLongPress=setTimeout(()=>{if(timetableDrag){timetableDrag.pointerId=pointerId;activateTimetableDrag(e.clientX,e.clientY)}},e.pointerType==='mouse'?220:420)}

function moveCourseSingleDay(src,dest){setOverride(src.date,src.period,'cancel');setOverride(dest.date,dest.period,src.course);save();render();petSay('課程已移到新時段！📚')}
let pendingCourseMove=null;function showRescheduleChoice(src,dest){pendingCourseMove={src,dest};const a=escapeHtml(src.course.subject||'原課程'),b=escapeHtml(dest.course.subject||'目標課程');showModal(`<div class="flex items-start justify-between gap-3"><div><h3 class="text-xl font-black">🔀 課程位置重疊</h3><p class="text-sm text-slate-400 mt-2">「${a}」要移到「${b}」所在的時段，請選擇處理方式。</p></div><button class="text-slate-400 text-xl" onclick="closeModal()">×</button></div><div class="grid gap-3 mt-5"><button class="taskrow text-left" onclick="applyCourseMove('swap')"><b>🔄 調課（互換兩堂課的時間）</b><p class="text-xs text-slate-400 mt-1">只調整目前這兩個日期的安排，不改常態課表。</p></button><button class="taskrow text-left" onclick="applyCourseMove('permanent')"><b>📌 永久更換（更新常態課表）</b><p class="text-xs text-slate-400 mt-1">更新每週固定星期與節次，未來週次也會套用。</p></button><button class="taskrow text-left" onclick="applyCourseMove('replace')"><b>⚡ 覆蓋（直接取代該時段課程）</b><p class="text-xs text-slate-400 mt-1">將目標時段改為這堂課，原目標課程不保留在此日此節。</p></button></div>`)}
function applyCourseMove(mode){if(!pendingCourseMove)return;const {src,dest}=pendingCourseMove;pendingCourseMove=null;closeModal();if(mode==='swap'){setOverride(src.date,src.period,dest.course);setOverride(dest.date,dest.period,src.course)}else if(mode==='replace'){setOverride(dest.date,dest.period,src.course);setOverride(src.date,src.period,'cancel')}else if(mode==='permanent'){const c1=db.courses.find(c=>c.id===src.course.id),c2=db.courses.find(c=>c.id===dest.course.id);if(!c1||!c2){alert('這堂課可能是單日調課項目，無法直接永久更換常態課表；請選擇「調課」或「覆蓋」。');return}const old1={day:c1.day,period:c1.period},old2={day:c2.day,period:c2.period};c1.day=dest.day;c1.period=dest.period;c2.day=old1.day;c2.period=old1.period; // 清除兩格對應日期上的舊覆蓋，讓常態課表生效
if(db.overrides?.[src.date])delete db.overrides[src.date][src.period];if(db.overrides?.[dest.date])delete db.overrides[dest.date][dest.period];}

// Bottom navigation draggable pill: pointer events cover touch, pen and mouse.
let bottomNavDrag=null;
function updateBottomNavIndicator(){
 const shell=document.querySelector('.bottom-nav-glass'),indicator=document.getElementById('bottomNavIndicator');
 if(!shell||!indicator)return;
 const buttons=[...shell.querySelectorAll('.navbtn[data-page]')];
 let active=buttons.find(b=>b.dataset.page===page)||buttons.find(b=>b.classList.contains('active'))||buttons[0];
 if(!active)return;
 const left=active.offsetLeft, width=active.offsetWidth;
 indicator.style.width=Math.max(0,width)+'px';
 if(!bottomNavDrag){indicator.style.left=left+'px';indicator.style.transform='translate3d(0,0,0)';}
 const index=buttons.indexOf(active)+1;indicator.setAttribute('aria-valuenow',String(Math.max(1,index)));
}
function finishBottomNavDrag(ev,cancelled=false){
 const indicator=document.getElementById('bottomNavIndicator'),shell=document.querySelector('.bottom-nav-glass');
 if(!bottomNavDrag||!indicator||!shell)return;
 const drag=bottomNavDrag;bottomNavDrag=null;indicator.classList.remove('dragging');
 if(!cancelled){
   const buttons=[...shell.querySelectorAll('.navbtn[data-page]')];
   const shellRect=shell.getBoundingClientRect();
   const currentLeft=parseFloat(indicator.style.left)||0;
   const currentWidth=indicator.offsetWidth;
   const center=currentLeft+currentWidth/2;
   let target=buttons.reduce((best,b)=>{const c=b.offsetLeft+b.offsetWidth/2;return Math.abs(c-center)<Math.abs(best.offsetLeft+best.offsetWidth/2-center)?b:best},buttons[0]);
   // A clear left/right swipe advances at least one adjacent destination when it passes the gesture threshold.
   const activeIndex=Math.max(0,buttons.findIndex(b=>b.dataset.page===page));
   if(Math.abs(drag.delta)>=Math.max(28,currentWidth*.28)){
     const direction=drag.delta<0?-1:1; // indicator moves left -> destination to the left
     const nextIndex=Math.max(0,Math.min(buttons.length-1,activeIndex+direction));
     const next=buttons[nextIndex];
     if(next && Math.abs((next.offsetLeft+next.offsetWidth/2)-center)<Math.abs((target.offsetLeft+target.offsetWidth/2)-center)+currentWidth*.35)target=next;
   }
   if(target)go(target.dataset.page);
 }
 indicator.style.transform='translate3d(0,0,0)';
 try{if(indicator.hasPointerCapture(drag.pointerId))indicator.releasePointerCapture(drag.pointerId)}catch(_){}
 requestAnimationFrame(updateBottomNavIndicator);
}
function initBottomNavIndicator(){
 const indicator=document.getElementById('bottomNavIndicator');if(!indicator||indicator.dataset.ready==='1')return;indicator.dataset.ready='1';
 indicator.addEventListener('pointerdown',ev=>{
   if(ev.button!==undefined&&ev.button!==0)return;
   const shell=indicator.parentElement;if(!shell)return;
   bottomNavDrag={pointerId:ev.pointerId,startX:ev.clientX,delta:0,startLeft:parseFloat(indicator.style.left)||0};
   indicator.classList.add('dragging');
   try{indicator.setPointerCapture(ev.pointerId)}catch(_){}
   ev.preventDefault();
 });
 indicator.addEventListener('pointermove',ev=>{
   if(!bottomNavDrag||bottomNavDrag.pointerId!==ev.pointerId)return;
   const shell=indicator.parentElement;const buttons=[...shell.querySelectorAll('.navbtn[data-page]')];
   const width=indicator.offsetWidth;const maxLeft=Math.max(0,shell.clientWidth-width);
   bottomNavDrag.delta=ev.clientX-bottomNavDrag.startX;
   const left=Math.max(0,Math.min(maxLeft,bottomNavDrag.startLeft+bottomNavDrag.delta));
   indicator.style.left=left+'px';indicator.style.transform='translate3d(0,0,0)';
   // Keep movement tied directly to pointer updates; CSS transform/left is composited by the browser.
   const center=left+width/2;let nearest=buttons.reduce((best,b)=>Math.abs(b.offsetLeft+b.offsetWidth/2-center)<Math.abs(best.offsetLeft+best.offsetWidth/2-center)?b:best,buttons[0]);
   indicator.setAttribute('aria-valuenow',String(Math.max(1,buttons.indexOf(nearest)+1)));
   ev.preventDefault();
 });
 indicator.addEventListener('pointerup',ev=>finishBottomNavDrag(ev,false));
 indicator.addEventListener('pointercancel',ev=>finishBottomNavDrag(ev,true));
 indicator.addEventListener('lostpointercapture',ev=>{if(bottomNavDrag&&bottomNavDrag.pointerId===ev.pointerId)finishBottomNavDrag(ev,true)});
 indicator.addEventListener('keydown',ev=>{
   if(!['ArrowLeft','ArrowRight','Home','End','Enter',' '].includes(ev.key))return;
   const buttons=[...document.querySelectorAll('.bottom-nav-glass .navbtn[data-page]')];if(!buttons.length)return;
   let idx=buttons.findIndex(b=>b.dataset.page===page);if(idx<0)idx=0;
   if(ev.key==='ArrowLeft')idx=Math.max(0,idx-1);else if(ev.key==='ArrowRight')idx=Math.min(buttons.length-1,idx+1);else if(ev.key==='Home')idx=0;else if(ev.key==='End')idx=buttons.length-1;
   ev.preventDefault();go(buttons[idx].dataset.page);
 });
 window.addEventListener('resize',()=>requestAnimationFrame(updateBottomNavIndicator),{passive:true});
 requestAnimationFrame(updateBottomNavIndicator);
}
render();
initBottomNavIndicator();

    const connected=mount?.isConnected?'節點已連接':'節點未連接';
    return `來源=${protocol}；API=${api?'已載入':'未載入'}；播放器=${player?'已建立':'未建立'}；就緒=${ready?'是':'否'}；容器=${size}；${connected}；${iframeState}；外層=${wrap?'存在':'不存在'}`;
  }
  window.getStudyBgmDiagnostics=function(){
    const mount=document.getElementById('studyYoutubePlayer'); const iframe=mount?.querySelector('iframe')||mount?.closest('.study-bgm-player-wrap')?.querySelector('iframe');
    return { ...window.__studyYtProgress, protocol:location.protocol, secureContext:window.isSecureContext, readyState:document.readyState, apiLoaded:!!(window.YT&&typeof window.YT.Player==='function'), apiLoading:!!studyBgmApiLoading, playerCreated:!!studyBgmPlayer, playerReady:!!studyBgmPlayerReady, mountExists:!!mount, mountConnected:!!mount?.isConnected, iframeExists:!!iframe, iframeSrc:iframe?.src||'', userAgent:navigator.userAgent, diagnostic:diagnosticText() };

  window.setStudyBgmProgress=function(percent,stage,failed=false){
    const n=Math.max(0,Math.min(100,Math.round(Number(percent)||0)));
    window.__studyYtProgress={percent:n,stage:String(stage||''),failed:!!failed};
    const box=document.getElementById('studyBgmProgress');
    const label=document.getElementById('studyBgmProgressLabel');
    const pct=document.getElementById('studyBgmProgressPercent');
    const fill=document.getElementById('studyBgmProgressFill');
    const diag=document.getElementById('studyBgmDiagnostic');

    if(label)label.textContent=(failed?'未完成：':n===100?'完成：':'初始化：')+String(stage||'');
    if(pct)pct.textContent=failed?'失敗':n+'%';
    if(fill){fill.style.width=(failed?0:n)+'%';fill.classList.toggle('failed',!!failed);}
    if(diag)diag.textContent=diagnosticText();
  };
  function clearTimer(name){if(window[name]){clearTimeout(window[name]);window[name]=null;}}
  function fail(stage,message){
    clearTimer('__studyYtLoadTimer');clearTimer('__studyYtPlayerTimer');
    studyBgmApiLoading=false;
    const localContent=location.protocol==='content:'||location.protocol==='file:';
    const sourceNote=localContent?'目前使用 '+location.protocol+' 本機內容來源，通常沒有一般 HTTPS 網站的 Referer。單靠修改 HTML 無法可靠補出該來源；請以 HTTPS 網址測試，若包成 APK，需由 WebView 使用有效的 base URL。':'';
    window.setStudyBgmProgress(0,stage,true);
    const shortMessage=String(message||'播放器初始化失敗。').split('（來源=')[0].slice(0,180);
    setStudyBgmHint(shortMessage+(sourceNote?' '+sourceNote:'')+' 完整狀態請看下方診斷列。',true);
  }
  function apiReady(){
    return !!(window.YT&&typeof window.YT.Player==='function');
  }

  window.loadStudyYoutubeApi=function(){
    if(apiReady()){
      studyBgmApiReady=true;studyBgmApiLoading=false;
      window.setStudyBgmProgress(Math.max(window.__studyYtProgress.percent,35),'YouTube API 已載入');
      window.createStudyYoutubePlayer();
      return;
    }
    if(studyBgmApiLoading){
      setStudyBgmHint('正在載入 YouTube API（'+(window.__studyYtProgress.percent||15)+'%）…');
      return;
    }
    studyBgmApiLoading=true;studyBgmApiReady=false;window.__studyYtLoadAttempt++;
    window.setStudyBgmProgress(8,'已開始請求 YouTube API');
    setStudyBgmHint('正在連線 YouTube（8%）…');

      clearTimer('__studyYtLoadTimer');
      studyBgmApiReady=apiReady();studyBgmApiLoading=false;
      if(!studyBgmApiReady){fail('API 回呼沒有有效的 YT.Player','YouTube API 回應不完整。請檢查網路、內容封鎖或 WebView 設定。');return;}

      window.createStudyYoutubePlayer();
    };

    let sc=document.querySelector('script[data-study-youtube-api="1"]')||document.querySelector('script[src*="youtube.com/iframe_api"]');
    if(sc && sc.dataset.studyYoutubeFailed==='1') { try{sc.remove()}catch(e){} sc=null; }
    const newScript=!sc;
    if(!sc){sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';sc.async=true;sc.dataset.studyYoutubeApi='1';}

      sc.dataset.studyYoutubeFailed='1';try{sc.remove()}catch(e){}

    };

  window.createStudyYoutubePlayer=function(){
    const mount=document.getElementById('studyYoutubePlayer');

    }

      const playerVars={autoplay:0,controls:1,playsinline:1,rel:0,iv_load_policy:3,enablejsapi:1};

              return;
            }
            studyBgmPendingId='';

              e.target.loadVideoById({videoId:String(pending),suggestedQuality:'small'});
              const rate=Number(document.getElementById('studyBgmRate')?.value||1);
              try{e.target.setPlaybackRate(rate)}catch(err){}
              window.setStudyBgmProgress(84,'播放器就緒，正在載入影片');
              setStudyBgmHint('播放器已就緒，正在載入影片（84%）…若沒有聲音，請再按一次播放。');
            }catch(err){studyBgmPendingId=pending;fail('載入影片失敗','播放器已就緒，但無法載入影片。請再按一次播放或換一支影片。');}
          }else{
            window.setStudyBgmProgress(72,'播放器已就緒，等待選擇曲目');
            setStudyBgmHint('播放器已就緒，請新增或選擇 BGM。');
          }
        },
        onStateChange:function(e){
          studyBgmLastState=e.data;
          const b=document.getElementById('studyBgmPlay');

            window.setStudyBgmProgress(88,'影片已排入播放佇列');setStudyBgmHint('影片已載入，若未自動播放請按「播放／暫停」。');
          }else if(e.data===YT.PlayerState.ENDED&&studyBgmLoop){
            try{studyBgmPlayer.seekTo(0,true);studyBgmPlayer.playVideo()}catch(err){}
          }
        },
        onAutoplayBlocked:function(){
          window.setStudyBgmProgress(88,'瀏覽器阻擋自動播放');
          setStudyBgmHint('播放器已就緒，但瀏覽器阻擋自動播放。請手動按「播放／暫停」開始。');
        },
        onError:function(e){
          const messages={2:'影片 ID 無效。',5:'影片無法使用 HTML5 播放器播放。',100:'影片不存在、已移除或設為私人。',101:'影片擁有者不允許嵌入播放。',150:'影片擁有者不允許嵌入播放。',153:'YouTube 沒有收到有效的 Referer／用戶端識別資訊。APK 需要使用有效的 HTTPS 網頁來源或正確的 WebView base URL。'};

      fail('建立播放器時發生例外','建立 YouTube 播放器失敗：'+(err?.message||String(err)));
    }
  };
})();
</script>

<style id="precision-glow-spring-upgrade">
/* Brighter, broader touch glow while retaining the original fade timing. */
.soft-touch-glow{width:clamp(88px,19vw,156px)!important;height:clamp(88px,19vw,156px)!important;background:radial-gradient(circle,rgba(59,130,246,.38) 0%,rgba(96,165,250,.27) 25%,rgba(139,92,246,.19) 46%,rgba(167,139,250,.08) 62%,transparent 76%)!important;filter:blur(1.2px) saturate(1.12)!important;transition:opacity .3s ease-out,transform .4s cubic-bezier(.2,.75,.25,1)!important;}
.soft-touch-glow.is-visible{opacity:1;transform:translate3d(-50%,-50%,0) scale(1)!important;}
.soft-touch-glow.is-fading{opacity:0;transform:translate3d(-50%,-50%,0) scale(1.32)!important;}
/* Stable glide: do not animate opacity or scale on the pill during page changes. */
.bottom-nav-indicator{transition:all .35s cubic-bezier(.4,0,.2,1)!important;will-change:left,width,transform;}
.bottom-nav-indicator.dragging{transition:none!important;}
/* Gentle spring-like press feedback; no layout-affecting properties are animated. */
button,.navbtn,.study-action,[role="button"]{transition:transform .24s cubic-bezier(.2,.8,.25,1.16),box-shadow .24s ease,filter .24s ease!important;}
button:active,.navbtn:active,.study-action:active,[role="button"]:active{transform:scale(.965) translateZ(0)!important;}

@media(prefers-reduced-motion:reduce){.study-card,.taskrow,.course,.matrix-card,#studyRoomFull .study-pomo-card:has(.study-ring.is-running){animation:none!important;transition:none!important}}

<script id="precision-indicator-stability">
(()=>{
 const sync=()=>{if(typeof updateBottomNavIndicator==='function')requestAnimationFrame(()=>requestAnimationFrame(updateBottomNavIndicator));};
 window.addEventListener('resize',sync,{passive:true});
 window.addEventListener('orientationchange',()=>setTimeout(sync,120),{passive:true});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});
 // Keep the pill visible and let CSS animate its geometry instead of toggling it off/on.
 const indicator=document.getElementById('bottomNavIndicator');
 if(indicator){indicator.style.visibility='visible';indicator.style.display='block';sync();}
 const room=document.getElementById('studyRoomFull');
 if(room){const observer=new MutationObserver(()=>{
   const status=room.querySelector('#studyPomoStatus');
   const running=!!status&&/專注中/.test(status.textContent||'');
   const card=room.querySelector('.study-pomo-card');
   if(card)card.classList.toggle('focus-card-running',running);
 });observer.observe(room,{subtree:true,childList:true,characterData:true,attributes:true});}
})();
</script>
